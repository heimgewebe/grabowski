name: pr889-mask-candidate

on:
  push:
    branches:
      - fix/pr889-mask-review-20260823

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pr889-mask-review-20260823
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Assert exact parent and apply bounded patch
        env:
          EXPECTED_PARENT: 5875e550d588e0f3d24ce653ac15f0fb2dd42b5c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/pr889-mask-candidate.yml"
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"replacement precondition failed: expected {expected}, got {count}: {old[:100]!r}")
              return text.replace(old, new)

          source_path = Path("src/grabowski_workers.py")
          source = source_path.read_text(encoding="utf-8")
          source = replace_exact(
              source,
              "styleIndexes.length !== 10",
              "styleIndexes.length !== 11",
              expected=2,
          )
          source = replace_exact(
              source,
              "  const overflowYText = semanticSnapshotString(strings, styleIndexes[7], 64);\n  if (visibility === null || opacityText === null || contentVisibility === null ||\n      filterText === null || clipPathText === null || clipText === null ||\n      overflowXText === null || overflowYText === null) {",
              "  const overflowYText = semanticSnapshotString(strings, styleIndexes[7], 64);\n  const maskImageText = semanticSnapshotString(strings, styleIndexes[10], 2048);\n  if (visibility === null || opacityText === null || contentVisibility === null ||\n      filterText === null || clipPathText === null || clipText === null ||\n      overflowXText === null || overflowYText === null || maskImageText === null) {",
          )
          source = replace_exact(
              source,
              "  const normalizedClipPath = clipPathText.trim().toLowerCase();\n  const normalizedClip = clipText.trim().toLowerCase();\n  const opacity = Number(opacityText.trim());",
              "  const normalizedClipPath = clipPathText.trim().toLowerCase();\n  const normalizedClip = clipText.trim().toLowerCase();\n  const normalizedMaskImage = maskImageText.trim().toLowerCase();\n  const opacity = Number(opacityText.trim());",
          )
          source = replace_exact(
              source,
              "  if ((normalizedClipPath && normalizedClipPath !== 'none') ||\n      (normalizedClip && normalizedClip !== 'auto')) {\n    return {ok: true, visible: false, clipsX: overflowX.clips, clipsY: overflowY.clips};\n  }",
              "  if (!normalizedMaskImage) {\n    return {ok: false, visible: false, clipsX: overflowX.clips, clipsY: overflowY.clips};\n  }\n  if ((normalizedClipPath && normalizedClipPath !== 'none') ||\n      (normalizedClip && normalizedClip !== 'auto') || normalizedMaskImage !== 'none') {\n    return {ok: true, visible: false, clipsX: overflowX.clips, clipsY: overflowY.clips};\n  }",
          )
          source = replace_exact(
              source,
              "computedStyles: ['visibility', 'opacity', 'content-visibility', 'filter', 'clip-path', 'clip', 'overflow-x', 'overflow-y', 'color', '-webkit-text-fill-color']",
              "computedStyles: ['visibility', 'opacity', 'content-visibility', 'filter', 'clip-path', 'clip', 'overflow-x', 'overflow-y', 'color', '-webkit-text-fill-color', 'mask-image']",
          )
          source_path.write_text(source, encoding="utf-8")

          tests_path = Path("tests/test_workers.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_exact(
              tests,
              "const readClipPathFallbackScenario = scenario === 'read-clip-path-fallback';\nconst readEmbeddingOpacityFallbackScenario = scenario === 'read-embedding-opacity-fallback';",
              "const readClipPathFallbackScenario = scenario === 'read-clip-path-fallback';\nconst readMaskImageFallbackScenario = scenario === 'read-mask-image-fallback';\nconst readEmbeddingOpacityFallbackScenario = scenario === 'read-embedding-opacity-fallback';",
          )
          tests = replace_exact(
              tests,
              "        stringIndex(node.textFillColor === undefined\n          ? (node.color === undefined ? 'rgb(0, 0, 0)' : node.color)\n          : node.textFillColor),\n      ]);",
              "        stringIndex(node.textFillColor === undefined\n          ? (node.color === undefined ? 'rgb(0, 0, 0)' : node.color)\n          : node.textFillColor),\n        stringIndex(node.maskImage || 'none'),\n      ]);",
          )
          tests = replace_exact(
              tests,
              "  if (readClipPathFallbackScenario) return makeSemanticSnapshot([\n    {parent: -1, backendNodeId: 101, nodeName: 'BUTTON', attributes: ['aria-label', ' '], clipPath: 'inset(100%)'},\n    {parent: 0, backendNodeId: 102, nodeName: '#text', layoutText: 'clipped-' + marker, clipPath: 'inset(100%)'},\n  ]);\n  if (readEmbeddingOpacityFallbackScenario) return makeSemanticSnapshot([",
              "  if (readClipPathFallbackScenario) return makeSemanticSnapshot([\n    {parent: -1, backendNodeId: 101, nodeName: 'BUTTON', attributes: ['aria-label', ' '], clipPath: 'inset(100%)'},\n    {parent: 0, backendNodeId: 102, nodeName: '#text', layoutText: 'clipped-' + marker, clipPath: 'inset(100%)'},\n  ]);\n  if (readMaskImageFallbackScenario) return makeSemanticSnapshot([\n    {parent: -1, backendNodeId: 101, nodeName: 'BUTTON', attributes: ['aria-label', ' '], maskImage: 'linear-gradient(transparent, transparent)'},\n    {parent: 0, backendNodeId: 102, nodeName: '#text', layoutText: 'masked-' + marker},\n  ]);\n  if (readEmbeddingOpacityFallbackScenario) return makeSemanticSnapshot([",
          )
          tests = replace_exact(
              tests,
              "readClipPathFallbackScenario || readEmbeddingOpacityFallbackScenario",
              "readClipPathFallbackScenario || readMaskImageFallbackScenario || readEmbeddingOpacityFallbackScenario",
              expected=3,
          )
          tests = replace_exact(
              tests,
              "const expectedStyles = ['visibility', 'opacity', 'content-visibility', 'filter', 'clip-path', 'clip', 'overflow-x', 'overflow-y', 'color', '-webkit-text-fill-color'];",
              "const expectedStyles = ['visibility', 'opacity', 'content-visibility', 'filter', 'clip-path', 'clip', 'overflow-x', 'overflow-y', 'color', '-webkit-text-fill-color', 'mask-image'];",
          )
          tests = replace_exact(
              tests,
              "self.assertIn(\"normalizedClip\", source)\n",
              "self.assertIn(\"normalizedClip\", source)\n        self.assertIn(\"normalizedMaskImage\", source)\n",
          )
          tests = replace_exact(
              tests,
              "self.assertIn(\"computedStyles: ['visibility', 'opacity', 'content-visibility', 'filter', 'clip-path', 'clip', 'overflow-x', 'overflow-y', 'color', '-webkit-text-fill-color']\", source)",
              "self.assertIn(\"computedStyles: ['visibility', 'opacity', 'content-visibility', 'filter', 'clip-path', 'clip', 'overflow-x', 'overflow-y', 'color', '-webkit-text-fill-color', 'mask-image']\", source)",
          )
          tests = replace_exact(
              tests,
              "    def test_browser_semantic_node_excludes_clip_path_hidden_text(self) -> None:\n        execution, receipt = self._run_browser_semantic_node(\"read-clip-path-fallback\")\n        self.assertEqual(execution.returncode, 0, execution.stderr)\n        self.assertTrue(receipt[\"ok\"])\n        self.assertEqual(receipt[\"state\"][\"elements\"][0][\"name\"], \"\")\n\n    def test_browser_semantic_node_excludes_hidden_embedding_frame_text(self) -> None:",
              "    def test_browser_semantic_node_excludes_clip_path_hidden_text(self) -> None:\n        execution, receipt = self._run_browser_semantic_node(\"read-clip-path-fallback\")\n        self.assertEqual(execution.returncode, 0, execution.stderr)\n        self.assertTrue(receipt[\"ok\"])\n        self.assertEqual(receipt[\"state\"][\"elements\"][0][\"name\"], \"\")\n\n    def test_browser_semantic_node_excludes_masked_text(self) -> None:\n        execution, receipt = self._run_browser_semantic_node(\"read-mask-image-fallback\")\n        self.assertEqual(execution.returncode, 0, execution.stderr)\n        self.assertTrue(receipt[\"ok\"])\n        self.assertEqual(receipt[\"state\"][\"elements\"][0][\"name\"], \"\")\n\n    def test_browser_semantic_node_excludes_hidden_embedding_frame_text(self) -> None:",
          )
          tests_path.write_text(tests, encoding="utf-8")
          PY
          git diff --check
          git diff -- src/grabowski_workers.py tests/test_workers.py

      - name: Run focused browser worker suite
        run: python3 -m pytest -p no:cacheprovider tests/test_workers.py

      - name: Run repository validation
        run: make validate deploy-check

      - name: Commit verified candidate and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/pr889-mask-candidate.yml
          git config user.name "pr889-candidate-bot"
          git config user.email "pr889-candidate-bot@users.noreply.github.com"
          git add src/grabowski_workers.py tests/test_workers.py .github/workflows/pr889-mask-candidate.yml
          test "$(git diff --cached --name-only)" = $'src/grabowski_workers.py\ntests/test_workers.py'
          git diff --cached --check
          git commit -m "fix(browser): reject masked semantic fallback text"
          git push origin HEAD:fix/pr889-mask-review-20260823
