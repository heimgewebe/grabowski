---
name: Diagnose Codex quota patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/codex-quota-terminal-settlement-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/codex-quota-terminal-settlement-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce focused validation in disposable copy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import textwrap

          root = Path.cwd()
          v2_workflow = root / ".github/workflows/apply-codex-quota-terminal-settlement-v2.yml"
          text = v2_workflow.read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          rm -f \\\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          executor = textwrap.dedent(text[start:end])

          with tempfile.TemporaryDirectory(prefix="grabowski-quota-test-diagnostic-") as tmp:
              checkout = Path(tmp) / "repo"
              shutil.copytree(
                  root,
                  checkout,
                  ignore=shutil.ignore_patterns(".git", "build", "__pycache__"),
              )
              executor_path = Path(tmp) / "execute-v2.py"
              executor_path.write_text(executor, encoding="utf-8")
              patch = subprocess.run(
                  ["python3", str(executor_path)],
                  cwd=checkout,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              for relative in (
                  ".github/workflows/apply-codex-quota-terminal-settlement.yml",
                  ".github/workflows/diagnose-codex-quota-patch.yml",
                  ".github/workflows/apply-codex-quota-terminal-settlement-v2.yml",
              ):
                  (checkout / relative).unlink(missing_ok=True)
              refresh = subprocess.run(
                  ["make", "context-refresh"],
                  cwd=checkout,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              tests = subprocess.run(
                  [
                      "python3",
                      "-m",
                      "unittest",
                      "tests.test_codex_review_settlement",
                      "tests.test_codex_review_settlement_workflow",
                      "tests.test_codex_review_quota_terminal_contract",
                      "-v",
                  ],
                  cwd=checkout,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              report = [
                  "### Focused Codex quota contract diagnostic",
                  "",
                  f"Patch return code: `{patch.returncode}`",
                  f"Context refresh return code: `{refresh.returncode}`",
                  f"Focused tests return code: `{tests.returncode}`",
                  "",
                  "Patch stderr:",
                  "```text",
                  (patch.stderr or "<empty>")[-4000:],
                  "```",
                  "",
                  "Context refresh output:",
                  "```text",
                  (refresh.stdout or "<empty>")[-3000:],
                  "```",
                  "",
                  "Focused test output:",
                  "```text",
                  (tests.stdout or "<empty>")[-12000:],
                  "```",
              ]
              Path("/tmp/patch-diagnostic.md").write_text(
                  "\n".join(report) + "\n",
                  encoding="utf-8",
              )
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/patch-diagnostic.md
