name: PR 1227 tools list failclosed remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-tools-list-failclosed.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "638a0d35bf64bc9bf3265af3fbbad9437e33b54b"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "dfbc8e5ff729ff018a263cadf7e358c4f36848b5"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "8984bfb215d50f89ebc961a9c492616f645919ff"
      - name: Apply fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          tests_path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          old = 'elif is_tools_list and "result" in message:\n                tools = _filtered_treatment_tools(message.get("result"))\n                message = {"jsonrpc":"2.0","id":identifier,"result":{"tools":tools}}'
          new = 'elif is_tools_list:\n                if "error" in message or "result" not in message:\n                    raise RunnerError("MCP tools/list response must contain a successful result")\n                tools = _filtered_treatment_tools(message.get("result"))\n                message = {"jsonrpc":"2.0","id":identifier,"result":{"tools":tools}}'
          if runner.count(old) != 1:
              raise SystemExit(f"runner preimage count: {runner.count(old)}")
          runner = runner.replace(old, new, 1)

          anchor = '    def test_mcp_proxy_exposes_exact_benchmark_surface(self) -> None:\n'
          regression = "\n".join([
              "    def test_mcp_proxy_rejects_unsuccessful_tools_list_responses(self) -> None:",
              "        responses = (",
              "            {\"jsonrpc\": \"2.0\", \"id\": 1, \"error\": {\"code\": -32000, \"message\": \"unavailable\"}},",
              "            {\"jsonrpc\": \"2.0\", \"id\": 1},",
              "        )",
              "        for response in responses:",
              "            with self.subTest(response=response), tempfile.TemporaryDirectory() as temporary:",
              "                root = Path(temporary)",
              "                upstream = root / \"mcp.py\"",
              "                upstream.write_text(",
              "                    \"import json, sys\\n\"",
              "                    \"line = sys.stdin.readline()\\n\"",
              "                    f\"print(json.dumps({response!r}), flush=True)\\n\"",
              "                    encoding=\"utf-8\",",
              "                )",
              "                payload = json.dumps(",
              "                    {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/list\", \"params\": {}}",
              "                ).encode() + b\"\\n\"",
              "                completed = subprocess.run(",
              "                    [sys.executable, str(MODULE_PATH), \"--codex-mcp-proxy\", json.dumps([sys.executable, str(upstream)])],",
              "                    input=payload, capture_output=True, check=False, timeout=5,",
              "                )",
              "                self.assertNotEqual(completed.returncode, 0)",
              "                self.assertIn(b\"successful result\", completed.stderr)",
              "",
              "",
          ])
          if tests.count(anchor) != 1:
              raise SystemExit(f"test anchor count: {tests.count(anchor)}")
          tests = tests.replace(anchor, regression + anchor, 1)

          runner_path.write_text(runner, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          compile(runner, str(runner_path), "exec")
          compile(tests, str(tests_path), "exec")
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_repobrief_agent_benchmark_codex_runner.py
          git diff --check
          python3 tools/check_no_secrets.py
      - name: Publish code-only fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1227-tools-list-failclosed.yml
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py .github/workflows/pr1227-tools-list-failclosed.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rab): fail closed on invalid tools list response'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
