name: PR 1203 exact-head remediation

on:
  push:
    branches:
      - ops/pr1203-remediate-20260915-1

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: fix/thread-focus-evidence-terminalization-20260914
      TEMP_BRANCH: ops/pr1203-remediate-20260915-1
      EXPECTED_HEAD: e4def697e23e0b34629c2878618540f235384e43
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact parent and load patcher
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git show "origin/$TEMP_BRANCH:tools/tmp_pr1203_remediate.py" > /tmp/pr1203-remediate.py

      - name: Apply bounded review remediation
        run: python /tmp/pr1203-remediate.py

      - name: Regenerate contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_operator_context.py --write
          python tools/build_publication_profiles.py --write
          python tools/build_operator_context.py --check
          python tools/build_publication_profiles.py --check

      - name: Focused regression validation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_checkout_terminal_reconciliation \
            tests.test_checkout_terminal_reconciliation_toctou \
            tests.test_checkout_terminal_reconciliation_index_flags \
            tests.test_grips.GripFoundationTests.test_checkout_binding_terminal_apply_accepts_identity_catchup_receipt \
            tests.test_grips.GripFoundationTests.test_checkout_binding_terminal_apply_accepts_descendant_head_rebind_receipt \
            tests.test_grips.GripFoundationTests.test_checkout_binding_terminal_apply_accepts_present_retained_receipt \
            tests.test_grips.GripFoundationTests.test_checkout_binding_terminal_apply_grip_requires_mutation_and_exact_cas \
            tests.test_publication_profiles \
            tests.test_operator_context
          git diff --check

      - name: Full repository validation before publication
        shell: bash
        run: |
          set -euo pipefail
          make validate
          make deploy-check

      - name: Commit and fast-forward PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/grabowski_checkout_terminal_reconciliation.py \
            src/grabowski_grips.py \
            src/grabowski_capabilities.py \
            docs/bureau-pickup.md \
            tests/test_checkout_terminal_reconciliation.py \
            tests/test_grips.py \
            contracts/capability-catalog.v1.json \
            contracts/publication-profiles.v1.json \
            docs/generated/operator-context.v1.json \
            docs/generated/operator-context.md
          git diff --cached --check
          git commit -m "fix(checkouts): close terminal evidence races"
          git push origin "HEAD:$TARGET_BRANCH"
