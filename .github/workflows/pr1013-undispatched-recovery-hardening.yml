---
name: PR1013 undispatched recovery hardening

on:
  push:
    branches:
      - fix/pr1013-undispatched-recovery-hardening-20260901-1732

permissions:
  contents: write

concurrency:
  group: pr1013-undispatched-recovery-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/pr1013-undispatched-recovery-hardening-20260901-1732

      - name: Apply review hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4b583d6610888da4bb469356f9960ae55dc6c09e"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          # ---- resource-layer hardening: stable snapshots + SQL-level CAS ----
          resources_path = Path("src/grabowski_resources.py")
          resources = resources_path.read_text()
          resources = replace_once(
              resources,
              '''def _runtime_refresh_executor_lease_snapshot(\n    row: sqlite3.Row | dict[str, Any],\n) -> dict[str, Any]:\n    return _public(row)\n''',
              '''def _runtime_refresh_executor_lease_snapshot(\n    row: sqlite3.Row | dict[str, Any],\n) -> dict[str, Any]:\n    # Keep the durable crash-recovery contract independent from future additions\n    # to the general public lease projection.\n    return {\n        "resource_key": row["resource_key"],\n        "owner_id": row["owner_id"],\n        "purpose": row["purpose"],\n        "acquired_at_unix": row["acquired_at_unix"],\n        "updated_at_unix": row["updated_at_unix"],\n        "expires_at_unix": row["expires_at_unix"],\n        "metadata_sha256": row["metadata_sha256"],\n        "reclaimed_from_owner": row["reclaimed_from_owner"],\n    }\n''',
              "explicit runtime-refresh snapshot",
          )

          resources = replace_once(
              resources,
              '''            for key in keys:\n                metadata_json, metadata_sha256 = restored_metadata_by_key[key]\n                original = original_by_key[key]\n                updated = connection.execute(\n                    """\n                    UPDATE leases\n                    SET updated_at_unix=?, metadata_sha256=?, metadata_json=?\n                    WHERE resource_key=? AND owner_id=?\n                    """,\n                    (\n                        original["updated_at_unix"],\n                        metadata_sha256,\n                        metadata_json,\n                        key,\n                        owner,\n                    ),\n                )\n''',
              '''            for key in keys:\n                metadata_json, metadata_sha256 = restored_metadata_by_key[key]\n                original = original_by_key[key]\n                expected_current = bound_by_key[key]\n                updated = connection.execute(\n                    """\n                    UPDATE leases\n                    SET updated_at_unix=?, metadata_sha256=?, metadata_json=?\n                    WHERE resource_key=? AND owner_id=?\n                      AND purpose=? AND acquired_at_unix=? AND updated_at_unix=?\n                      AND expires_at_unix=? AND metadata_sha256=?\n                      AND reclaimed_from_owner IS ?\n                    """,\n                    (\n                        original["updated_at_unix"],\n                        metadata_sha256,\n                        metadata_json,\n                        key,\n                        owner,\n                        expected_current["purpose"],\n                        expected_current["acquired_at_unix"],\n                        expected_current["updated_at_unix"],\n                        expected_current["expires_at_unix"],\n                        expected_current["metadata_sha256"],\n                        expected_current["reclaimed_from_owner"],\n                    ),\n                )\n''',
              "restore SQL CAS",
          )

          resources = replace_once(
              resources,
              '''            for key in keys:\n                overlaid = {**metadata_by_key[key], "executor_unit": unit}\n                metadata_json, metadata_sha256 = _metadata(overlaid)\n                updated = connection.execute(\n                    """\n                    UPDATE leases\n                    SET updated_at_unix=?, metadata_sha256=?, metadata_json=?\n                    WHERE resource_key=? AND owner_id=?\n                    """,\n                    (now, metadata_sha256, metadata_json, key, owner),\n                )\n''',
              '''            original_by_key = {item["resource_key"]: item for item in originals}\n            for key in keys:\n                overlaid = {**metadata_by_key[key], "executor_unit": unit}\n                metadata_json, metadata_sha256 = _metadata(overlaid)\n                expected_current = original_by_key[key]\n                updated = connection.execute(\n                    """\n                    UPDATE leases\n                    SET updated_at_unix=?, metadata_sha256=?, metadata_json=?\n                    WHERE resource_key=? AND owner_id=?\n                      AND purpose=? AND acquired_at_unix=? AND updated_at_unix=?\n                      AND expires_at_unix=? AND metadata_sha256=?\n                      AND reclaimed_from_owner IS ?\n                    """,\n                    (\n                        now,\n                        metadata_sha256,\n                        metadata_json,\n                        key,\n                        owner,\n                        expected_current["purpose"],\n                        expected_current["acquired_at_unix"],\n                        expected_current["updated_at_unix"],\n                        expected_current["expires_at_unix"],\n                        expected_current["metadata_sha256"],\n                        expected_current["reclaimed_from_owner"],\n                    ),\n                )\n''',
              "bind SQL CAS",
          )
          resources = replace_once(
              resources,
              '''            bound = [_runtime_refresh_executor_lease_snapshot(row) for row in bound_rows]\n            original_by_key = {item["resource_key"]: item for item in originals}\n            for row, snapshot in zip(bound_rows, bound, strict=True):\n''',
              '''            bound = [_runtime_refresh_executor_lease_snapshot(row) for row in bound_rows]\n            for row, snapshot in zip(bound_rows, bound, strict=True):\n''',
              "deduplicate bind snapshot map",
          )

          resources = replace_once(
              resources,
              '''            for key in keys:\n                metadata_json, metadata_sha256 = restored_metadata_by_key[key]\n                original = original_by_key[key]\n                updated = connection.execute(\n                    """\n                    UPDATE leases\n                    SET updated_at_unix=?, metadata_sha256=?, metadata_json=?\n                    WHERE resource_key=? AND owner_id=?\n                    """,\n                    (\n                        original["updated_at_unix"],\n                        metadata_sha256,\n                        metadata_json,\n                        key,\n                        owner,\n                    ),\n                )\n''',
              '''            for key in keys:\n                metadata_json, metadata_sha256 = restored_metadata_by_key[key]\n                original = original_by_key[key]\n                expected_current = bound_by_key[key]\n                updated = connection.execute(\n                    """\n                    UPDATE leases\n                    SET updated_at_unix=?, metadata_sha256=?, metadata_json=?\n                    WHERE resource_key=? AND owner_id=?\n                      AND purpose=? AND acquired_at_unix=? AND updated_at_unix=?\n                      AND expires_at_unix=? AND metadata_sha256=?\n                      AND reclaimed_from_owner IS ?\n                    """,\n                    (\n                        original["updated_at_unix"],\n                        metadata_sha256,\n                        metadata_json,\n                        key,\n                        owner,\n                        expected_current["purpose"],\n                        expected_current["acquired_at_unix"],\n                        expected_current["updated_at_unix"],\n                        expected_current["expires_at_unix"],\n                        expected_current["metadata_sha256"],\n                        expected_current["reclaimed_from_owner"],\n                    ),\n                )\n''',
              "unbind SQL CAS",
          )
          resources = resources.replace(
              '''    return {\n        **material,\n        "binding_sha256": _runtime_refresh_executor_binding_sha256(material),\n    }\n\ndef unbind_runtime_refresh_executor_leases''',
              '''    return {\n        **material,\n        "binding_sha256": _runtime_refresh_executor_binding_sha256(material),\n    }\n\n\ndef unbind_runtime_refresh_executor_leases''',
              1,
          )
          resources_path.write_text(resources)

          # ---- task-layer hardening: fail-closed recovery + undispatched proof ----
          tasks_path = Path("src/grabowski_tasks.py")
          tasks = tasks_path.read_text()
          reconcile_start = tasks.index(
              "def _reconcile_runtime_refresh_prelaunch_binding_journals(\n"
          )
          reconcile_end = tasks.index("\ndef _validate_cwd(", reconcile_start)
          new_reconcile = r'''def _runtime_refresh_prelaunch_recovery_action(
    recovery: dict[str, Any],
) -> str:
    action = recovery.get("action") if isinstance(recovery, dict) else None
    if action == "not_applied_or_superseded":
        raise RuntimeError(
            "runtime-refresh prelaunch recovery observed superseded lease state; "
            "journal retained for explicit reconciliation"
        )
    if action not in {"restored", "already_original"}:
        raise RuntimeError(
            "runtime-refresh prelaunch recovery returned an unsupported action; "
            "journal retained for explicit reconciliation"
        )
    return str(action)


def _runtime_refresh_prelaunch_undispatched_task_evidence(
    record: dict[str, Any],
) -> dict[str, Any] | None:
    if (
        str(record.get("host")) != "local"
        or _execution_backend(record) != "systemd-user"
        or _systemd_scope(record) != "user"
        or int(record.get("attempt") or 0) != 1
    ):
        return None
    raw_launcher = record.get("launcher_json")
    try:
        launcher = json.loads(str(raw_launcher))
    except (TypeError, json.JSONDecodeError):
        return None
    if (
        not isinstance(launcher, dict)
        or launcher.get(TASK_OUTPUT_LAUNCHER_BINDING_KEY) != 1
    ):
        return None
    paths = _task_output_paths(record)
    output_root = paths["directory"].parent
    if not output_root.exists():
        return None
    try:
        output = _read_local_task_output_files(record, 1)
    except (OSError, RuntimeError, ValueError):
        return None
    if output is not None:
        return None
    try:
        observation = _observe(record)
    except Exception:
        return None
    properties = observation.get("properties")
    probe = observation.get("probe")
    if not isinstance(properties, dict) or not isinstance(probe, dict):
        return None
    returncode = probe.get("returncode")
    if (
        properties.get("LoadState") != "not-found"
        or isinstance(returncode, bool)
        or not isinstance(returncode, int)
        or returncode not in {0, 1, 3, 4}
        or bool(probe.get("timed_out"))
        or bool(probe.get("outcome_unknown"))
    ):
        return None
    material = {
        "schema_version": 1,
        "kind": "grabowski_runtime_refresh_undispatched_task_evidence",
        "task_id": str(record["task_id"]),
        "executor_unit": _authoritative_unit(record),
        "output_directory_sha256": hashlib.sha256(
            str(paths["directory"]).encode("utf-8")
        ).hexdigest(),
        "output_directory_absent": True,
        "systemd_load_state": "not-found",
        "probe_returncode": returncode,
    }
    return {**material, "evidence_sha256": _sha256_json(material)}


def _reconcile_runtime_refresh_prelaunch_binding_journals(
    resource_keys: list[str],
) -> dict[str, Any]:
    keys = resources.normalize_resource_keys(resource_keys)
    selected = set(keys)
    recovered: list[dict[str, Any]] = []
    retained: list[str] = []
    undispatched_pending: list[dict[str, Any]] = []
    connection = _database()
    try:
        connection.execute("BEGIN IMMEDIATE")
        rows = connection.execute(
            "SELECT key, value FROM metadata WHERE key LIKE ? ORDER BY key",
            (BUREAU_RUNTIME_REFRESH_PRELAUNCH_JOURNAL_KEY_PREFIX + "%",),
        ).fetchall()
        for row in rows:
            try:
                journal = _normalize_runtime_refresh_prelaunch_binding_journal(
                    json.loads(row["value"])
                )
            except (json.JSONDecodeError, TypeError, RuntimeError, ValueError) as exc:
                raise RuntimeError(
                    "runtime-refresh prelaunch recovery journal is malformed"
                ) from exc
            if not selected.intersection(journal["resource_keys"]):
                continue
            task_row = connection.execute(
                "SELECT * FROM tasks WHERE task_id=?",
                (journal["task_id"],),
            ).fetchone()
            if task_row is not None:
                task_record = dict(task_row)
                if (
                    task_record["task_id"] != journal["task_id"]
                    or task_record["unit"] != journal["executor_unit"]
                    or task_record["argv_sha256"] != journal["argv_sha256"]
                ):
                    raise RuntimeError(
                        "runtime-refresh prelaunch recovery task identity mismatched"
                    )
                task_state = str(task_record["state"])
                if task_state in {"launching", "outcome_unknown"}:
                    dispatch_evidence = (
                        _runtime_refresh_prelaunch_undispatched_task_evidence(
                            task_record
                        )
                    )
                    if dispatch_evidence is None:
                        raise RuntimeError(
                            "runtime-refresh prelaunch recovery found an unresolved "
                            "task launch; journal retained for reconciliation"
                        )
                    recovery = (
                        resources.restore_runtime_refresh_executor_lease_binding_plan(
                            journal["binding_plan"]
                        )
                    )
                    action = _runtime_refresh_prelaunch_recovery_action(recovery)
                    undispatched_pending.append(
                        {
                            "task_id": journal["task_id"],
                            "journal": journal,
                            "lease_recovery_action": action,
                            "dispatch_evidence": dispatch_evidence,
                        }
                    )
                    continue
                if task_state == "failed":
                    recovery = (
                        resources.restore_runtime_refresh_executor_lease_binding_plan(
                            journal["binding_plan"]
                        )
                    )
                    action = _runtime_refresh_prelaunch_recovery_action(recovery)
                    _delete_runtime_refresh_prelaunch_binding_journal(
                        connection, journal
                    )
                    recovered.append(
                        {
                            "task_id": journal["task_id"],
                            "journal_sha256": journal["journal_sha256"],
                            "plan_sha256": journal["binding_plan"]["plan_sha256"],
                            "action": action,
                        }
                    )
                    continue
                _delete_runtime_refresh_prelaunch_binding_journal(
                    connection, journal
                )
                retained.append(journal["task_id"])
                continue
            recovery = resources.restore_runtime_refresh_executor_lease_binding_plan(
                journal["binding_plan"]
            )
            action = _runtime_refresh_prelaunch_recovery_action(recovery)
            _delete_runtime_refresh_prelaunch_binding_journal(connection, journal)
            recovered.append(
                {
                    "task_id": journal["task_id"],
                    "journal_sha256": journal["journal_sha256"],
                    "plan_sha256": journal["binding_plan"]["plan_sha256"],
                    "action": action,
                }
            )
        connection.commit()
    except Exception:
        if connection.in_transaction:
            connection.rollback()
        raise
    finally:
        connection.close()

    for pending in undispatched_pending:
        task_id = str(pending["task_id"])
        journal = pending["journal"]
        dispatch_evidence = pending["dispatch_evidence"]
        marker_material = {
            "schema_version": 1,
            "kind": "grabowski_runtime_refresh_undispatched_recovery",
            "task_id": task_id,
            "journal_sha256": journal["journal_sha256"],
            "plan_sha256": journal["binding_plan"]["plan_sha256"],
            "lease_recovery_action": pending["lease_recovery_action"],
            "dispatch_evidence_sha256": dispatch_evidence["evidence_sha256"],
        }
        marker = {
            **marker_material,
            "recovery_sha256": _sha256_json(marker_material),
        }
        current = _row_raw(task_id)
        try:
            launcher = json.loads(str(current["launcher_json"]))
        except (TypeError, json.JSONDecodeError) as exc:
            raise RuntimeError(
                "runtime-refresh undispatched recovery launcher is invalid; "
                "journal retained"
            ) from exc
        if not isinstance(launcher, dict):
            raise RuntimeError(
                "runtime-refresh undispatched recovery launcher is invalid; "
                "journal retained"
            )
        launcher["runtime_refresh_prelaunch_undispatched_recovery"] = marker
        terminalized = _set_state(
            task_id,
            "cancelled",
            launcher=launcher,
            observation={
                "state": "cancelled",
                "observed_at_unix": _now(),
                "reason": "runtime_refresh_prelaunch_undispatched_recovery",
                "dispatch_evidence_sha256": dispatch_evidence["evidence_sha256"],
            },
        )
        if terminalized.get("state") != "cancelled":
            raise RuntimeError(
                "runtime-refresh undispatched task did not terminalize; journal retained"
            )
        with _database_connection() as final_connection:
            final_connection.execute("BEGIN IMMEDIATE")
            row = final_connection.execute(
                "SELECT value FROM metadata WHERE key=?",
                (_runtime_refresh_prelaunch_journal_key(task_id),),
            ).fetchone()
            if row is None:
                final_connection.rollback()
                raise RuntimeError(
                    "runtime-refresh undispatched recovery journal disappeared"
                )
            try:
                observed_journal = _normalize_runtime_refresh_prelaunch_binding_journal(
                    json.loads(row["value"])
                )
            except (json.JSONDecodeError, TypeError, RuntimeError, ValueError) as exc:
                final_connection.rollback()
                raise RuntimeError(
                    "runtime-refresh undispatched recovery journal changed"
                ) from exc
            current_row = final_connection.execute(
                "SELECT task_id, unit, argv_sha256, state FROM tasks WHERE task_id=?",
                (task_id,),
            ).fetchone()
            if (
                observed_journal["journal_sha256"] != journal["journal_sha256"]
                or current_row is None
                or current_row["task_id"] != journal["task_id"]
                or current_row["unit"] != journal["executor_unit"]
                or current_row["argv_sha256"] != journal["argv_sha256"]
                or current_row["state"] != "cancelled"
            ):
                final_connection.rollback()
                raise RuntimeError(
                    "runtime-refresh undispatched recovery identity drifted; "
                    "journal retained"
                )
            _delete_runtime_refresh_prelaunch_binding_journal(
                final_connection, observed_journal
            )
            final_connection.commit()
        recovered.append(
            {
                "task_id": task_id,
                "journal_sha256": journal["journal_sha256"],
                "plan_sha256": journal["binding_plan"]["plan_sha256"],
                "action": "undispatched_cancelled",
                "lease_recovery_action": pending["lease_recovery_action"],
                "dispatch_evidence_sha256": dispatch_evidence["evidence_sha256"],
                "lifecycle_receipt_sha256": terminalized.get(
                    "lifecycle_receipt_sha256"
                ),
            }
        )

    material = {
        "schema_version": 1,
        "kind": "grabowski_bureau_runtime_refresh_prelaunch_recovery",
        "resource_keys": keys,
        "recovered": recovered,
        "retained_task_ids": retained,
    }
    return {**material, "recovery_sha256": _sha256_json(material)}
'''
          tasks = tasks[:reconcile_start] + new_reconcile + tasks[reconcile_end:]

          # Move the already-existing live-authority recovery block before operation
          # identity resolution, while preserving the normal later mutation gate.
          late_anchor = tasks.index('    operator._require_operator_mutation(\n')
