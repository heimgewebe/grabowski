              '    if executor_request is not None:\n',
              '''    if executor_request is not None:\n        operator._require_operator_mutation(\n            "durable_job",\n            path=working_directory,\n            repo=working_directory,\n            task_id=task_id,\n            owner_id=_lease_owner(task_id),\n            host=host,\n            opaque_command=True,\n        )\n''',
