          if marker not in tests:
              raise SystemExit("runtime-refresh test insertion marker missing")
          addition = r'''    def test_runtime_refresh_precommit_compensation_failure_preserves_primary_cause(self) -> None:
        fixture = self._runtime_refresh_prelaunch_fixture()
        tasks.resources.acquire_resources(
            fixture["lease_owner"],
            fixture["resource_keys"],
            purpose="runtime refresh compensation cause",
            ttl_seconds=1200,
            metadata={
                "approval_task_id": fixture["approval_task_id"],
