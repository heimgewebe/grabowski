---
name: PR1013 undispatched recovery hardening

on:
  push:
    branches:
      - fix/pr1013-undispatched-recovery-hardening-20260901-1732

permissions:
  contents: write

concurrency:
  group: pr1013-undispatched-recovery-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/pr1013-undispatched-recovery-hardening-20260901-1732

      - name: Apply review hardening
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4b583d6610888da4bb469356f9960ae55dc6c09e HEAD
          test -z "$(git diff --name-only 4b583d6610888da4bb469356f9960ae55dc6c09e HEAD -- src/grabowski_resources.py src/grabowski_tasks.py tests/test_resources.py tests/test_tasks.py)"
          python3 .github/pr1013_undispatched_patch.py
          git diff --check
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            case "$path" in
              src/grabowski_resources.py|src/grabowski_tasks.py|tests/test_resources.py|tests/test_tasks.py) ;;
              "") ;;
              *) echo "unexpected patch path: $path" >&2; exit 65 ;;
            esac
          done <<< "$changed"

      - name: Validate repository
        run: make validate

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr1013-undispatched-recovery-hardening.yml .github/pr1013_undispatched_patch.py
          git diff --check
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/grabowski_resources.py src/grabowski_tasks.py tests/test_resources.py tests/test_tasks.py
          git diff --cached --check
          git commit -m 'fix: recover undispatched runtime refresh tasks safely'
          git push origin HEAD:fix/pr1013-undispatched-recovery-hardening-20260901-1732
