---
name: Apply Codex quota terminal settlement v2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-codex-quota-terminal-settlement-v2
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/codex-quota-terminal-settlement-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/codex-quota-terminal-settlement-v1
          fetch-depth: 0

      - name: Verify isolated preimage
        run: |
          set -euo pipefail
          base="08640a73ad4b8aecd9cf974082bb8efd2c67dbfc"
          test "$(git merge-base HEAD origin/main)" = "$base"
          unexpected="$(git diff --name-only "$base" HEAD | grep -Ev '^.github/workflows/(apply-codex-quota-terminal-settlement.yml|diagnose-codex-quota-patch.yml|apply-codex-quota-terminal-settlement-v2.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected preimage paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Execute original patch with unique indentation fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          root = Path.cwd()
          source_workflow = root / ".github/workflows/apply-codex-quota-terminal-settlement.yml"
          text = source_workflow.read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          rm .github/workflows/apply-codex-quota-terminal-settlement.yml"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = textwrap.dedent(text[start:end])
          script = script.replace(
              "from pathlib import Path\n",
              "from pathlib import Path\nimport re\n",
              1,
          )
          old_function = '''def replace_once(relative: str, old: str, new: str) -> None:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one patch anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '''
          new_function = '''def replace_once(relative: str, old: str, new: str) -> None:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if count != 0:
                  raise SystemExit(
                      f"{relative}: expected one exact patch anchor, found {count}"
                  )
              pattern_lines: list[str] = []
              for line in old.splitlines():
                  stripped = line.lstrip()
                  if stripped:
                      pattern_lines.append(r"^[ \\t]*" + re.escape(stripped) + r"[ \\t]*$")
                  else:
                      pattern_lines.append(r"^[ \\t]*$")
              pattern = re.compile("\\n".join(pattern_lines), re.MULTILINE)
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(
                      f"{relative}: expected one indentation-insensitive patch anchor, "
                      f"found {len(matches)}"
                  )
              match = matches[0]
              path.write_text(
                  text[: match.start()] + new + text[match.end() :],
                  encoding="utf-8",
              )
          '''
          if script.count(old_function) != 1:
              raise SystemExit("cannot replace original patch anchor function")
          script = script.replace(old_function, new_function, 1)
          script_path = Path("/tmp/apply-codex-quota-terminal-settlement.py")
          script_path.write_text(script, encoding="utf-8")
          subprocess.run(["python3", str(script_path)], cwd=root, check=True)
          PY

          rm -f \
            .github/workflows/apply-codex-quota-terminal-settlement.yml \
            .github/workflows/diagnose-codex-quota-patch.yml \
            .github/workflows/apply-codex-quota-terminal-settlement-v2.yml

      - name: Refresh generated contracts
        run: |
          set -euo pipefail
          make context-refresh

      - name: Verify focused settlement contracts
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_codex_review_settlement \
            tests.test_codex_review_settlement_workflow \
            tests.test_codex_review_quota_terminal_contract -v
          git diff --check

      - name: Verify full repository
        run: |
          set -euo pipefail
          make validate

      - name: Enforce final path scope
        run: |
          set -euo pipefail
          unexpected="$({ git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u | grep -Ev '^(.github/workflows/(apply-codex-quota-terminal-settlement.yml|diagnose-codex-quota-patch.yml|apply-codex-quota-terminal-settlement-v2.yml|codex-review-settlement.yml)|docs/external-review-loop.md|docs/generated/[^/]+|src/grabowski_grips.py|src/grabowski_merge_guard.py|tests/test_codex_review_quota_terminal_contract.py|tests/test_codex_review_settlement.py|tests/test_codex_review_settlement_workflow.py|tools/codex_review_settlement.py)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git status --short

      - name: Commit validated product patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(review): settle Codex quota exhaustion"
          git push origin HEAD:fix/codex-quota-terminal-settlement-v1
