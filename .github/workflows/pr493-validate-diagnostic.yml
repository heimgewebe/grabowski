name: PR 493 dependency repair

on:
  push:
    branches:
      - fix/bureau-pickup-typed-schema-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805204fd0261b50 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/bureau-pickup-typed-schema-v1
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Remove import-time Pydantic dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/grabowski_bureau_pickup.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from pydantic import ConfigDict\nfrom typing_extensions import NotRequired, Required, TypedDict\n"
          new_import = "try:\n    from typing_extensions import TypedDict\nexcept ModuleNotFoundError:\n    from typing import TypedDict\n"
          old_schema = '''class BureauPickupRequest(TypedDict, total=False):
              __pydantic_config__ = ConfigDict(extra="forbid", strict=True)

              worker_id: Required[str]
              capabilities: Required[list[str]]
              task_id: Required[str]
              resource: NotRequired[str | None]
              kind: NotRequired[str]
              base_dir: NotRequired[str | None]
              approval_source: NotRequired[str]
              lease_ttl_seconds: NotRequired[int]
              create_workspace: NotRequired[bool]
              repository_scope_manifests: NotRequired[dict[str, dict[str, Any]] | None]
              nonconflict_proofs: NotRequired[dict[str, dict[str, Any]] | None]
              registry_root: NotRequired[str]
          '''.replace("          ", "")
          new_schema = '''class _RequiredBureauPickupRequest(TypedDict):
              worker_id: str
              capabilities: list[str]
              task_id: str


          class BureauPickupRequest(_RequiredBureauPickupRequest, total=False):
              __pydantic_config__ = {"extra": "forbid", "strict": True}

              resource: str | None
              kind: str
              base_dir: str | None
              approval_source: str
              lease_ttl_seconds: int
              create_workspace: bool
              repository_scope_manifests: dict[str, dict[str, Any]] | None
              nonconflict_proofs: dict[str, dict[str, Any]] | None
              registry_root: str
          '''.replace("          ", "")
          if new_import in text and new_schema in text:
              print("Dependency-free schema already applied.")
          else:
              if old_import not in text or old_schema not in text:
                  raise SystemExit("Expected PR 493 schema blocks are absent")
              text = text.replace(old_import, new_import, 1).replace(old_schema, new_schema, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Refresh generated context
        run: make context-refresh
      - name: Validate repository
        run: make validate
      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(docs/generated/operator-context\.v1\.json|src/grabowski_bureau_pickup\.py)$'
          unexpected="$(git status --porcelain=v1 | sed 's/^...//' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected repair paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git add src/grabowski_bureau_pickup.py docs/generated/operator-context.v1.json
          if git diff --cached --quiet; then
            echo 'Repair already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mcp): avoid import-time Pydantic dependency'
          git push origin HEAD:fix/bureau-pickup-typed-schema-v1
