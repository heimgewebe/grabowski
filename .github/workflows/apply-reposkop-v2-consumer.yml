name: apply-reposkop-v2-consumer

on:
  push:
    branches:
      - feat/reposkop-v2-consumer-binding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic migration
        run: python tools/apply_reposkop_v2_consumer_patch.py
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/grabowski_reposkop_context.py tests/test_reposkop_context.py
          git commit -m 'feat(reposkop): bind v2 checkout identities [generated]'
          git push origin HEAD:feat/reposkop-v2-consumer-binding
