name: PR1186 final cleanup-fence remediation

on:
  push:
    branches:
      - fix/terminal-lane-retention-archive-20260913

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact P1 remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/grabowski_agent_workspace.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    archive = _verified_workspace_cleanup_archive(manifest, intent, owner)\n    if archive is None:\n        return None\n    return {\n        "archive_id": archive["archive_id"],\n        "checkout_cleanup_plan_id": archive["cleanup_plan_id"],\n        "applied_at_unix": archive["cleaned_at_unix"],\n        "reconciled_after_missing_worktree": True,\n    }\n'''
          new = '''    archive = _verified_workspace_cleanup_archive(manifest, intent, owner)\n    if archive is None:\n        return None\n    checkout_key = archive.get("checkout_key")\n    cleanup_plan_id = archive.get("cleanup_plan_id")\n    if not isinstance(checkout_key, str) or not isinstance(cleanup_plan_id, str):\n        raise AgentWorkspaceActionError(\n            "workspace cleanup reconciliation lacks exact checkout cleanup identity"\n        )\n    active_fences = [\n        fence\n        for fence in checkouts._active_checkout_operation_uncertainties()\n        if fence.get("checkout_key") == checkout_key\n    ]\n    uncertainty_reconciliation = None\n    if active_fences:\n        matching_fences = [\n            fence\n            for fence in active_fences\n            if fence.get("operation") == "cleanup"\n            and fence.get("operation_id") == cleanup_plan_id\n            and fence.get("owner_id") == owner\n            and isinstance(fence.get("evidence"), dict)\n            and fence["evidence"].get("archive_id") == archive.get("archive_id")\n            and fence["evidence"].get("plan_id") == cleanup_plan_id\n            and fence["evidence"].get("checkout_key") == checkout_key\n            and fence["evidence"].get("owner_id") == owner\n        ]\n        if len(active_fences) != 1 or len(matching_fences) != 1:\n            raise AgentWorkspaceActionError(\n                "workspace cleanup reconciliation found conflicting checkout uncertainty fence"\n            )\n        uncertainty_reconciliation = (\n            checkouts.grabowski_checkout_uncertainty_reconcile(\n                matching_fences[0]["fence_id"],\n                "reconcile-checkout-operation-outcome",\n            )\n        )\n        if uncertainty_reconciliation.get("state") not in {\n            "reconciled",\n            "already_reconciled",\n        }:\n            reason = uncertainty_reconciliation.get("reason", "outcome-not-proven")\n            raise AgentWorkspaceActionError(\n                f"workspace cleanup uncertainty remains fenced: {reason}"\n            )\n    return {\n        "archive_id": archive["archive_id"],\n        "checkout_cleanup_plan_id": cleanup_plan_id,\n        "applied_at_unix": archive["cleaned_at_unix"],\n        "reconciled_after_missing_worktree": True,\n        "checkout_uncertainty_reconciliation": uncertainty_reconciliation,\n    }\n'''
          if source.count(old) != 1:
              raise SystemExit("agent-workspace cleanup reconciliation preimage mismatch")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_agent_workspace.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''    def test_cleanup_plan_blocks_invalid_close_receipt(self) -> None:\n'''
          addition = '''    def test_cleanup_reconciles_post_commit_audit_failure_and_clears_fence(self) -> None:\n        manifest = self._closed_cleanup_manifest()\n        checkout_state = self.root / "checkout-state-post-commit-audit-recovery"\n        patches = [\n            mock.patch.object(workspace.checkouts, "CHECKOUT_DB", checkout_state / "checkouts.sqlite3"),\n            mock.patch.object(workspace.checkouts, "ARCHIVE_ROOT", checkout_state / "archives"),\n            mock.patch.object(workspace.checkouts, "CHECKOUT_LOCK", checkout_state / "checkouts.lock"),\n            mock.patch.object(workspace.checkouts.resources, "RESOURCE_DB", checkout_state / "resources.sqlite3"),\n            mock.patch.object(workspace.checkouts.tasks, "TASK_DB", checkout_state / "tasks.sqlite3"),\n            mock.patch.object(workspace.checkouts.operator, "_safe_environment", return_value=os.environ.copy()),\n            mock.patch.object(workspace.checkouts.operator, "_require_operator_mutation"),\n            mock.patch.object(workspace.checkouts.operator, "_require_operator_capability"),\n            mock.patch.object(workspace.checkouts, "_processes_under", return_value=[]),\n            mock.patch.object(workspace.operator, "_require_operator_mutation"),\n            mock.patch.object(workspace.operator, "_require_operator_capability"),\n        ]\n\n        def fail_cleanup_audit(record: dict) -> None:\n            if record.get("operation") == "checkout-cleanup-apply":\n                raise RuntimeError("simulated cleanup audit failure after database commit")\n\n        with (\n            patches[0], patches[1], patches[2], patches[3], patches[4],\n            patches[5], patches[6], patches[7], patches[8], patches[9], patches[10],\n            mock.patch.object(\n                workspace.checkouts.base,\n                "_append_audit",\n                side_effect=fail_cleanup_audit,\n            ),\n        ):\n            plan = workspace.grabowski_agent_workspace_cleanup_plan(\n                [manifest["workspace_id"]]\n            )["plans"][0]\n            archived = workspace.grabowski_agent_workspace_cleanup(\n                manifest["workspace_id"],\n                plan["plan_sha256"],\n                "archive-and-remove-worktree",\n            )\n            self.assertEqual(archived["state"], "archived_waiting_for_cleanup")\n            self._mature_checkout_archive(str(archived["archive_id"]))\n            refreshed = workspace.grabowski_agent_workspace_cleanup_plan(\n                [manifest["workspace_id"]]\n            )["plans"][0]\n            self.assertTrue(refreshed["eligible"])\n\n            with self.assertRaisesRegex(\n                RuntimeError, "simulated cleanup audit failure after database commit"\n            ):\n                workspace.grabowski_agent_workspace_cleanup(\n                    manifest["workspace_id"],\n                    refreshed["plan_sha256"],\n                    "archive-and-remove-worktree",\n                )\n\n            self.assertFalse(self.git.writer.exists())\n            fences = workspace.checkouts._active_checkout_operation_uncertainties()\n            self.assertEqual(len(fences), 1)\n            fence = fences[0]\n            self.assertEqual(fence["operation"], "cleanup")\n            with workspace.checkouts.resources._database() as connection:\n                connection.execute(\n                    "UPDATE leases SET expires_at_unix=? WHERE owner_id=?",\n                    (int(time.time()) - 1, fence["lease_owner_id"]),\n                )\n                connection.commit()\n\n            with mock.patch.object(\n                workspace.checkouts, "grabowski_checkout_cleanup"\n            ) as cleanup:\n                reconciled = workspace.grabowski_agent_workspace_cleanup(\n                    manifest["workspace_id"],\n                    refreshed["plan_sha256"],\n                    "archive-and-remove-worktree",\n                )\n            cleanup.assert_not_called()\n            self.assertEqual(reconciled["state"], "cleanup_reconciled")\n            self.assertEqual(\n                workspace.checkouts._active_checkout_operation_uncertainties(), []\n            )\n            cleared = workspace.checkouts._load_checkout_operation_uncertainty(\n                fence["fence_id"]\n            )\n            self.assertIsNotNone(cleared["cleared_at_unix"])\n            self.assertEqual(cleared["clearance"]["outcome"], "confirmed_success")\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit("agent-workspace regression insertion marker mismatch")
          test_path.write_text(tests.replace(marker, addition + marker, 1), encoding="utf-8")
          PY

      - name: Run focused regressions
        shell: bash
        run: |
          set -eu
          install -d -m 700 "$PWD/build"
          test_home="$(mktemp -d "$PWD/build/test-home.XXXXXX")"
          trap 'rm -rf "$test_home"' EXIT
          install -d -m 700 "$test_home/.config/grabowski"
          install -m 600 config/access.home-wide-operator.example.json "$test_home/.config/grabowski/access.json"
          HOME="$test_home" PYTHONPATH=tests python -B -m unittest -v \
            test_agent_workspace.AgentWorkspaceTests.test_cleanup_reconciles_ambiguous_post_apply_without_second_mutation \
            test_agent_workspace.AgentWorkspaceTests.test_cleanup_reconciles_post_commit_audit_failure_and_clears_fence

      - name: Run lifecycle regression suites
        shell: bash
        run: |
          set -eu
          install -d -m 700 "$PWD/build"
          test_home="$(mktemp -d "$PWD/build/test-home.XXXXXX")"
          trap 'rm -rf "$test_home"' EXIT
          install -d -m 700 "$test_home/.config/grabowski"
          install -m 600 config/access.home-wide-operator.example.json "$test_home/.config/grabowski/access.json"
          HOME="$test_home" python -B -m unittest discover -s tests -p 'test_checkouts.py' -v
          HOME="$test_home" python -B -m unittest discover -s tests -p 'test_agent_workspace.py' -v

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit exact remediation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr1186-finalize-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/grabowski_agent_workspace.py tests/test_agent_workspace.py .github/workflows/pr1186-finalize-reconcile.yml
          git commit -m "fix(workspace): reconcile cleanup uncertainty fence"
          git push origin HEAD:fix/terminal-lane-retention-archive-20260913
