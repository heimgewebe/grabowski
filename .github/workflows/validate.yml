name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: make validate

      - name: Prove reproducible deployment staging
        run: make deploy-check

  publish-pr506-retry-binding-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'fix/task-retry-convergence-v1'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/task-retry-convergence-v1

      - name: Apply, test and publish exact fix
        shell: bash
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          if [ "$subject" != 'chore(ci): activate PR 506 retry-binding fix' ]; then
            echo "publisher skipped for commit: $subject"
            exit 0
          fi

          python3 tools/pr506_preserve_retry_binding_fix.py
          make context-refresh

          test_home=$(mktemp -d)
          trap 'rm -rf "$test_home"' EXIT
          install -d -m 700 "$test_home/.config/grabowski"
          install -m 600 \
            config/access.home-wide-operator.example.json \
            "$test_home/.config/grabowski/access.json"
          HOME="$test_home" python3 -m unittest -v \
            tests.test_tasks.TaskTests.test_interrupted_retry_successor_recovery_preserves_retry_binding \
            tests.test_tasks.TaskTests.test_interrupted_recovery_rejects_malformed_retry_binding_before_effects \
            tests.test_tasks.TaskTests.test_exact_reconcile_resume_allows_named_interrupted_recovery \
            tests.test_tasks.TaskTests.test_interrupted_recovery_persists_binding_before_lease_effect \
            tests.test_tasks.TaskTests.test_direct_resume_requires_recovery_evidence_for_every_interrupted_policy
          python3 -m py_compile \
            src/grabowski_tasks.py \
            tools/pr506_preserve_retry_binding_fix.py
          git diff --check

          git config user.name 'grabowski-pr506-operator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/grabowski_tasks.py \
            tests/test_tasks.py \
            docs/generated/operator-context.v1.json \
            docs/generated/operator-context.md \
            contracts/capability-catalog.v1.json
          git commit -m 'fix(tasks): preserve retry edge across interrupted recovery'
          git push origin HEAD:fix/task-retry-convergence-v1
