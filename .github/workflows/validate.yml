name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - fix/transport-session-scope-ci-v1

permissions:
  contents: write

jobs:
  t136-refresh:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/transport-session-scope-ci-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: t136-stateless-pool-refresh
      cancel-in-progress: false
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/transport-session-scope-ci-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply reviewed source patch and deterministic transforms
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/t136-stateless-pool.patch
          test -f .github/t136-update-tests.py
          test -f .github/t136-update-docs.py
          awk '/^diff --git a\/tests\// {exit} {print}' \
            .github/t136-stateless-pool.patch > /tmp/t136-source.patch
          test -s /tmp/t136-source.patch
          git apply --check /tmp/t136-source.patch
          git apply /tmp/t136-source.patch
          python .github/t136-update-tests.py
          python .github/t136-update-docs.py

      - name: Regenerate canonical projections
        run: make context-refresh

      - name: Run focused transport tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_transport_roundtrip.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_transport_gate_integration.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_transport_session_scope_runtime.py' -v
          git diff --check

      - name: Enforce exact working-tree boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/t136-stateless-pool.patch",
              ".github/t136-update-docs.py",
              ".github/t136-update-tests.py",
              ".github/workflows/t136-stateless-pool-refresh.yml",
              ".github/workflows/validate.yml",
              "docs/transport-roundtrip-gate-v1.md",
              "src/grabowski_transport_roundtrip.py",
              "tests/test_transport_gate_integration.py",
              "tests/test_transport_roundtrip.py",
          }
          lines = subprocess.check_output(["git", "status", "--short"], text=True).splitlines()
          paths = {line[3:] for line in lines if len(line) >= 4}
          unexpected = sorted(
              path for path in paths
              if path not in allowed and not path.startswith("docs/generated/")
          )
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          required = {
              "docs/transport-roundtrip-gate-v1.md",
              "src/grabowski_transport_roundtrip.py",
              "tests/test_transport_gate_integration.py",
              "tests/test_transport_roundtrip.py",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"expected changed paths missing: {missing}")
          PY

      - name: Restore trusted workflow and commit product diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/validate.yml
          git rm -f \
            .github/t136-stateless-pool.patch \
            .github/t136-update-docs.py \
            .github/t136-update-tests.py \
            .github/workflows/t136-stateless-pool-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(transport): preserve stateless concurrent handshakes"
          git push origin HEAD:fix/transport-session-scope-ci-v1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: make validate

      - name: Prove reproducible deployment staging
        run: make deploy-check
