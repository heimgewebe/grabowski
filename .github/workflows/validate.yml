name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: grabowski
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout Grabowski
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grabowski

      - name: Checkout pinned convergence protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heimgewebe/konvergenzregelkreis
          ref: c2f75946aa0f3f37646f3c93f1c176c683f341cc
          path: konvergenzregelkreis
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked runtime dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check --no-input
          --require-hashes --no-deps -r requirements/runtime.lock.txt

      - name: Prepare pinned convergence evaluator
        working-directory: konvergenzregelkreis
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .

      - name: Install and verify required postflight OS sandbox
        run: |
          set -eu
          # GitHub's Ubuntu image does not contractually include bwrap.
          # Install the distribution-signed helper, never relax userns or AppArmor.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          test -x /usr/bin/bwrap
          test -f /usr/bin/bwrap
          test ! -L /usr/bin/bwrap
          test "$(stat -c %u /usr/bin/bwrap)" -eq 0
          /usr/bin/bwrap --version
          # Preserve the product's fail-closed read-only mount isolation:
          # if userns/AppArmor blocks setup, fail CI rather than skip tests.
          /usr/bin/bwrap --ro-bind / / \
            --unshare-ipc --unshare-pid --die-with-parent --new-session \
            --tmpfs /tmp --dev /dev --proc /proc --chdir / \
            -- /usr/bin/true

      - name: Validate repository
        run: make validate

      - name: Prove reproducible deployment staging
        run: make deploy-check
