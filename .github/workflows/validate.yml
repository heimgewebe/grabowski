name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: grabowski
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout Grabowski
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grabowski

      - name: Checkout pinned convergence protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heimgewebe/konvergenzregelkreis
          ref: c2f75946aa0f3f37646f3c93f1c176c683f341cc
          path: konvergenzregelkreis
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked runtime dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check --no-input
          --require-hashes --no-deps -r requirements/runtime.lock.txt

      - name: Prepare pinned convergence evaluator
        working-directory: konvergenzregelkreis
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .

      - name: Install Git sandbox prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          # Ubuntu 24.04 restricts user namespaces via AppArmor. Use the distro
          # profile for bubblewrap; do not disable host-wide AppArmor protection.
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test ! -L /etc/apparmor.d/bwrap-userns-restrict
          if [ ! -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          /usr/bin/bwrap --version
          # Probe the real unprivileged uid-map and mount effects before tests.
          /usr/bin/bwrap --bind / / --dev-bind /dev /dev -- /usr/bin/true

      - name: Validate repository
        run: make validate

      - name: Prove reproducible deployment staging
        run: make deploy-check