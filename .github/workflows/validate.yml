name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: make validate

      - name: Prove reproducible deployment staging
        run: make deploy-check

  export-pr506-retry-binding-diff:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'fix/task-retry-convergence-v1'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build exact product diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            b302437b1056e0bf23246d3af73a2be674f76202 \
            5e80921c76645ef2ae3d20c9c3097d8bf9e13990
          git diff \
            --binary \
            --full-index \
            --no-ext-diff \
            b302437b1056e0bf23246d3af73a2be674f76202...5e80921c76645ef2ae3d20c9c3097d8bf9e13990 \
            > grabowski-pr506-final.diff
          sha256sum grabowski-pr506-final.diff > grabowski-pr506-final.diff.sha256
          wc -c grabowski-pr506-final.diff
          cat grabowski-pr506-final.diff.sha256

      - name: Upload exact diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grabowski-pr506-retry-binding-final-diff
          path: |
            grabowski-pr506-final.diff
            grabowski-pr506-final.diff.sha256
          retention-days: 7
          if-no-files-found: error
