name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build temporary source archive
        if: matrix.python-version == '3.12'
        run: tar --exclude=.git -czf "$RUNNER_TEMP/pr474-source.tar.gz" .

      - name: Upload temporary source archive
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: pr474-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr474-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: make validate

      - name: Prove reproducible deployment staging
        run: make deploy-check
