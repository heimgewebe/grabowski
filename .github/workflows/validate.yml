name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: make validate

      - name: Prove reproducible deployment staging
        run: make deploy-check

  publish-pr506-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'fix/task-retry-convergence-v1'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/task-retry-convergence-v1

      - name: Apply, test and publish exact fix
        shell: bash
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          if [ "$subject" != 'chore(ci): activate PR 506 fix publisher' ]; then
            echo "publisher skipped for commit: $subject"
            exit 0
          fi

          python3 tools/pr506_exact_head_fix.py
          make context-refresh
          python3 -m unittest -v \
            tests.test_tasks.TaskTests.test_managed_cargo_attention_limit_counts_only_command_matches \
            tests.test_tasks.TaskTests.test_managed_cargo_attention_scan_keeps_corrupt_argv_fail_closed \
            tests.test_tasks.TaskTests.test_managed_cargo_retry_is_blocked_before_environment_preparation \
            tests.test_tasks.TaskTests.test_explicit_managed_cargo_retry_is_blocked_before_lock_preparation \
            tests.test_tasks.TaskTests.test_unprepared_managed_cargo_blocks_exposed_cancelled_successor_source
          python3 -m py_compile src/grabowski_tasks.py tools/pr506_exact_head_fix.py
          git diff --check

          git config user.name 'grabowski-pr506-operator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/grabowski_tasks.py \
            tests/test_tasks.py \
            docs/generated/operator-context.v1.json \
            docs/generated/operator-context.md \
            contracts/capability-catalog.v1.json
          git commit -m 'fix(tasks): filter Cargo retry candidates before scan cap'
          git push origin HEAD:fix/task-retry-convergence-v1
