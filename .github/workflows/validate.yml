name: PR 474 exact final diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create exact full diff
        env:
          BASE_SHA: c7630b8bc97d5ee07d15237b5a4ff84d96af4f70
          HEAD_SHA: 05229bc9bc1b18e6484b78f0c6c408ad24218e93
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --binary --full-index "$BASE_SHA...$HEAD_SHA" \
            > "$RUNNER_TEMP/grabowski-pr-474-final.diff"
          test -s "$RUNNER_TEMP/grabowski-pr-474-final.diff"
          sha256sum "$RUNNER_TEMP/grabowski-pr-474-final.diff" \
            | tee "$RUNNER_TEMP/grabowski-pr-474-final.diff.sha256"

      - name: Upload exact full diff
        uses: actions/upload-artifact@v7
        with:
          name: grabowski-pr-474-final-diff-05229bc9
          path: |
            ${{ runner.temp }}/grabowski-pr-474-final.diff
            ${{ runner.temp }}/grabowski-pr-474-final.diff.sha256
          if-no-files-found: error
          retention-days: 7
