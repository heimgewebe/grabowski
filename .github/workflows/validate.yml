name: validate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: grabowski
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout Grabowski
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grabowski
          # PR merge checkout must contain both exact parents for admission.
          fetch-depth: 2

      - name: Reject proven superseded initial PR head
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Only initial canonical PR runs may use the early stale-head exit.
          if [[ "$EVENT_NAME" != pull_request || "$REPOSITORY" != heimgewebe/grabowski || "$RUN_ATTEMPT" != 1 ]]; then
            exit 0
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || ! "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          ref="refs/pull/$PR_NUMBER/head"
          if ! reply="$(timeout 10s git ls-remote --exit-code --refs origin "$ref" 2>/dev/null)"; then
            exit 0
          fi
          IFS=$'\t' read -r live returned <<< "$reply"
          if [[ ! "$live" =~ ^[0-9a-f]{40}$ || "$returned" != "$ref" || "$reply" != "$live"$'\t'"$ref" ]]; then
            exit 0
          fi
          if [[ "$live" != "$PR_HEAD" ]]; then
            printf '::notice::PR head superseded; refusing to certify obsolete revision\n'
            exit 1
          fi

      - name: Checkout pinned convergence protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heimgewebe/konvergenzregelkreis
          ref: c2f75946aa0f3f37646f3c93f1c176c683f341cc
          path: konvergenzregelkreis
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked runtime dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check --no-input
          --require-hashes --no-deps -r requirements/runtime.lock.txt

      - name: Prepare pinned convergence evaluator
        working-directory: konvergenzregelkreis
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .

      - name: Install and verify required postflight OS sandbox
        run: |
          set -eu
          # GitHub's Ubuntu image does not contractually include bwrap.
          # Install the distribution-signed helper, never relax userns or AppArmor.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor apparmor-profiles
          # Ubuntu 24.04 AppArmor can deny bwrap's UID map even after installation.
          # Load only Ubuntu's packaged, capability-restricting bwrap profile.
          # Never disable AppArmor or relax host-wide user namespace sysctls.
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          test ! -L "$profile"
          test "$(stat -c %u "$profile")" -eq 0
          test -x /usr/sbin/apparmor_parser
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo /usr/sbin/apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          test -x /usr/bin/bwrap
          test -f /usr/bin/bwrap
          test ! -L /usr/bin/bwrap
          test "$(stat -c %u /usr/bin/bwrap)" -eq 0
          /usr/bin/bwrap --version
          # Preserve the product's fail-closed read-only mount isolation:
          # if userns/AppArmor blocks setup, fail CI rather than skip tests.
          /usr/bin/bwrap --ro-bind / / \
            --unshare-ipc --unshare-pid --die-with-parent --new-session \
            --tmpfs /tmp --dev /dev --proc /proc --chdir / \
            -- /usr/bin/true

      - name: Choose validation tier
        id: tier
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import re
          import subprocess

          def api(path):
              return json.loads(subprocess.run(
                  ["gh", "api", path], check=True, capture_output=True,
                  text=True, timeout=10,
              ).stdout)

          def complete_inventory(response, key):
              rows = response[key]
              if (not isinstance(rows, list) or type(response["total_count"]) is not int
                      or response["total_count"] != len(rows)):
                  raise ValueError("incomplete Actions inventory")
              return rows

          def full_group(repo, sha):
              # Query by SHA at repository level: retired queue refs may not
              # be discoverable through the workflow-filtered endpoint.
              runs = complete_inventory(api(
                  f"repos/{repo}/actions/runs?head_sha={sha}&per_page=30"
              ), "workflow_runs")
              matches = [
                  r for r in runs
                  if r.get("head_sha") == sha
                  and (r.get("repository") or {}).get("full_name") == repo
                  and (r.get("head_repository") or {}).get("full_name") == repo
                  and r.get("event") == "merge_group"
                  and r.get("path") == ".github/workflows/validate.yml"
                  and r.get("head_branch", "").startswith("gh-readonly-queue/main/")
              ]
              if len(matches) != 1 or not (
                  matches[0].get("status") == "completed"
                  and matches[0].get("conclusion") == "success"
              ):
                  return False
              run_id, attempt = matches[0]["id"], matches[0]["run_attempt"]
              if any(type(n) is not int or n < 1 for n in (run_id, attempt)):
                  return False
              jobs = complete_inventory(api(
                  f"repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100"
              ), "jobs")
              if sorted(j.get("name") for j in jobs) != ["validate (3.10)", "validate (3.12)"]:
                  return False
              for job in jobs:
                  if not (
                      job.get("run_id") == run_id and job.get("head_sha") == sha
                      and job.get("run_attempt") == attempt
                      and job.get("status") == "completed" and job.get("conclusion") == "success"
                  ):
                      return False
                  for name in ("Validate repository", "Prove reproducible deployment staging"):
                      steps = [s for s in job["steps"] if s.get("name") == name]
                      if len(steps) != 1 or not (
                          steps[0].get("status") == "completed" and steps[0].get("conclusion") == "success"
                      ):
                          return False
              print(f"Reusing complete merge-group suite: run {run_id} attempt {attempt} for {sha}")
              return True

          def queue_admission(repo, sha):
              base, head = os.environ.get("BASE_SHA", ""), os.environ.get("PR_HEAD", "")
              if not (
                  os.environ.get("EVENT_NAME") == "pull_request"
                  and repo == "heimgewebe/grabowski"
                  and os.environ.get("HEAD_REPOSITORY") == repo
                  and os.environ.get("BASE_REF") == "main"
                  and all(re.fullmatch(r"[0-9a-f]{40}", value) for value in (base, head, sha))
                  and len({base, head, sha}) == 3
              ):
                  return False
              # Validate the actual tested PR merge checkout, not a stale base.
              if api(f"repos/{repo}/git/ref/heads/main")["object"]["sha"] != base:
                  return False
              parents = subprocess.run(
                  ["git", "rev-list", "--parents", "-n", "1", "HEAD"],
                  check=True, capture_output=True, text=True, timeout=10,
              ).stdout.split()
              if parents != [sha, base, head]:
                  return False
              if subprocess.run(
                  ["git", "diff", "--quiet", "--no-renames", base, sha, "--",
                   ".github", "Makefile", "requirements", "config", "tools",
                   "tests/test_ci_validation_reuse.py"],
                  check=False, capture_output=True, timeout=10,
              ).returncode != 0:
                  return False
              rules = api(f"repos/{repo}/rules/branches/main?per_page=100")
              if not isinstance(rules, list) or not 0 < len(rules) < 100:
                  return False
              queues = [r for r in rules if r.get("type") == "merge_queue"]
              required = [r for r in rules if r.get("type") == "required_status_checks"]
              if len(queues) != 1 or len(required) != 1:
                  return False
              queue, checks = queues[0], required[0]
              if any(
                  r.get("ruleset_source_type") != "Repository"
                  or r.get("ruleset_source") != repo
                  or r.get("ruleset_id") != 18801517
                  for r in (queue, checks)
              ):
                  return False
              qp, cp = queue["parameters"], checks["parameters"]
              return (
                  qp.get("grouping_strategy") == "ALLGREEN"
                  and qp.get("merge_method") == "SQUASH"
                  and cp.get("strict_required_status_checks_policy") is True
                  and cp.get("do_not_enforce_on_create") is False
                  and all(
                      {"context": name, "integration_id": 15368}
                      in cp["required_status_checks"]
                      for name in ("validate (3.10)", "validate (3.12)")
                  )
              )

          tier = "full"
          repo, sha = os.environ["REPOSITORY"], os.environ["HEAD_SHA"]
          # Admission is not final integration evidence. The mandatory ALLGREEN
          # queue must run full validation. Restore full PR checks and revalidate
          # open PRs before removing the queue or introducing bypass actors.
          try:
              if queue_admission(repo, sha):
                  tier = "admission"
          except (OSError, subprocess.SubprocessError, ValueError, TypeError, KeyError, AttributeError):
              pass
          if (
              os.environ["EVENT_NAME"] == "push" and repo == "heimgewebe/grabowski"
              and os.environ["REF_NAME"] == "refs/heads/main" and re.fullmatch(r"[0-9a-f]{40}", sha)
          ):
              try:
                  if full_group(repo, sha):
                      tier = "main-reuse"
              except (OSError, subprocess.SubprocessError, ValueError, TypeError, KeyError, AttributeError):
                  # Unavailable or malformed proof does not reduce validation.
                  pass
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tier={tier}", file=output)
          print(f"Validation tier: {tier}")

      - name: Validate repository
        if: steps.tier.outputs.tier != 'main-reuse' && steps.tier.outputs.tier != 'admission'
        run: make validate

      - name: Validate PR queue admission (not final integration)
        if: steps.tier.outputs.tier == 'admission'
        run: make validate-admission

      - name: Validate main contracts after proven full integration
        if: steps.tier.outputs.tier == 'main-reuse'
        run: make validate-main-reuse

      - name: Prove reproducible deployment staging
        run: make deploy-check
