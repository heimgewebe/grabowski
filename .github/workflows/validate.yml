name: PR 474 one-shot finalize

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/codex-review-settled-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply reviewed P2 fixes
        env:
          EXPECTED_PARENT: 475c489fd36dd0a587f8d53abb5513d49cee2730
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "fix/codex-review-settled-v1"
          python3 - <<'PY'
          from pathlib import Path

          producer = Path('tools/codex_review_settlement.py')
          text = producer.read_text()
          old = '''def _review_completion(
              pr: dict[str, Any],
              *,
              request: dict[str, Any],
              head_sha: str,
          ) -> dict[str, Any] | None:
              request_time = request["_created"]
          '''
          new = '''def _review_completion(
              pr: dict[str, Any],
              *,
              requests: list[dict[str, Any]],
              head_sha: str,
          ) -> dict[str, Any] | None:
              request = requests[0]
              request_time = request["_created"]
          '''
          if old not in text:
              raise SystemExit('producer signature anchor missing')
          text = text.replace(old, new, 1)
          old = '''    reactions = request.get("reactions")
              for reaction in _list_nodes(reactions, label="request reactions"):
                  actor = _actor_login(reaction.get("user"))
                  created = _parse_time(reaction.get("createdAt"))
                  if (
                      actor in TRUSTED_CODEX_ACTORS
                      and reaction.get("content") == "THUMBS_UP"
                      and created is not None
                      and created >= request_time
                  ):
                      return {
                          "mode": "reaction",
                          "review_id": None,
                          "actor": actor,
                          "state": "THUMBS_UP",
                          "submitted_at": reaction.get("createdAt"),
                          "body_sha256": _sha256_text("THUMBS_UP"),
                          "url": None,
                          "accepted_state": True,
                          "blocking_state": False,
                      }
              return None
          '''
          new = '''    reaction_candidates: list[dict[str, Any]] = []
              for reacted_request in requests:
                  request_comment_id = reacted_request["databaseId"]
                  reacted_request_time = reacted_request["_created"]
                  reactions = reacted_request.get("reactions")
                  for reaction in _list_nodes(
                      reactions,
                      label=f"request {request_comment_id} reactions",
                  ):
                      actor = _actor_login(reaction.get("user"))
                      created = _parse_time(reaction.get("createdAt"))
                      if (
                          actor in TRUSTED_CODEX_ACTORS
                          and reaction.get("content") == "THUMBS_UP"
                          and created is not None
                          and created >= reacted_request_time
                      ):
                          reaction_candidates.append(
                              {
                                  **reaction,
                                  "_actor": actor,
                                  "_created": created,
                                  "_request_comment_id": request_comment_id,
                              }
                          )
              if reaction_candidates:
                  selected = min(
                      reaction_candidates,
                      key=lambda item: (
                          item["_created"],
                          item["_request_comment_id"],
                          item["_actor"],
                      ),
                  )
                  return {
                      "mode": "reaction",
                      "review_id": None,
                      "comment_id": selected["_request_comment_id"],
                      "actor": selected["_actor"],
                      "state": "THUMBS_UP",
                      "submitted_at": selected.get("createdAt"),
                      "body_sha256": _sha256_text("THUMBS_UP"),
                      "url": None,
                      "accepted_state": True,
                      "blocking_state": False,
                  }
              return None
          '''
          if old not in text:
              raise SystemExit('producer reaction anchor missing')
          text = text.replace(old, new, 1)
          old = '        _review_completion(pr, request=request, head_sha=head_sha)\n'
          new = '        _review_completion(pr, requests=requests, head_sha=head_sha)\n'
          if old not in text:
              raise SystemExit('producer call anchor missing')
          producer.write_text(text.replace(old, new, 1))

          guard = Path('src/grabowski_merge_guard.py')
          text = guard.read_text()
          start = text.index('        elif mode == "reaction":\n')
          end = text.index(
              '        else:\n            errors.append("merge_guard_codex_completion_mode_invalid")',
              start,
          )
          replacement = '''        elif mode == "reaction":
              reaction_comment_id = completion.get("comment_id")
              reacted_request_time: datetime | None = None
              if (
                  isinstance(reaction_comment_id, bool)
                  or not isinstance(reaction_comment_id, int)
                  or reaction_comment_id <= 0
              ):
                  errors.append("merge_guard_codex_reaction_comment_id_invalid")
                  reactions: list[dict[str, Any]] = []
              else:
                  reacted_requests = [
                      item
                      for item in canonical_requests
                      if item["id"] == reaction_comment_id
                  ]
                  if len(reacted_requests) != 1:
                      errors.append(
                          "merge_guard_codex_reaction_request_missing_or_ambiguous"
                      )
                      reactions = []
                  else:
                      reacted_request_time = reacted_requests[0]["created"]
                      bounded_reactions = self._codex_single_page(
                          [
                              "api",
                              "--paginate",
                              "--slurp",
                              (
                                  f"repos/{repository}/issues/comments/"
                                  f"{reaction_comment_id}/reactions?per_page=100"
                              ),
                          ],
                          label="reactions",
                          observations=observations,
                          errors=errors,
                      )
                      reactions = bounded_reactions or []
              matching_reactions: list[dict[str, Any]] = []
              for reaction in reactions:
                  actor = _github_actor(reaction.get("user"))
                  created = _github_datetime(reaction.get("created_at"))
                  if (
                      actor in _CODEX_REVIEW_ACTORS
                      and reaction.get("content") == "+1"
                      and created is not None
                      and reacted_request_time is not None
                      and created >= reacted_request_time
                  ):
                      matching_reactions.append(
                          {**reaction, "_actor": actor, "_created": created}
                      )
              expected_completion_time = _github_datetime(completion.get("submitted_at"))
              matching = [
                  item
                  for item in matching_reactions
                  if item["_actor"] == str(completion.get("actor", "")).lower()
                  and item["_created"] == expected_completion_time
              ]
              if not matching:
                  errors.append("merge_guard_codex_reaction_missing_or_drifted")
              else:
                  completion_time = matching[-1]["_created"]
              if completion.get("state") != "THUMBS_UP":
                  errors.append("merge_guard_codex_reaction_state_drift")
              if completion.get("body_sha256") != hashlib.sha256(
                  b"THUMBS_UP"
              ).hexdigest():
                  errors.append("merge_guard_codex_reaction_body_drift")
          '''
          text = text[:start] + replacement + text[end:]
          old = '''                "completion_mode": mode,
                      "completion_id": completion.get("review_id"),
          '''
          new = '''                "completion_mode": mode,
                      "completion_id": completion.get("review_id"),
                      "completion_comment_id": completion.get("comment_id"),
          '''
          if text.count(old) != 1:
              raise SystemExit('guard receipt anchor drift')
          text = text.replace(old, new, 1)
          old = '''                        "completion_mode": mode,
                              "completion_id": completion.get("review_id"),
          '''
          new = '''                        "completion_mode": mode,
                              "completion_id": completion.get("review_id"),
                              "completion_comment_id": completion.get("comment_id"),
          '''
          if text.count(old) != 1:
              raise SystemExit('guard binding anchor drift')
          guard.write_text(text.replace(old, new, 1))

          validator = Path('src/grabowski_grips.py')
          text = validator.read_text()
          old = '''        comment_id = completion.get("comment_id")
              if mode == "clean_comment":
                  if (
                      isinstance(comment_id, bool)
                      or not isinstance(comment_id, int)
                      or comment_id <= 0
                  ):
                      errors.append(
                          "completion.comment_id must be a positive integer for clean_comment mode"
                      )
                  reviewed_prefix = completion.get("reviewed_commit_prefix")
                  if (
                      not isinstance(reviewed_prefix, str)
                      or re.fullmatch(r"[0-9a-f]{10,40}", reviewed_prefix) is None
                  ):
                      errors.append(
                          "completion.reviewed_commit_prefix must be 10 to 40 lowercase hex characters"
                      )
                  elif (
                      isinstance(expected_head, str)
                      and not expected_head.startswith(reviewed_prefix)
                  ):
                      errors.append(
                          "completion.reviewed_commit_prefix does not bind expected_head"
                      )
              else:
                  if comment_id is not None:
                      errors.append(
                          "completion.comment_id must be null outside clean_comment mode"
                      )
                  if completion.get("reviewed_commit_prefix") is not None:
                      errors.append(
                          "completion.reviewed_commit_prefix must be null outside clean_comment mode"
                      )
          '''
          new = '''        comment_id = completion.get("comment_id")
              if mode in {"clean_comment", "reaction"}:
                  if (
                      isinstance(comment_id, bool)
                      or not isinstance(comment_id, int)
                      or comment_id <= 0
                  ):
                      errors.append(
                          "completion.comment_id must be a positive integer for "
                          f"{mode} mode"
                      )
              elif comment_id is not None:
                  errors.append(
                      "completion.comment_id must be null outside clean_comment or reaction mode"
                  )
              reviewed_prefix = completion.get("reviewed_commit_prefix")
              if mode == "clean_comment":
                  if (
                      not isinstance(reviewed_prefix, str)
                      or re.fullmatch(r"[0-9a-f]{10,40}", reviewed_prefix) is None
                  ):
                      errors.append(
                          "completion.reviewed_commit_prefix must be 10 to 40 lowercase hex characters"
                      )
                  elif (
                      isinstance(expected_head, str)
                      and not expected_head.startswith(reviewed_prefix)
                  ):
                      errors.append(
                          "completion.reviewed_commit_prefix does not bind expected_head"
                      )
              elif reviewed_prefix is not None:
                  errors.append(
                      "completion.reviewed_commit_prefix must be null outside clean_comment mode"
                  )
          '''
          if old not in text:
              raise SystemExit('validator anchor missing')
          validator.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/codex-review-settlement.yml')
          text = workflow.read_text()
          old = '''          set -e
                    cat codex-review-settlement.json
                    status="$(jq -r '.status // "block"' codex-review-settlement.json)"
          '''
          new = '''          set -e
                    if ! jq -e '
                      type == "object"
                      and (.status | type == "string")
                      and (.settled | type == "boolean")
                      and (.errors | type == "array")
                    ' codex-review-settlement.json > /dev/null 2>&1; then
                      jq -nc \\
                        --arg error trusted_evaluator_output_invalid \\
                        '{status:"block",settled:false,errors:[$error]}' \\
                        > codex-review-settlement.invalid.json
                      mv codex-review-settlement.invalid.json codex-review-settlement.json
                      rc=2
                    fi
                    cat codex-review-settlement.json
                    status="$(jq -r '.status // "block"' codex-review-settlement.json)"
          '''
          if old not in text:
              raise SystemExit('workflow output anchor missing')
          workflow.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_codex_review_settlement.py')
          text = tests.read_text()
          old = '''        self.assertEqual(result["evidence"]["completion"]["mode"], "reaction")
          
              def test_untrusted_request_marker_is_ignored(self) -> None:
          '''
          new = '''        self.assertEqual(result["evidence"]["completion"]["mode"], "reaction")
                  self.assertEqual(result["evidence"]["completion"]["comment_id"], 1001)
          
              def test_duplicate_request_accepts_reaction_on_later_marker(self) -> None:
                  state = base_state()
                  earliest = request_comment(
                      comment_id=1001,
                      created_at="2026-07-26T08:00:00Z",
                  )
                  later = request_comment(
                      comment_id=1002,
                      created_at="2026-07-26T08:02:00Z",
                  )
                  later["reactions"] = connection(
                      [
                          {
                              "content": "THUMBS_UP",
                              "createdAt": "2026-07-26T08:03:00Z",
                              "user": {"login": "chatgpt-codex-connector[bot]"},
                          }
                      ],
                      hasNextPage=False,
                  )
                  state["comments"] = connection(
                      [earliest, later],
                      hasPreviousPage=False,
                  )
          
                  result = self.evaluate(state)
          
                  self.assertEqual("pass", result["status"])
                  self.assertTrue(result["settled"])
                  self.assertEqual(1001, result["evidence"]["request"]["comment_id"])
                  self.assertEqual("reaction", result["evidence"]["completion"]["mode"])
                  self.assertEqual(1002, result["evidence"]["completion"]["comment_id"])
          
              def test_untrusted_request_marker_is_ignored(self) -> None:
          '''
          if old not in text:
              raise SystemExit('producer test anchor missing')
          tests.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_codex_review_settlement_workflow.py')
          text = tests.read_text()
          anchor = '    def test_status_is_diagnostic_and_exactly_named(self) -> None:\n'
          addition = '''    def test_malformed_evaluator_output_becomes_explicit_failure(self) -> None:
                  evaluate_section = self.text.split(
                      "      - name: Evaluate current-head settlement\\n", 1
                  )[1].split("      - name: Publish settlement status\\n", 1)[0]
                  self.assertIn("if ! jq -e '", evaluate_section)
                  self.assertIn("trusted_evaluator_output_invalid", evaluate_section)
                  self.assertIn("codex-review-settlement.invalid.json", evaluate_section)
                  self.assertIn("rc=2", evaluate_section)
                  self.assertLess(
                      evaluate_section.index("trusted_evaluator_output_invalid"),
                      evaluate_section.index('echo "github_state=$github_state"'),
                  )
          
          '''
          if anchor not in text:
              raise SystemExit('workflow test anchor missing')
          tests.write_text(text.replace(anchor, addition + anchor, 1))

          tests = Path('tests/test_grips.py')
          text = tests.read_text()
          old = '''def captain_codex_reaction_evidence(
              *,
              review_tier: str = "high_critical",
              closing: str = "Hooray!",
          ) -> dict[str, object]:
          '''
          new = '''def captain_codex_reaction_evidence(
              *,
              comment_id: int = 101,
              review_tier: str = "high_critical",
              closing: str = "Hooray!",
          ) -> dict[str, object]:
          '''
          if old not in text:
              raise SystemExit('guard test helper anchor missing')
          text = text.replace(old, new, 1)
          old = '''        "mode": "reaction",
                  "review_id": None,
                  "actor": "chatgpt-codex-connector[bot]",
          '''
          new = '''        "mode": "reaction",
                  "review_id": None,
                  "comment_id": comment_id,
                  "actor": "chatgpt-codex-connector[bot]",
          '''
          if old not in text:
              raise SystemExit('guard test completion anchor missing')
          text = text.replace(old, new, 1)
          anchor = '    def test_atomic_merge_guard_blocks_second_reaction_page(self) -> None:\n'
          addition = '''    def test_atomic_merge_guard_accepts_later_duplicate_reaction_marker(self) -> None:
                  parameters = authorized_captain_run_parameters()
                  parameters["codex_review_evidence"] = captain_codex_reaction_evidence(
                      comment_id=102
                  )
                  parameters["execution_intent"] = captain_execution_intent(parameters)
                  view = {
                      "number": 96,
                      "state": "OPEN",
                      "baseRefName": "main",
                      "baseRefOid": CAPTAIN_BASE_SHA,
                      "headRefName": "feat/captain",
                      "headRefOid": CAPTAIN_HEAD,
                      "isDraft": False,
                      "mergeable": "MERGEABLE",
                      "mergeStateStatus": "CLEAN",
                  }
                  initial = captain_codex_live_state(view)
                  earliest_request = deepcopy(initial["request_comment"])
                  later_request = deepcopy(earliest_request)
                  later_request["id"] = 102
                  later_request["created_at"] = "2026-07-26T08:00:30Z"
                  reaction = {
                      "content": "+1",
                      "created_at": "2026-07-26T08:01:00Z",
                      "user": {"login": "chatgpt-codex-connector[bot]"},
                  }
                  gh = FakeGh(
                      view=view,
                      diff_text=CAPTAIN_DIFF_TEXT,
                      codex_state=captain_codex_live_state(
                          view,
                          request_pages=[[earliest_request, later_request]],
                          review_pages=[[]],
                          reaction_pages=[[reaction]],
                      ),
                  )
          
                  result = grips.grip_run(
                      "captain-run",
                      parameters,
                      profile="captain",
                      allow_mutation=True,
                      command_runner=FakeGit(),
                      github_runner=gh,
                  )
          
                  execution = result["output"]["executions"][0]
                  self.assertTrue(execution["verification_passed"])
                  self.assertTrue(
                      any(
                          "issues/comments/102/reactions" in " ".join(call)
                          for call in gh.calls
                      )
                  )
          
          '''
          if anchor not in text:
              raise SystemExit('guard test insertion anchor missing')
          tests.write_text(text.replace(anchor, addition + anchor, 1))

          doc = Path('docs/external-review-loop.md')
          text = doc.read_text()
          old = 'If identical trusted markers are duplicated, the earliest canonical request is authoritative; later duplicates cannot move the review or finding cutoff. Settlement requires one of three trusted completion forms after the canonical request: a Codex pull-request review bound to the full head, a deterministic clean-result issue comment whose reviewed-commit token is a 10–40 character prefix of that head, or a thumbs-up reaction on the exact request.'
          new = 'If identical trusted markers are duplicated, the earliest canonical request remains authoritative and fixes the review and finding cutoff. A trusted thumbs-up may appear on any identical canonical marker; the completion evidence separately binds the exact reacted comment, and Captain revalidates that marker and reaction while retaining the earliest cutoff. Settlement requires one of three trusted completion forms after the canonical request: a Codex pull-request review bound to the full head, a deterministic clean-result issue comment whose reviewed-commit token is a 10–40 character prefix of that head, or a thumbs-up reaction on a bound identical request marker.'
          if old not in text:
              raise SystemExit('documentation reaction anchor missing')
          text = text.replace(old, new, 1)
          old = 'The introducing pull request therefore needs an authorized out-of-band current-head settlement; after merge, ordinary refreshes use only the trusted default-branch evaluator.'
          new = 'Empty, non-object or structurally malformed evaluator output is replaced with a bounded `trusted_evaluator_output_invalid` block result so the status publication still runs and cannot leave the head silently pending. The introducing pull request therefore needs an authorized out-of-band current-head settlement; after merge, ordinary refreshes use only the trusted default-branch evaluator.'
          if old not in text:
              raise SystemExit('documentation workflow anchor missing')
          doc.write_text(text.replace(old, new, 1))
          PY

          cat > .github/workflows/validate.yml <<'EOF'
          name: validate

          on:
            pull_request:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              strategy:
                fail-fast: false
                matrix:
                  python-version:
                    - "3.10"
                    - "3.12"

              steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

                - name: Set up Python
                  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                  with:
                    python-version: ${{ matrix.python-version }}

                - name: Validate repository
                  run: make validate

                - name: Prove reproducible deployment staging
                  run: make deploy-check
          EOF
          rm -f .github/workflows/pr474-source-export.yml
          make context-refresh
          git diff --check
          python3 -m unittest tests.test_codex_review_settlement -v
          python3 -m unittest tests.test_codex_review_settlement_workflow -v
          python3 -m unittest tests.test_grips -k reaction -v
          python3 -m unittest tests.test_grips -k clean_comment -v
          make validate
          make deploy-check

      - name: Commit and push exact validated tree
        run: |
          set -euo pipefail
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git add -A
          test -n "$(git status --short)"
          git commit -m "fix(review): bind duplicate reactions and malformed outputs"
          git push origin HEAD:fix/codex-review-settled-v1
