name: PR 474 one-shot finalize

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/codex-review-settled-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact reviewed patch
        env:
          EXPECTED_PARENT: b90f11788daf887738699e6492f663c96ab80f08
          EXPECTED_PATCH_SHA256: 891f314a391a50840535fd8a5ff5bb7a2dd112298fb67f6d8cb8b3484906b6d6
          PATCH_GZIP_B64: 
          NORMAL_VALIDATE_GZIP_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "fix/codex-review-settled-v1"
          printf '%s' "$PATCH_GZIP_B64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/pr474-code.patch"
          test "$(sha256sum "$RUNNER_TEMP/pr474-code.patch" | cut -d' ' -f1)" = "$EXPECTED_PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/pr474-code.patch"
          git apply --index "$RUNNER_TEMP/pr474-code.patch"
          printf '%s' "$NORMAL_VALIDATE_GZIP_B64" | base64 --decode | gzip --decompress > .github/workflows/validate.yml
          rm -f .github/workflows/pr474-source-export.yml
          make context-refresh
          git diff --check

      - name: Verify targeted behavior
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_codex_review_settlement -v
          python3 -m unittest tests.test_codex_review_settlement_workflow -v
          python3 -m unittest tests.test_grips -k reaction -v
          python3 -m unittest tests.test_grips -k clean_comment -v

      - name: Validate complete repository
        run: |
          set -euo pipefail
          make validate
          make deploy-check

      - name: Commit and push exact validated tree
        run: |
          set -euo pipefail
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git add -A
          test -n "$(git status --short)"
          git commit -m "fix(review): bind duplicate reactions and malformed outputs"
          git push origin HEAD:fix/codex-review-settled-v1
