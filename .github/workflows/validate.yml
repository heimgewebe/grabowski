name: PR 474 diff evidence

on:
  push:
    branches:
      - ops/pr474-diff-7879bd09

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create exact full diff
        env:
          BASE_SHA: d5573e1929ea227b9c3a1319244c2af44998cc34
          HEAD_SHA: 7879bd094a94defc8e4952136277537294e91f87
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --binary --full-index "$BASE_SHA...$HEAD_SHA" \
            > "$RUNNER_TEMP/grabowski-pr-474-final.diff"
          test -s "$RUNNER_TEMP/grabowski-pr-474-final.diff"
          sha256sum "$RUNNER_TEMP/grabowski-pr-474-final.diff" \
            | tee "$RUNNER_TEMP/grabowski-pr-474-final.diff.sha256"

      - name: Upload exact full diff
        uses: actions/upload-artifact@v7
        with:
          name: grabowski-pr-474-final-diff
          path: |
            ${{ runner.temp }}/grabowski-pr-474-final.diff
            ${{ runner.temp }}/grabowski-pr-474-final.diff.sha256
          if-no-files-found: error
          retention-days: 7
