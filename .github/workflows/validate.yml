name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: grabowski
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout Grabowski
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grabowski

      - name: Checkout pinned convergence protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heimgewebe/konvergenzregelkreis
          ref: c2f75946aa0f3f37646f3c93f1c176c683f341cc
          path: konvergenzregelkreis
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The sandbox's AF_UNIX/io_uring regressions are *kernel* tests.
      # Fail the runner if bubblewrap is absent; do not skip these tests.
      - name: Install mandatory kernel sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bubblewrap libseccomp2 apparmor-profiles apparmor-utils
          # Ubuntu restricts unprofiled unprivileged user namespaces.
          # Scope the allowance to bubblewrap, not the whole runner/kernel.
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version
          # Do not silently "pass" a CI job whose kernel sandbox cannot start.
          /usr/bin/bwrap --ro-bind / / --dev /dev --proc /proc -- /usr/bin/true

      - name: Install locked runtime dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check --no-input
          --require-hashes --no-deps -r requirements/runtime.lock.txt

      - name: Prepare pinned convergence evaluator
        working-directory: konvergenzregelkreis
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .

      - name: Validate repository
        run: make validate

      - name: Prove reproducible deployment staging
        run: make deploy-check
