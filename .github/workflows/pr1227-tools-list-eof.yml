name: PR 1227 tools list EOF remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-tools-list-eof.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0c18ddc26d23daa572910a798a7f30dec334821f"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "73c48eb14fb13fd782e616adf7bc06f886c390f6"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "f83bde6cf5689fbdca8a1d0243ced483b7bfb463"
      - name: Apply EOF gate and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          tests_path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one preimage, found {count}")
              return text.replace(old, new, 1)

          runner = replace_once(
              runner,
              "    tools_list_ids: set[Any] = set()\n    resource_calls: dict[Any, tuple[str, str | None]] = {}\n",
              "    tools_list_ids: set[Any] = set()\n    tools_inventory_validated = False\n    resource_calls: dict[Any, tuple[str, str | None]] = {}\n",
              "inventory state",
          )
          runner = replace_once(
              runner,
              '                tools = _filtered_treatment_tools(message.get("result"))\n                message = {"jsonrpc":"2.0","id":identifier,"result":{"tools":tools}}\n',
              '                tools = _filtered_treatment_tools(message.get("result"))\n                tools_inventory_validated = True\n                message = {"jsonrpc":"2.0","id":identifier,"result":{"tools":tools}}\n',
              "successful inventory marker",
          )
          runner = replace_once(
              runner,
              "            _proxy_write(message, output_lock)\n        returncode = process.wait(timeout=5)\n",
              "            _proxy_write(message, output_lock)\n        with state_lock:\n            pending_tools_list = bool(tools_list_ids)\n        if pending_tools_list or not tools_inventory_validated:\n            raise RunnerError(\"MCP tools/list inventory was not validated before upstream EOF\")\n        returncode = process.wait(timeout=5)\n",
              "EOF inventory gate",
          )

          anchor = '    def test_mcp_proxy_rejects_unsuccessful_tools_list_responses(self) -> None:\n'
          regression = "\n".join([
              "    def test_mcp_proxy_rejects_eof_with_unanswered_tools_list(self) -> None:",
              "        with tempfile.TemporaryDirectory() as temporary:",
              "            root = Path(temporary)",
              "            upstream = root / \"mcp.py\"",
              "            upstream.write_text(",
              "                \"import sys\\n\"",
              "                \"sys.stdin.readline()\\n\",",
              "                encoding=\"utf-8\",",
              "            )",
              "            payload = json.dumps(",
              "                {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/list\", \"params\": {}}",
              "            ).encode() + b\"\\n\"",
              "            completed = subprocess.run(",
              "                [sys.executable, str(MODULE_PATH), \"--codex-mcp-proxy\", json.dumps([sys.executable, str(upstream)])],",
              "                input=payload, capture_output=True, check=False, timeout=5,",
              "            )",
              "            self.assertNotEqual(completed.returncode, 0)",
              "            self.assertIn(b\"inventory was not validated\", completed.stderr)",
              "",
              "",
          ])
          tests = replace_once(tests, anchor, regression + anchor, "EOF regression")

          runner_path.write_text(runner, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          compile(runner, str(runner_path), "exec")
          compile(tests, str(tests_path), "exec")
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_repobrief_agent_benchmark_codex_runner.py
          git diff --check
          python3 tools/check_no_secrets.py
      - name: Publish code-only fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1227-tools-list-eof.yml
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py .github/workflows/pr1227-tools-list-eof.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rab): require validated tools inventory before EOF'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
