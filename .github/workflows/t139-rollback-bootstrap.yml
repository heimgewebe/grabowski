---
name: T139 rollback bootstrap

permissions:
  contents: write

"on":
  push:
    branches:
      - fix/t139-chatgpt-connector-rollback

jobs:
  restore-pre-t139-tree:
    if: ${{ github.ref == 'refs/heads/fix/t139-chatgpt-connector-rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          fetch-depth: 0

      - name: Restore the exact pre-T139 files and remove this bootstrap
        env:
          EXPECTED_BASE_SHA: f18ea82f959ed097fb9c6bdc07502597d0ee85b2
          RESTORE_SHA: d9c9c1b2964ccbd567928bea2e6706d9f863df7b
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "${EXPECTED_BASE_SHA}"
          test "$(git rev-parse "${RESTORE_SHA}")" = "${RESTORE_SHA}"

          git checkout "${RESTORE_SHA}" -- \
            docs/generated/operator-context.v1.json \
            docs/restart-watchdog.md \
            src/grabowski_grips.py \
            src/grabowski_mcp.py \
            src/grabowski_operator.py \
            src/grabowski_transport_roundtrip.py \
            tests/test_operator_contract.py \
            tests/test_transport_gate_integration.py \
            tests/test_transport_roundtrip.py \
            tests/test_transport_roundtrip_intent_replacement.py

          git rm -- \
            docs/proofs/t139-stateless-runtime-regression-hotfix.md \
            docs/proofs/transport-roundtrip-v3-t139-20260804.md \
            docs/transport-roundtrip-v3.md \
            .github/workflows/t139-rollback-bootstrap.yml

          git add -A

          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'EOF'
          .github/workflows/t139-rollback-bootstrap.yml
          docs/generated/operator-context.v1.json
          docs/proofs/t139-stateless-runtime-regression-hotfix.md
          docs/proofs/transport-roundtrip-v3-t139-20260804.md
          docs/restart-watchdog.md
          docs/transport-roundtrip-v3.md
          src/grabowski_grips.py
          src/grabowski_mcp.py
          src/grabowski_operator.py
          src/grabowski_transport_roundtrip.py
          tests/test_operator_contract.py
          tests/test_transport_gate_integration.py
          tests/test_transport_roundtrip.py
          tests/test_transport_roundtrip_intent_replacement.py
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/expected-paths.txt"
          git diff --cached --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/actual-paths.txt"
          LC_ALL=C sort -o "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/expected-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "revert(operator): temporarily restore pre-T139 transport"
          git push origin "HEAD:${GITHUB_REF_NAME}"
