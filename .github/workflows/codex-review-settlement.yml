---
name: Codex review settlement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-settlement-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  settle:
    name: Codex review settled
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr="$INPUT_PR"
          else
            pr="$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH")"
          fi
          if [ -z "$pr" ]; then
            echo "Cannot resolve pull request number" >&2
            exit 1
          fi
          payload="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid,isDraft,state)"
          head_sha="$(jq -r '.headRefOid // empty' <<<"$payload")"
          if [ -z "$head_sha" ]; then
            echo "Cannot resolve pull request head SHA" >&2
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Mark current head pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="Codex review settled" \
            -f description="Checking current-head Codex review settlement"

      - name: Checkout trusted evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Request current-head Codex review
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set +e
          python3 tools/codex_review_settlement.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --require \
            --json \
            request > codex-review-request.json
          rc=$?
          set -e
          cat codex-review-request.json
          echo "returncode=$rc" >> "$GITHUB_OUTPUT"

      - name: Evaluate current-head settlement
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REQUEST_RETURN_CODE: ${{ steps.request.outputs.returncode || '0' }}
        run: |
          set +e
          python3 tools/codex_review_settlement.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --require \
            --json \
            evaluate > codex-review-settlement.json
          rc=$?
          set -e
          cat codex-review-settlement.json
          status="$(jq -r '.status // "block"' codex-review-settlement.json)"
          if [ "$REQUEST_RETURN_CODE" != "0" ]; then
            status="block"
          fi
          case "$status" in
            pass)
              github_state="success"
              description="Current-head Codex review requirement satisfied"
              ;;
            pending)
              github_state="pending"
              description="Waiting for current-head Codex review"
              ;;
            *)
              github_state="failure"
              description="Codex review settlement is blocked"
              ;;
          esac
          first_error="$(jq -r '.errors[0] // empty' codex-review-settlement.json)"
          if [ -n "$first_error" ]; then
            description="$first_error"
          fi
          description="$(printf '%s' "$description" | cut -c1-140)"
          echo "tool_returncode=$rc" >> "$GITHUB_OUTPUT"
          echo "github_state=$github_state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Publish settlement status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          STATE: ${{ steps.evaluate.outputs.github_state }}
          DESCRIPTION: ${{ steps.evaluate.outputs.description }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="Codex review settled" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail blocked settlement
        if: steps.evaluate.outputs.github_state == 'failure'
        run: exit 1
