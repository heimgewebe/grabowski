---
name: Codex review settlement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    codex-review-settlement-${{
      github.event.pull_request.number
      || github.event.issue.number
      || inputs.pr
      || github.run_id
    }}
  cancel-in-progress: true

jobs:
  settle:
    name: Codex review settled
    if: >-
      github.event_name != 'issue_comment'
      || (
        github.event.issue.pull_request
        && github.event.comment.user.login != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr="$INPUT_PR"
          else
            pr="$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH")"
          fi
          if [ -z "$pr" ]; then
            echo "Cannot resolve pull request number" >&2
            exit 1
          fi
          payload="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefOid,baseRefName,isDraft,state)"
          head_sha="$(jq -r '.headRefOid // empty' <<<"$payload")"
          base_sha="$(jq -r '.baseRefOid // empty' <<<"$payload")"
          base_ref="$(jq -r '.baseRefName // empty' <<<"$payload")"
          if [ -z "$head_sha" ]; then
            echo "Cannot resolve pull request head SHA" >&2
            exit 1
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git check-ref-format "refs/heads/$base_ref"; then
            echo "Invalid pull request base SHA or ref" >&2
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Mark current head pending
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="Codex review settled" \
            -f description="Checking current-head Codex review settlement"

      - name: Checkout trusted evaluator
        id: trusted_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact PR history for local diff fallback
        id: fetched_objects
        if: steps.trusted_checkout.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git check-ref-format "refs/heads/${BASE_REF}"; then
            echo "Invalid bound pull request or head SHA" >&2
            exit 1
          fi
          # Never check out PR code. A one-command credential helper uses the
          # step-local token without persisting credentials in the Git config.
          GIT_TERMINAL_PROMPT=0 git \
            -c 'credential.helper=!gh auth git-credential' \
            -c 'protocol.file.allow=never' \
            fetch --no-tags --no-write-fetch-head --no-recurse-submodules \
            -- origin "refs/heads/${BASE_REF}:refs/settlement/base-tip" "refs/pull/${PR_NUMBER}/head:refs/settlement/head"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          # baseRefOid is a PR snapshot. A later fast-forward of the target
          # branch must not invalidate it; force-push/non-ancestral drift does.
          git merge-base --is-ancestor "$BASE_SHA" "refs/settlement/base-tip"
          git update-ref refs/settlement/base "$BASE_SHA"
          test "$(git rev-parse "refs/settlement/base^{commit}")" = "$BASE_SHA"
          test "$(git rev-parse "refs/settlement/head^{commit}")" = "$HEAD_SHA"

      - name: Evaluate current-head settlement
        id: evaluate
        if: always() && steps.pr.outcome == 'success' && steps.pending.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHECKOUT_OUTCOME: ${{ steps.trusted_checkout.outcome }}
          FETCH_OUTCOME: ${{ steps.fetched_objects.outcome }}
        run: |
          set +e
          if [ "$CHECKOUT_OUTCOME" != "success" ] || [ "$FETCH_OUTCOME" != "success" ]; then
            jq -nc \
              --arg error "trusted Git checkout/fetch/pinning failed: checkout=$CHECKOUT_OUTCOME fetch=$FETCH_OUTCOME" \
              '{
                status:"block",
                status_code:"trusted_pr_object_pinning_failed",
                exit_code:2,
                github_state:"failure",
                description:"Trusted PR object pinning failed",
                settled:false,
                errors:[$error]
              }' > codex-review-settlement.json
            rc=2
          elif [ ! -f tools/codex_review_settlement.py ]; then
            jq -nc \
              --arg error trusted_evaluator_missing_on_default_branch \
              '{
                status:"block",
                status_code:"trusted_evaluator_missing",
                exit_code:2,
                github_state:"failure",
                description:"Trusted evaluator missing on default branch",
                settled:false,
                errors:[$error]
              }' > codex-review-settlement.json
            rc=2
          else
            python3 tools/codex_review_settlement.py \
              --repository "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER" \
              --json \
              evaluate > codex-review-settlement.json
            rc=$?
          fi
          set -e
          if ! jq -e '
            type == "object"
            and (.status | type == "string")
            and (.status_code | type == "string" and length > 0)
            and (.exit_code | type == "number")
            and ((.exit_code | floor) == .exit_code)
            and (.github_state | type == "string")
            and (.description | type == "string" and length > 0 and length <= 140)
            and (.settled | type == "boolean")
            and (.errors | type == "array")
            and all(.errors[]; type == "string")
          ' codex-review-settlement.json > /dev/null 2>&1; then
            jq -nc \
              --arg error trusted_evaluator_output_invalid \
              '{
                status:"block",
                status_code:"trusted_evaluator_output_invalid",
                exit_code:2,
                github_state:"failure",
                description:"Trusted evaluator output is invalid",
                settled:false,
                errors:[$error]
              }' > codex-review-settlement.invalid.json
            mv codex-review-settlement.invalid.json codex-review-settlement.json
            rc=2
          elif ! jq -e --argjson rc "$rc" '
            .exit_code == $rc
            and (
              (.status == "pass" and .exit_code == 0 and .github_state == "success")
              or (.status == "pending" and .exit_code == 3 and .github_state == "pending")
              or (.status == "block" and .exit_code == 2 and .github_state == "failure")
            )
          ' codex-review-settlement.json > /dev/null 2>&1; then
            observed_status="$(jq -r '.status // "missing"' codex-review-settlement.json)"
            observed_code="$(jq -r '.status_code // "missing"' codex-review-settlement.json)"
            observed_exit="$(jq -r '.exit_code // "missing"' codex-review-settlement.json)"
            error="trusted evaluator status/exit mismatch: status=$observed_status code=$observed_code result_exit=$observed_exit process_exit=$rc"
            jq -nc \
              --arg error "$error" \
              '{
                status:"block",
                status_code:"trusted_evaluator_status_exit_mismatch",
                exit_code:2,
                github_state:"failure",
                description:"Trusted evaluator status and exit code disagree",
                settled:false,
                errors:[$error]
              }' > codex-review-settlement.invalid.json
            mv codex-review-settlement.invalid.json codex-review-settlement.json
            rc=2
          fi
          cat codex-review-settlement.json
          github_state="$(jq -r '.github_state' codex-review-settlement.json)"
          description="$(jq -r '.description' codex-review-settlement.json | cut -c1-140)"
          echo "tool_returncode=$rc" >> "$GITHUB_OUTPUT"
          echo "github_state=$github_state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Publish settlement status
        if: always() && steps.pr.outcome == 'success' && steps.pending.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          STATE: ${{ steps.evaluate.outputs.github_state || 'failure' }}
          DESCRIPTION: ${{ steps.evaluate.outputs.description || 'Trusted Codex settlement interrupted' }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="Codex review settled" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail blocked settlement
        if: always() && steps.pending.outcome == 'success' && (steps.evaluate.outcome == 'failure' || steps.evaluate.outputs.github_state == 'failure' || steps.trusted_checkout.outcome != 'success' || steps.fetched_objects.outcome != 'success')
        run: exit 1
