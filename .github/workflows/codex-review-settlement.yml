---
name: Codex review settlement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    codex-review-settlement-${{
      github.event.pull_request.number
      || github.event.issue.number
      || inputs.pr
      || github.run_id
    }}
  cancel-in-progress: true

jobs:
  settle:
    name: Codex review settled
    if: >-
      github.event_name != 'issue_comment'
      || (
        github.event.issue.pull_request
        && github.event.comment.user.login != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr="$INPUT_PR"
          else
            pr="$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH")"
          fi
          if [ -z "$pr" ]; then
            echo "Cannot resolve pull request number" >&2
            exit 1
          fi
          payload="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid,isDraft,state)"
          head_sha="$(jq -r '.headRefOid // empty' <<<"$payload")"
          if [ -z "$head_sha" ]; then
            echo "Cannot resolve pull request head SHA" >&2
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Mark current head pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="Codex review settled" \
            -f description="Checking current-head Codex review settlement"

      - name: Checkout trusted evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate current-head settlement
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set +e
          if [ ! -f tools/codex_review_settlement.py ]; then
            jq -nc \
              --arg error trusted_evaluator_missing_on_default_branch \
              '{status:"block",settled:false,errors:[$error]}' \
              > codex-review-settlement.json
            rc=2
          else
            python3 tools/codex_review_settlement.py \
              --repository "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER" \
              --require \
              --json \
              evaluate > codex-review-settlement.json
            rc=$?
          fi
          set -e
          if ! jq -e '
            type == "object"
            and (.status | type == "string")
            and (.settled | type == "boolean")
            and (.errors | type == "array")
          ' codex-review-settlement.json > /dev/null 2>&1; then
            jq -nc \
              --arg error trusted_evaluator_output_invalid \
              '{status:"block",settled:false,errors:[$error]}' \
              > codex-review-settlement.invalid.json
            mv codex-review-settlement.invalid.json codex-review-settlement.json
            rc=2
          fi
          cat codex-review-settlement.json
          status="$(jq -r '.status // "block"' codex-review-settlement.json)"
          case "$status" in
            pass)
              github_state="success"
              description="Current-head Codex review requirement satisfied"
              ;;
            pending)
              github_state="pending"
              description="Connected user must request current-head Codex review"
              ;;
            *)
              github_state="failure"
              description="Codex review settlement is blocked"
              ;;
          esac
          first_error="$(jq -r '.errors[0] // empty' codex-review-settlement.json)"
          if [ -n "$first_error" ]; then
            description="$first_error"
          fi
          description="$(printf '%s' "$description" | cut -c1-140)"
          echo "tool_returncode=$rc" >> "$GITHUB_OUTPUT"
          echo "github_state=$github_state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Publish settlement status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          STATE: ${{ steps.evaluate.outputs.github_state }}
          DESCRIPTION: ${{ steps.evaluate.outputs.description }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="Codex review settled" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail blocked settlement
        if: steps.evaluate.outputs.github_state == 'failure'
        run: exit 1
