name: PR 1227 final exact-head remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-final3-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c9a830c09ea37e841ec0dcaa866a90bc67c280cd"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "b62e6a52253057dd3cce9317cba67672e62544ac"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "2781c8f6ca2a3dce0a71cde5bccabac58ae1989b"
      - name: Apply fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          tests_path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one preimage, found {count}")
              return text.replace(old, new, 1)

          runner = replace_once(
              runner,
              '    if prctl(36, 1, 0, 0, 0) != 0:  # Linux PR_SET_CHILD_SUBREAPER\n'
              '        error = ctypes.get_errno()\n'
              '        raise RunnerError(\n'
              '            f"provider containment cannot enable child subreaper: {os.strerror(error)}"\n'
              '        )\n\n\n'
              'def run_bounded(\n',
              '    if prctl(36, 1, 0, 0, 0) != 0:  # Linux PR_SET_CHILD_SUBREAPER\n'
              '        error = ctypes.get_errno()\n'
              '        raise RunnerError(\n'
              '            f"provider containment cannot enable child subreaper: {os.strerror(error)}"\n'
              '        )\n\n\n'
              'def _direct_child_pids() -> set[int]:\n'
              '    """Return this process\' direct Linux children for descendant containment."""\n'
              '    path = Path(f"/proc/self/task/{os.getpid()}/children")\n'
              '    try:\n'
              '        payload = path.read_text(encoding="ascii").strip()\n'
              '    except (OSError, UnicodeError) as exc:\n'
              '        raise RunnerError("provider containment cannot enumerate child processes") from exc\n'
              '    if not payload:\n'
              '        return set()\n'
              '    try:\n'
              '        return {int(value) for value in payload.split()}\n'
              '    except ValueError as exc:\n'
              '        raise RunnerError("provider containment received invalid child process data") from exc\n\n\n'
              'def run_bounded(\n',
              "direct child helper",
          )

          runner = replace_once(
              runner,
              '    _enable_child_subreaper()\n\n'
              '    try:\n'
              '        process = subprocess.Popen(\n',
              '    _enable_child_subreaper()\n'
              '    baseline_children = _direct_child_pids()\n\n'
              '    try:\n'
              '        process = subprocess.Popen(\n',
              "snapshot baseline children",
          )

          old_cleanup = '''    def reap_process_group_children() -> None:
              while True:
                  try:
                      child_pid, _status = os.waitpid(-process.pid, os.WNOHANG)
                  except ChildProcessError:
                      return
                  except OSError as exc:
                      note_error(f"process_group_reap_failed:{type(exc).__name__}")
                      return
                  if child_pid == 0:
                      return

              def contain_surviving_process_group() -> None:
                  if not process_group_exists():
                      return
                  note_error("process_group_survived_provider_exit")
                  kill_process_tree()
                  cleanup_deadline = time.monotonic() + 1.0
                  while time.monotonic() < cleanup_deadline:
                      reap_process_group_children()
                      if not process_group_exists():
                          return
                      time.sleep(0.01)
                  reap_process_group_children()
                  if process_group_exists():
                      note_error("process_group_cleanup_failed")
          '''
          new_cleanup = '''    def adopted_provider_children() -> set[int]:
              try:
                  return _direct_child_pids() - baseline_children
              except RunnerError:
                  note_error("provider_child_scan_failed")
                  return set()

              def kill_adopted_children(children: set[int]) -> None:
                  for child_pid in sorted(children):
                      try:
                          os.kill(child_pid, signal.SIGKILL)
                      except ProcessLookupError:
                          continue
                      except OSError as exc:
                          note_error(f"adopted_child_kill_failed:{type(exc).__name__}")

              def reap_adopted_children(children: set[int]) -> None:
                  for child_pid in sorted(children):
                      try:
                          os.waitpid(child_pid, os.WNOHANG)
                      except ChildProcessError:
                          continue
                      except OSError as exc:
                          note_error(f"adopted_child_reap_failed:{type(exc).__name__}")

              def contain_surviving_process_group() -> None:
                  group_present = process_group_exists()
                  adopted = adopted_provider_children()
                  if not group_present and not adopted:
                      return
                  if group_present:
                      note_error("process_group_survived_provider_exit")
                      kill_process_tree()
                  if adopted:
                      note_error("adopted_descendant_survived_provider_exit")
                      kill_adopted_children(adopted)
                  cleanup_deadline = time.monotonic() + 1.0
                  while time.monotonic() < cleanup_deadline:
                      adopted = adopted_provider_children()
                      if adopted:
                          kill_adopted_children(adopted)
                          reap_adopted_children(adopted)
                      group_present = process_group_exists()
                      adopted = adopted_provider_children()
                      if not group_present and not adopted:
                          return
                      if group_present:
                          kill_process_tree()
                      time.sleep(0.01)
                  adopted = adopted_provider_children()
                  if adopted:
                      kill_adopted_children(adopted)
                      reap_adopted_children(adopted)
                  if process_group_exists() or adopted_provider_children():
                      note_error("process_group_cleanup_failed")
          '''
          runner = replace_once(runner, old_cleanup, new_cleanup, "detached descendant containment")

          runner = replace_once(
              runner,
              '        lexer = shlex.shlex(text.strip(), posix=True, punctuation_chars=";&|<>")\n'
              '        lexer.whitespace_split = True\n'
              '        parts = list(lexer)\n',
              '        lexer = shlex.shlex(text.strip(), posix=True, punctuation_chars=";&|<>")\n'
              '        lexer.commenters = ""\n'
              '        lexer.whitespace_split = True\n'
              '        parts = list(lexer)\n',
              "bash-compatible hash parsing",
          )

          tests = replace_once(
              tests,
              '        self.assertEqual(runner.command_kind("rg \'foo{1,3}\' src"), "grep")\n'
              '        self.assertEqual(runner.command_kind("rg --regexp=example src"), "grep")\n',
              '        self.assertEqual(runner.command_kind("rg \'foo{1,3}\' src"), "grep")\n'
              '        self.assertEqual(runner.command_kind("rg foo#bar src"), "grep")\n'
              '        self.assertEqual(runner.command_kind("rg --regexp=example src"), "grep")\n',
              "mid-word hash positive regression",
          )
          tests = replace_once(
              tests,
              '            \'rg "$HOME" src\',\n'
              '        ):\n',
              '            \'rg "$HOME" src\',\n'
              '            "rg foo#bar | id",\n'
              '            "rg foo#bar ../outside",\n'
              '        ):\n',
              "mid-word hash bypass regressions",
          )

          detached_anchor = '    def test_run_bounded_times_out_when_provider_does_not_read_stdin(self) -> None:\n'
          detached_test = (
              '    def test_run_bounded_reaps_descendant_that_detaches_from_provider_group(self) -> None:\n'
              '        with tempfile.TemporaryDirectory() as temporary:\n'
              '            root = Path(temporary)\n'
              '            child_state = root / "detached.pid"\n'
              '            script = root / "provider.py"\n'
              '            script.write_text(\n'
              '                "import os, pathlib, time\\n"\n'
              '                "child = os.fork()\\n"\n'
              '                "if child == 0:\\n"\n'
              '                "    os.setsid()\\n"\n'
              '                f"    pathlib.Path({str(child_state)!r}).write_text(str(os.getpid()))\\n"\n'
              '                "    for fd in (0, 1, 2):\\n"\n'
              '                "        try:\\n"\n'
              '                "            os.close(fd)\\n"\n'
              '                "        except OSError:\\n"\n'
              '                "            pass\\n"\n'
              '                "    time.sleep(30)\\n"\n'
              '                "    os._exit(0)\\n"\n'
              '                f"state = pathlib.Path({str(child_state)!r})\\n"\n'
              '                "while not state.exists():\\n"\n'
              '                "    time.sleep(0.01)\\n"\n'
              '                "os._exit(0)\\n",\n'
              '                encoding="utf-8",\n'
              '            )\n'
              '            capture = runner.run_bounded(\n'
              '                [sys.executable, str(script)], cwd=root, timeout_seconds=3, stdin_data=b""\n'
              '            )\n'
              '            self.assertIn("adopted_descendant_survived_provider_exit", str(capture["capture_error"]))\n'
              '            self.assertNotIn("process_group_cleanup_failed", str(capture["capture_error"]))\n'
              '            child_pid = int(child_state.read_text())\n'
              '            with self.assertRaises(ProcessLookupError):\n'
              '                os.kill(child_pid, 0)\n\n'
          )
          tests = replace_once(tests, detached_anchor, detached_test + detached_anchor, "detached descendant regression")

          runner_path.write_text(runner, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_repobrief_agent_benchmark_codex_runner.py
          git diff --check
          python3 tools/check_no_secrets.py
      - name: Publish code-only fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1227-final3-remediation.yml
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py .github/workflows/pr1227-final3-remediation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rab): close final exact-head review gaps'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
