name: PR 959 bounded closeout writer

on:
  push:
    branches:
      - bureau/grabowski-operator-surface-v1-fu-same-owner-branch-attempt-cas-20260821/8efba1a625

permissions:
  contents: write

env:
  EXPECTED_PARENT: 777720258e114871c27e7f54dc3c8aa4021a3504
  WRITER_PATH: .github/workflows/pr959-closeout-once.yml

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify one-shot preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WRITER_PATH"
          test "$(git branch --show-current)" = "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain)"

      - name: Merge main, harden review gaps, test, and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "grabowski-pr959-closeout"
          git config user.email "grabowski-pr959-closeout@users.noreply.github.com"
          git fetch --no-tags origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for path in "${conflicts[@]}"; do
              case "$path" in
                contracts/capability-catalog.v1.json|contracts/publication-profiles.v1.json|docs/generated/operator-context.md|docs/generated/operator-context.v1.json)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected semantic merge conflict: $path" >&2
                  exit 41
                  ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, label: str, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched: {label}")

          operator = Path("src/grabowski_operator.py")
          replace_once(
              operator,
              "recursive submodule mutation",
              '    bound_ref = f"refs/heads/{bound_branch}"\n\n    if subcommand == "rebase":\n',
              '    bound_ref = f"refs/heads/{bound_branch}"\n\n'
              '    if any(\n'
              '        item == "--recurse-submodules" or item.startswith("--recurse-submodules=")\n'
              '        for item in command_arguments\n'
              '    ):\n'
              '        raise PermissionError(\n'
              '            "recursive Git submodule mutation is blocked because a parent branch-attempt lease does not serialize nested repositories"\n'
              '        )\n\n'
              '    if subcommand == "rebase":\n',
          )
          replace_once(
              operator,
              "value-taking checkout options",
              '        named_branch: str | None = None\n'
              '        positional_only = False\n'
              '        index = 0\n'
              '        while index < len(command_arguments):\n'
              '            item = command_arguments[index]\n'
              '            if item == "--":\n'
              '                positional_only = True\n'
              '                index += 1\n'
              '                continue\n'
              '            if not positional_only and item in branch_options:\n',
              '        value_options = {"--conflict"}\n'
              '        if subcommand == "checkout":\n'
              '            value_options.add("--pathspec-from-file")\n'
              '        named_branch: str | None = None\n'
              '        positional_only = False\n'
              '        index = 0\n'
              '        while index < len(command_arguments):\n'
              '            item = command_arguments[index]\n'
              '            if item == "--":\n'
              '                positional_only = True\n'
              '                index += 1\n'
              '                continue\n'
              '            if not positional_only and item in value_options:\n'
              '                if index + 1 >= len(command_arguments):\n'
              '                    raise ValueError(f"git {subcommand} {item} requires a value")\n'
              '                index += 2\n'
              '                continue\n'
              '            if not positional_only and any(\n'
              '                item.startswith(option + "=") for option in value_options\n'
              '            ):\n'
              '                index += 1\n'
              '                continue\n'
              '            if not positional_only and item in branch_options:\n',
          )

          resources = Path("src/grabowski_resources.py")
          text = resources.read_text(encoding="utf-8")
          complete_start = text.index("def complete_branch_mutation_attempt(")
          attempt_start = text.index('    if origin == "attempt_only":', complete_start)
          preexisting_start = text.index('    if origin != "preexisting":', attempt_start)
          attempt_block = "\n".join([
              '    if origin == "attempt_only":',
              '        expected = attempt_lease.get("lease")',
              '        if not isinstance(expected, dict):',
              '            raise ValueError("attempt-only lease snapshot is missing")',
              '        expected_snapshot = _release_lease_snapshot(expected)',
              '        with _database() as connection:',
              '            connection.execute("BEGIN IMMEDIATE")',
              '            try:',
              '                row = connection.execute(',
              '                    "SELECT * FROM leases WHERE resource_key=?", (branch_key,)',
              '                ).fetchone()',
              '                if row is None:',
              '                    raise RuntimeError(',
              '                        "attempt-only branch lease disappeared before cleanup"',
              '                    )',
              '                if row["owner_id"] != owner:',
              '                    raise PermissionError(',
              '                        "attempt-only branch lease owner changed before cleanup"',
              '                    )',
              '                if _release_lease_snapshot(row) != expected_snapshot:',
              '                    raise RuntimeError(',
              '                        "attempt-only branch lease changed before cleanup"',
              '                    )',
              '                metadata = _row_metadata(row)',
              '                _, observed_sha256 = _metadata(metadata)',
              '                if row["metadata_sha256"] != observed_sha256:',
              '                    raise RuntimeError(',
              '                        f"Resource lease metadata integrity mismatch: {branch_key}"',
              '                    )',
              '                observed_attempt = metadata.get(BRANCH_MUTATION_ATTEMPT_METADATA_KEY)',
              '                if not isinstance(observed_attempt, dict):',
              '                    raise RuntimeError(',
              '                        "branch mutation attempt marker disappeared before cleanup"',
              '                    )',
              '                if observed_attempt.get("binding_sha256") != binding_sha256:',
              '                    raise RuntimeError(',
              '                        "branch mutation attempt binding changed before cleanup"',
              '                    )',
              '                if observed_attempt.get("lease_origin") != "attempt_only":',
              '                    raise RuntimeError(',
              '                        "branch mutation attempt origin changed before cleanup"',
              '                    )',
              '                released = _public(row)',
              '                connection.execute(',
              '                    "DELETE FROM leases WHERE resource_key=? AND owner_id=?",',
              '                    (branch_key, owner),',
              '                )',
              '                connection.commit()',
              '            except Exception:',
              '                connection.rollback()',
              '                raise',
              '        if _release_lease_snapshot(released) != expected_snapshot:',
              '            raise RuntimeError("attempt-only branch lease release snapshot drifted")',
              '        return {',
              '            "schema_version": 1,',
              '            "kind": "grabowski_branch_mutation_attempt_cleanup",',
              '            "resource_key": branch_key,',
              '            "lease_origin": origin,',
              '            "action": "released",',
              '            "snapshot_guarded": True,',
              '        }',
              '',
          ])
          text = text[:attempt_start] + attempt_block + text[preexisting_start:]

          renew_start = text.index("def renew_resources(")
          release_start = text.index("def release_resources(", renew_start)
          renew_block = text[renew_start:release_start]
          renew_marker = '                row_metadata = _row_metadata(row)\n'
          if renew_block.count(renew_marker) != 1:
              raise SystemExit(f"renew marker count={renew_block.count(renew_marker)}")
          renew_guard = (
              renew_marker
              + '                if BRANCH_MUTATION_ATTEMPT_METADATA_KEY in row_metadata:\n'
              + '                    raise RuntimeError(\n'
              + '                        "branch mutation attempt leases are non-renewable while an effect may be running"\n'
              + '                    )\n'
          )
          renew_block = renew_block.replace(renew_marker, renew_guard, 1)
          text = text[:renew_start] + renew_block + text[release_start:]

          release_start = text.index("def release_resources(")
          inspect_start = text.index("def inspect_resource(", release_start)
          release_block = text[release_start:inspect_start]
          release_marker = '            released.append(_public(row))\n'
          if release_block.count(release_marker) != 1:
              raise SystemExit(f"release marker count={release_block.count(release_marker)}")
          release_guard = (
              '            row_metadata = _row_metadata(row)\n'
              + '            if BRANCH_MUTATION_ATTEMPT_METADATA_KEY in row_metadata:\n'
              + '                raise RuntimeError(\n'
              + '                    "live branch mutation attempt lease requires attempt-specific cleanup"\n'
              + '                )\n'
              + release_marker
          )
          release_block = release_block.replace(release_marker, release_guard, 1)
          text = text[:release_start] + release_block + text[inspect_start:]
          resources.write_text(text, encoding="utf-8")
          print("patched: attempt-specific resource cleanup and generic mutation guards")

          operator_tests = Path("tests/test_operator_contract.py")
          replace_once(
              operator_tests,
              "operator regression cases",
              '            ["update-index", "--skip-worktree", "README.md"],\n        ):\n',
              '            ["update-index", "--skip-worktree", "README.md"],\n'
              '            ["checkout", "--conflict", "merge", "other"],\n'
              '            ["checkout", "--conflict=merge", "other"],\n'
              '            ["switch", "--conflict", "merge", "other"],\n'
              '            ["reset", "--hard", "--recurse-submodules"],\n'
              '            ["checkout", "--recurse-submodules", "feature"],\n'
              '        ):\n',
          )
          replace_once(
              operator_tests,
              "operator regression error match",
              '                    PermissionError, "branch|target refs|detach|rebase|index|HEAD|delet"\n',
              '                    PermissionError, "branch|target refs|detach|rebase|index|HEAD|delet|submodule"\n',
          )

          resource_tests = Path("tests/test_resources.py")
          replace_once(
              resource_tests,
              "generic attempt release and renew regression",
              '        self.assertIsNone(resources.inspect_resource(attempt["resource_key"]))\n\n'
              '    def test_expired_same_owner_repository_reentry_binds_exact_target(self) -> None:\n',
              '        self.assertIsNone(resources.inspect_resource(attempt["resource_key"]))\n\n'
              '    def test_branch_attempt_generic_release_and_renew_cannot_clear_live_marker(self) -> None:\n'
              '        (self.root / ".git").mkdir()\n'
              '        owner = "operator:attempt-generic-mutation"\n'
              '        attempt = resources.acquire_branch_mutation_attempt(\n'
              '            owner,\n'
              '            str(self.root),\n'
              '            "feat/generic-mutation-guard",\n'
              '            operation_id="operation-a",\n'
              '            attempt_id="attempt-1",\n'
              '            expected_preimage_sha256="f" * 64,\n'
              '            ttl_seconds=60,\n'
              '        )\n'
              '        key = attempt["resource_key"]\n'
              '        snapshot = resources._release_lease_snapshot(attempt["lease"])\n\n'
              '        with self.assertRaisesRegex(RuntimeError, "attempt-specific cleanup"):\n'
              '            resources.release_resources(owner, [key])\n'
              '        with self.assertRaisesRegex(RuntimeError, "attempt-specific cleanup"):\n'
              '            resources.release_resources(owner, [key], expected_leases=[snapshot])\n'
              '        with self.assertRaisesRegex(RuntimeError, "non-renewable"):\n'
              '            resources.renew_resources(owner, [key], ttl_seconds=120)\n'
              '        with self.assertRaisesRegex(RuntimeError, "attempt-specific cleanup"):\n'
              '            resources.release_resources("operator:force-cleanup", [key], force=True)\n\n'
              '        self.assertIsNotNone(resources.inspect_resource(key))\n'
              '        cleanup = resources.complete_branch_mutation_attempt(attempt)\n'
              '        self.assertEqual("released", cleanup["action"])\n'
              '        self.assertIsNone(resources.inspect_resource(key))\n\n'
              '    def test_expired_same_owner_repository_reentry_binds_exact_target(self) -> None:\n',
          )
          PY

          python -m py_compile src/grabowski_operator.py src/grabowski_resources.py
          make context-refresh
          rm -- "$WRITER_PATH"
          git add -A
          git diff --cached --check

          python -m unittest discover -s tests -p 'test_operator_contract.py' -v
          python -m unittest discover -s tests -p 'test_resources.py' -v
          make context-check profiles-check

          git diff --cached --check
          git status --short
          git commit -m "fix(operator): close branch attempt review gaps"
          git push origin "HEAD:$GITHUB_REF_NAME"
