name: PR1227 materialize final reviewed fix

on:
  push:
    branches:
      - ops/pr1227-materialize-final-20260916

permissions:
  contents: write
  issues: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch, verify, validate, and stage final candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, json, lzma, os, re, tarfile, urllib.request

          comment_id = 5703881044
          url = f'https://api.github.com/repos/heimgewebe/grabowski/issues/comments/{comment_id}'
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'User-Agent': 'pr1227-final-materializer',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          if payload.get('id') != comment_id:
              raise SystemExit('comment identity mismatch')
          if payload.get('user', {}).get('login') != 'chatgpt-codex-connector[bot]':
              raise SystemExit('comment author mismatch')
          body = payload.get('body')
          if not isinstance(body, str):
              raise SystemExit('comment body missing')

          required_metadata = {
              'WRITER=faeca0cd4e2e03821c4bd9d56231aebba81417e5',
              'FILE=tools/repobrief_agent_benchmark_codex_runner.py BYTES=88993 SHA256=a47016b7d18377247e32acdb27e4022ba54c826728d06d7ba815b212e205f7e3',
              'FILE=tests/test_repobrief_agent_benchmark_codex_runner.py BYTES=66227 SHA256=3147f4e8ddf834166481a1eb8a2a7d76d46d56af65b1ef863c438710036542c7',
              'XZ_BYTES=27804 XZ_SHA256=bc7f8e00ce9e9a695f8e2302c8721574b06fc03b1af497544884dcfb0d358549',
          }
          lines = body.splitlines()
          if not required_metadata.issubset(set(lines)):
              raise SystemExit('writer metadata mismatch')

          chunks = {}
          total = None
          pattern = re.compile(r'^XZ_CHUNK_(\d{2})_OF_(\d{2})=([A-Za-z0-9+/=]+)$')
          for line in lines:
              match = pattern.fullmatch(line)
              if not match:
                  continue
              index = int(match.group(1))
              declared_total = int(match.group(2))
              if total is None:
                  total = declared_total
              elif total != declared_total:
                  raise SystemExit('inconsistent chunk total')
              if index in chunks:
                  raise SystemExit('duplicate chunk')
              chunks[index] = match.group(3)

          if total != 13 or sorted(chunks) != list(range(1, 14)):
              raise SystemExit('transport chunk set mismatch')
          for index in range(1, 13):
              if len(chunks[index]) != 3000:
                  raise SystemExit(f'chunk length mismatch: {index}')
          if len(chunks[13]) != 1072:
              raise SystemExit('final chunk length mismatch')

          encoded = ''.join(chunks[index] for index in range(1, 14))
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != 27804:
              raise SystemExit('XZ byte count mismatch')
          if hashlib.sha256(archive).hexdigest() != 'bc7f8e00ce9e9a695f8e2302c8721574b06fc03b1af497544884dcfb0d358549':
              raise SystemExit('XZ SHA-256 mismatch')

          raw = lzma.decompress(archive, format=lzma.FORMAT_XZ)
          expected = {
              'tools/repobrief_agent_benchmark_codex_runner.py': (88993, 'a47016b7d18377247e32acdb27e4022ba54c826728d06d7ba815b212e205f7e3'),
              'tests/test_repobrief_agent_benchmark_codex_runner.py': (66227, '3147f4e8ddf834166481a1eb8a2a7d76d46d56af65b1ef863c438710036542c7'),
          }
          out = Path('/tmp/pr1227-final-materialized')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as tf:
              members = tf.getmembers()
              if [member.name for member in members] != list(expected):
                  raise SystemExit('archive member set/order mismatch')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit('archive member type mismatch')
                  handle = tf.extractfile(member)
                  if handle is None:
                      raise SystemExit('archive member unreadable')
                  data = handle.read()
                  size, digest = expected[member.name]
                  if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                      raise SystemExit(f'file binding mismatch: {member.name}')
                  target = out / member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          PY

          expected_head=df879979911bb953b27e37b7256ca701fc1de879
          live_head="$(git ls-remote origin refs/heads/fix/rab-codex-stderr-contract-20260915 | cut -f1)"
          test "$live_head" = "$expected_head"

          git worktree add --detach /tmp/pr1227-final "$expected_head"
          cp /tmp/pr1227-final-materialized/tools/repobrief_agent_benchmark_codex_runner.py /tmp/pr1227-final/tools/repobrief_agent_benchmark_codex_runner.py
          cp /tmp/pr1227-final-materialized/tests/test_repobrief_agent_benchmark_codex_runner.py /tmp/pr1227-final/tests/test_repobrief_agent_benchmark_codex_runner.py
          cd /tmp/pr1227-final

          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner
          git diff --check
          python3 tools/check_no_secrets.py
          python3 -m py_compile tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py

          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.actual
          printf '%s\n' tests/test_repobrief_agent_benchmark_codex_runner.py tools/repobrief_agent_benchmark_codex_runner.py > /tmp/changed.expected
          diff -u /tmp/changed.expected /tmp/changed.actual

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/test_repobrief_agent_benchmark_codex_runner.py tools/repobrief_agent_benchmark_codex_runner.py
          git diff --cached --check
          git commit -m 'fix(pr1227): close JSON-RPC identity review gaps'
          test "$(git rev-parse HEAD^)" = "$expected_head"
          git push origin HEAD:refs/heads/ops/pr1227-ready-final-20260916
