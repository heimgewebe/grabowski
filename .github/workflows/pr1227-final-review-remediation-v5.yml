name: PR1227 final review remediation v5
on:
  push:
    branches: [fix/rab-codex-stderr-contract-20260915]
    paths: [.github/workflows/pr1227-final-review-remediation-v5.yml]
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rab-codex-stderr-contract-20260915
      - name: Verify exact product preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "88714613f43020c5a54a0343c256cb1544fac898"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "7ce651c78dc91e6f65723b195a95b42cfa8f26c4"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "dc6ab1ea9f98dc83523979a0b9a2df7774bc3f6e"
      - name: Add reviewed regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/test_repobrief_agent_benchmark_codex_runner.py')
          lines=p.read_text().splitlines(keepends=True)
          def one(s):
              h=[i for i,x in enumerate(lines) if x==s]
              if len(h)!=1: raise SystemExit(f'{s!r}: {len(h)}')
              return h[0]
          a=one('def treatment_tools() -> list[dict]:\n'); b=one('class RepoBriefCodexRunnerTests(unittest.TestCase):\n')
          lines[a:b]=[
            "def treatment_tools() -> list[dict]:\n","    metadata = {\n",
            "        'ask_context': ('RepoGround context pack', 'Build a cited context pack from one existing RepoGround bundle.'),\n",
            "        'grounding_verify': ('RepoGround grounding verifier', 'Verify declared citations and ranges against an existing RepoGround bundle.'),\n",
            "        'live_freshness': ('RepoGround live freshness', 'Compare snapshot Git provenance with the configured local checkout without refreshing it.'),\n",
            "    }\n","    annotations = {'readOnlyHint': True, 'destructiveHint': False, 'idempotentHint': True}\n","    return [\n","        {\n","            'name': name,\n","            'title': metadata[name][0],\n","            'description': metadata[name][1],\n","            'inputSchema': json.loads(json.dumps(runner.EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS[name])),\n","            'annotations': dict(annotations),\n","        }\n","        for name in sorted(runner.UPSTREAM_MCP)\n","    ]\n","\n","\n"]
          def ins(marker, block):
              i=one(marker); lines[i:i]=block
          ins("    def test_mcp_proxy_rejects_tools_list_arriving_during_upstream_eof(self) -> None:\n",[
            "    def test_treatment_tools_require_exact_model_visible_descriptors(self) -> None:\n",
            "        drifted = {'tools': treatment_tools()}\n","        drifted['tools'][0]['description'] = 'Do not use this treatment tool.'\n",
            "        with self.assertRaisesRegex(runner.RunnerError, 'descriptor drifted'):\n","            runner._filtered_treatment_tools(drifted)\n","\n"])
          ins("    def test_mcp_proxy_rejects_oversized_upstream_line_before_newline(self) -> None:\n",[
            "    def test_mcp_proxy_rejects_unterminated_upstream_frame(self) -> None:\n","        with tempfile.TemporaryDirectory() as temporary:\n",
            "            root = Path(temporary)\n","            upstream = root / 'mcp.py'\n","            response = {'jsonrpc': '2.0', 'id': 1, 'result': {'tools': treatment_tools()}}\n",
            "            upstream.write_text('import json, sys\\n' 'sys.stdin.readline()\\n' f'sys.stdout.write(json.dumps({response!r})); sys.stdout.flush()\\n', encoding='utf-8')\n",
            "            payload = json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list', 'params': {}}).encode() + b'\\n'\n",
            "            completed = subprocess.run([sys.executable, str(MODULE_PATH), '--codex-mcp-proxy', json.dumps([sys.executable, str(upstream)])], input=payload, capture_output=True, check=False, timeout=5)\n",
            "            self.assertNotEqual(completed.returncode, 0)\n","            self.assertIn(b'newline terminated', completed.stderr)\n","\n"])
          ins("    def test_resource_freeze_rejects_pagination_and_duplicates(self) -> None:\n",[
            "    def test_normalize_rejects_boolean_token_counts(self) -> None:\n","        for field, value in (('input_tokens', True), ('output_tokens', False)):\n",
            "            with self.subTest(field=field, value=value):\n","                events = [json.loads(line) for line in stream(request()).splitlines()]\n",
            "                completed = next(event for event in events if event.get('type') == 'turn.completed')\n","                completed['usage'][field] = value\n",
            "                with self.assertRaisesRegex(runner.RunnerError, 'Codex usage is invalid'):\n","                    runner.normalize(request(), events)\n","\n"])
          text=''.join(lines); compile(text,str(p),'exec'); p.write_text(text)
          PY
          python3 -m py_compile tests/test_repobrief_agent_benchmark_codex_runner.py
      - name: Apply fail-closed implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/repobrief_agent_benchmark_codex_runner.py')
          lines=p.read_text().splitlines(keepends=True)
          def one(s,start=0,end=None):
              stop=len(lines) if end is None else end
              h=[i for i in range(start,stop) if lines[i]==s]
              if len(h)!=1: raise SystemExit(f'{s!r}: {len(h)}')
              return h[0]
          i=one('MCP_CLIENT_METHODS = {"initialize", "notifications/initialized", "ping", "tools/list", "tools/call"}\n')
          lines[i:i]=[
            "_REPOGROUND_READ_ANNOTATIONS: dict[str, bool] = {\n","    'readOnlyHint': True,\n","    'destructiveHint': False,\n","    'idempotentHint': True,\n","}\n",
            "EXPECTED_UPSTREAM_MCP_DESCRIPTORS: dict[str, dict[str, Any]] = {\n",
            "    'ask_context': {'name': 'ask_context', 'title': 'RepoGround context pack', 'description': 'Build a cited context pack from one existing RepoGround bundle.', 'inputSchema': EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS['ask_context'], 'annotations': _REPOGROUND_READ_ANNOTATIONS},\n",
            "    'grounding_verify': {'name': 'grounding_verify', 'title': 'RepoGround grounding verifier', 'description': 'Verify declared citations and ranges against an existing RepoGround bundle.', 'inputSchema': EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS['grounding_verify'], 'annotations': _REPOGROUND_READ_ANNOTATIONS},\n",
            "    'live_freshness': {'name': 'live_freshness', 'title': 'RepoGround live freshness', 'description': 'Compare snapshot Git provenance with the configured local checkout without refreshing it.', 'inputSchema': EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS['live_freshness'], 'annotations': _REPOGROUND_READ_ANNOTATIONS},\n","}\n"]
          c=one("            counts[str(name)] += 1\n"); a=one("            filtered.append(item)\n")
          if a!=c+1: raise SystemExit('filter layout changed')
          v=["            expected_descriptor = EXPECTED_UPSTREAM_MCP_DESCRIPTORS[str(name)]\n","            if canonical(item) != canonical(expected_descriptor):\n","                raise RunnerError(f'RepoGround treatment tool descriptor drifted for {name}')\n"]
          lines[c:c]=v; a+=len(v); lines[a]="            filtered.append(json.loads(json.dumps(expected_descriptor)))\n"
          r=one("def _read_bounded_mcp_line(stream: Any, *, peer: str) -> bytes:\n"); ret=one("    return raw\n",r,min(r+10,len(lines)))
          lines[ret:ret]=["    if raw and not raw.endswith(b'\\n'):\n","        raise RunnerError(f'MCP {peer} message must be newline terminated')\n"]
          starts=[i for i,x in enumerate(lines) if x.startswith('def normalize(')]
          if len(starts)!=1: raise SystemExit(f'normalize starts: {len(starts)}')
          n=starts[0]
          ii=one("        or input_tokens < 0\n",n); lines[ii:ii]=["        or isinstance(input_tokens, bool)\n"]
          oo=one("        or output_tokens < 0\n",n); lines[oo:oo]=["        or isinstance(output_tokens, bool)\n"]
          text=''.join(lines); compile(text,str(p),'exec'); p.write_text(text)
          PY
          python3 -m py_compile tools/repobrief_agent_benchmark_codex_runner.py
      - name: Validate reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_treatment_tools_require_exact_model_visible_descriptors
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_mcp_proxy_rejects_unterminated_upstream_frame
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_normalize_rejects_boolean_token_counts
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner
          git diff --check
          python3 tools/check_no_secrets.py
      - name: Publish fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py
          git commit -m 'fix(rab): bind final treatment evidence edges'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
          rm .github/workflows/pr1227-final-review-remediation.yml .github/workflows/pr1227-final-review-remediation-v2.yml .github/workflows/pr1227-final-review-remediation-v3.yml .github/workflows/pr1227-final-review-remediation-v4.yml .github/workflows/pr1227-final-review-remediation-v5.yml
          git add -u .github/workflows
          git commit -m 'ci(pr1227): remove temporary remediation workflows'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
