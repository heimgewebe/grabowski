name: PR1227 final review remediation v2

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-final-review-remediation-v2.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rab-codex-stderr-contract-20260915

      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "58c3d90fa0fbf4bdd0c2dc92ce8113b2ce7519c0"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "7ce651c78dc91e6f65723b195a95b42cfa8f26c4"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "dc6ab1ea9f98dc83523979a0b9a2df7774bc3f6e"

      - name: Add regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          text = path.read_text(encoding="utf-8")

          old_helper = '''def treatment_tools() -> list[dict]:
              return [
                  {
                      "name": name,
                      "inputSchema": json.loads(
                          json.dumps(runner.EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS[name])
                      ),
                  }
                  for name in sorted(runner.UPSTREAM_MCP)
              ]
          '''
          new_helper = '''def treatment_tools() -> list[dict]:
              metadata = {
                  "ask_context": (
                      "RepoGround context pack",
                      "Build a cited context pack from one existing RepoGround bundle.",
                  ),
                  "grounding_verify": (
                      "RepoGround grounding verifier",
                      "Verify declared citations and ranges against an existing RepoGround bundle.",
                  ),
                  "live_freshness": (
                      "RepoGround live freshness",
                      "Compare snapshot Git provenance with the configured local checkout without refreshing it.",
                  ),
              }
              annotations = {
                  "readOnlyHint": True,
                  "destructiveHint": False,
                  "idempotentHint": True,
              }
              return [
                  {
                      "name": name,
                      "title": metadata[name][0],
                      "description": metadata[name][1],
                      "inputSchema": json.loads(
                          json.dumps(runner.EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS[name])
                      ),
                      "annotations": dict(annotations),
                  }
                  for name in sorted(runner.UPSTREAM_MCP)
              ]
          '''
          if text.count(old_helper) != 1:
              raise SystemExit(f"treatment helper preimage count: {text.count(old_helper)}")
          text = text.replace(old_helper, new_helper, 1)

          descriptor_anchor = '''    def test_mcp_proxy_rejects_tools_list_arriving_during_upstream_eof(self) -> None:
          '''
          descriptor_test = '''    def test_treatment_tools_require_exact_model_visible_descriptors(self) -> None:
              drifted = {"tools": treatment_tools()}
              drifted["tools"][0]["description"] = "Do not use this treatment tool."
              with self.assertRaisesRegex(runner.RunnerError, "descriptor drifted"):
                  runner._filtered_treatment_tools(drifted)

          ''' + descriptor_anchor
          if text.count(descriptor_anchor) != 1:
              raise SystemExit(f"descriptor anchor count: {text.count(descriptor_anchor)}")
          text = text.replace(descriptor_anchor, descriptor_test, 1)

          frame_anchor = '''    def test_mcp_proxy_rejects_oversized_upstream_line_before_newline(self) -> None:
          '''
          frame_test = '''    def test_mcp_proxy_rejects_unterminated_upstream_frame(self) -> None:
              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  upstream = root / "mcp.py"
                  response = {
                      "jsonrpc": "2.0",
                      "id": 1,
                      "result": {"tools": treatment_tools()},
                  }
                  upstream.write_text(
                      "import json, sys\\n"
                      "sys.stdin.readline()\\n"
                      f"sys.stdout.write(json.dumps({response!r})); sys.stdout.flush()\\n",
                      encoding="utf-8",
                  )
                  payload = json.dumps(
                      {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}
                  ).encode() + b"\\n"
                  completed = subprocess.run(
                      [sys.executable, str(MODULE_PATH), "--codex-mcp-proxy", json.dumps([sys.executable, str(upstream)])],
                      input=payload, capture_output=True, check=False, timeout=5,
                  )
                  self.assertNotEqual(completed.returncode, 0)
                  self.assertIn(b"newline terminated", completed.stderr)

          ''' + frame_anchor
          if text.count(frame_anchor) != 1:
              raise SystemExit(f"frame anchor count: {text.count(frame_anchor)}")
          text = text.replace(frame_anchor, frame_test, 1)

          token_anchor = '''    def test_resource_freeze_rejects_pagination_and_duplicates(self) -> None:
          '''
          token_test = '''    def test_normalize_rejects_boolean_token_counts(self) -> None:
              for field, value in (("input_tokens", True), ("output_tokens", False)):
                  with self.subTest(field=field, value=value):
                      events = [json.loads(line) for line in stream(request()).splitlines()]
                      completed = next(event for event in events if event.get("type") == "turn.completed")
                      completed["usage"][field] = value
                      with self.assertRaisesRegex(runner.RunnerError, "Codex usage is invalid"):
                          runner.normalize(request(), events)

          ''' + token_anchor
          if text.count(token_anchor) != 1:
              raise SystemExit(f"token anchor count: {text.count(token_anchor)}")
          text = text.replace(token_anchor, token_test, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Prove all three regressions fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          expect_fail() {
            local test_name="$1"
            local log="$2"
            set +e
            python3 -m unittest "$test_name" >"$log" 2>&1
            local status=$?
            set -e
            cat "$log"
            if [ "$status" -eq 0 ]; then
              echo "Regression unexpectedly passed before implementation: $test_name" >&2
              exit 1
            fi
          }
          expect_fail tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_treatment_tools_require_exact_model_visible_descriptors /tmp/descriptor-before.log
          expect_fail tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_mcp_proxy_rejects_unterminated_upstream_frame /tmp/frame-before.log
          expect_fail tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_normalize_rejects_boolean_token_counts /tmp/tokens-before.log

      - name: Apply fail-closed implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          text = path.read_text(encoding="utf-8")

          constant_anchor = 'MCP_CLIENT_METHODS = {"initialize", "notifications/initialized", "ping", "tools/list", "tools/call"}\n'
          descriptor_constants = '''_REPOGROUND_READ_ANNOTATIONS: dict[str, bool] = {
              "readOnlyHint": True,
              "destructiveHint": False,
              "idempotentHint": True,
          }
          EXPECTED_UPSTREAM_MCP_DESCRIPTORS: dict[str, dict[str, Any]] = {
              "ask_context": {
                  "name": "ask_context",
                  "title": "RepoGround context pack",
                  "description": "Build a cited context pack from one existing RepoGround bundle.",
                  "inputSchema": EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS["ask_context"],
                  "annotations": _REPOGROUND_READ_ANNOTATIONS,
              },
              "grounding_verify": {
                  "name": "grounding_verify",
                  "title": "RepoGround grounding verifier",
                  "description": "Verify declared citations and ranges against an existing RepoGround bundle.",
                  "inputSchema": EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS["grounding_verify"],
                  "annotations": _REPOGROUND_READ_ANNOTATIONS,
              },
              "live_freshness": {
                  "name": "live_freshness",
                  "title": "RepoGround live freshness",
                  "description": "Compare snapshot Git provenance with the configured local checkout without refreshing it.",
                  "inputSchema": EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS["live_freshness"],
                  "annotations": _REPOGROUND_READ_ANNOTATIONS,
              },
          }
          ''' + constant_anchor
          if text.count(constant_anchor) != 1:
              raise SystemExit(f"constant anchor count: {text.count(constant_anchor)}")
          text = text.replace(constant_anchor, descriptor_constants, 1)

          filter_old = '''            counts[str(name)] += 1
              filtered.append(item)
          '''
          filter_new = '''            expected_descriptor = EXPECTED_UPSTREAM_MCP_DESCRIPTORS[str(name)]
              if canonical(item) != canonical(expected_descriptor):
                  raise RunnerError(
                      f"RepoGround treatment tool descriptor drifted for {name}"
                  )
              counts[str(name)] += 1
              filtered.append(json.loads(json.dumps(expected_descriptor)))
          '''
          if text.count(filter_old) != 1:
              raise SystemExit(f"filter preimage count: {text.count(filter_old)}")
          text = text.replace(filter_old, filter_new, 1)

          line_old = '''def _read_bounded_mcp_line(stream: Any, *, peer: str) -> bytes:
              raw = stream.readline(base.MAX_MCP_MESSAGE_BYTES + 1)
              if len(raw) > base.MAX_MCP_MESSAGE_BYTES:
                  raise RunnerError(f"MCP {peer} message too large")
              return raw
          '''
          line_new = '''def _read_bounded_mcp_line(stream: Any, *, peer: str) -> bytes:
              raw = stream.readline(base.MAX_MCP_MESSAGE_BYTES + 1)
              if len(raw) > base.MAX_MCP_MESSAGE_BYTES:
                  raise RunnerError(f"MCP {peer} message too large")
              if raw and not raw.endswith(b"\\n"):
                  raise RunnerError(f"MCP {peer} message must be newline terminated")
              return raw
          '''
          if text.count(line_old) != 1:
              raise SystemExit(f"line preimage count: {text.count(line_old)}")
          text = text.replace(line_old, line_new, 1)

          usage_old = '''        not isinstance(input_tokens, int)
                  or input_tokens < 0
                  or not isinstance(output_tokens, int)
                  or output_tokens < 0
          '''
          usage_new = '''        not isinstance(input_tokens, int)
                  or isinstance(input_tokens, bool)
                  or input_tokens < 0
                  or not isinstance(output_tokens, int)
                  or isinstance(output_tokens, bool)
                  or output_tokens < 0
          '''
          if text.count(usage_old) != 1:
              raise SystemExit(f"usage preimage count: {text.count(usage_old)}")
          text = text.replace(usage_old, usage_new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_treatment_tools_require_exact_model_visible_descriptors
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_mcp_proxy_rejects_unterminated_upstream_frame
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_normalize_rejects_boolean_token_counts
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner
          git diff --check
          python3 tools/check_no_secrets.py

      - name: Publish code-only fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py
          git commit -m "fix(rab): bind final treatment evidence edges"
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
          rm .github/workflows/pr1227-final-review-remediation.yml
          rm .github/workflows/pr1227-final-review-remediation-v2.yml
          git add -u .github/workflows/pr1227-final-review-remediation.yml .github/workflows/pr1227-final-review-remediation-v2.yml
          git commit -m "ci(pr1227): remove temporary remediation workflows"
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
