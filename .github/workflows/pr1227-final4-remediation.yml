name: PR 1227 final remediation retry

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-final4-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "68f2545e77062f595689dcba4154b16bc7486cce"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "b62e6a52253057dd3cce9317cba67672e62544ac"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "2781c8f6ca2a3dce0a71cde5bccabac58ae1989b"
      - name: Apply fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          tests_path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one preimage, found {count}")
              return text.replace(old, new, 1)

          helper_anchor = '\n\ndef run_bounded(\n'
          helper = '''

          def _direct_child_pids() -> set[int]:
              """Return this process' direct Linux children for descendant containment."""
              path = Path(f"/proc/self/task/{os.getpid()}/children")
              try:
                  payload = path.read_text(encoding="ascii").strip()
              except (OSError, UnicodeError) as exc:
                  raise RunnerError("provider containment cannot enumerate child processes") from exc
              if not payload:
                  return set()
              try:
                  return {int(value) for value in payload.split()}
              except ValueError as exc:
                  raise RunnerError("provider containment received invalid child process data") from exc


          def run_bounded(
          '''
          runner = replace_once(runner, helper_anchor, helper, "direct child helper")

          runner = replace_once(
              runner,
              '    _enable_child_subreaper()\n\n    try:\n        process = subprocess.Popen(\n',
              '    _enable_child_subreaper()\n    baseline_children = _direct_child_pids()\n\n    try:\n        process = subprocess.Popen(\n',
              "snapshot baseline children",
          )

          start_marker = '    def reap_process_group_children() -> None:\n'
          end_marker = '    def store(label: str, chunk: bytes) -> None:\n'
          start = runner.find(start_marker)
          end = runner.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("detached descendant containment: markers not found in order")
          cleanup = '''    def adopted_provider_children() -> set[int]:
              try:
                  return _direct_child_pids() - baseline_children
              except RunnerError:
                  note_error("provider_child_scan_failed")
                  return set()

              def kill_adopted_children(children: set[int]) -> None:
                  for child_pid in sorted(children):
                      try:
                          os.kill(child_pid, signal.SIGKILL)
                      except ProcessLookupError:
                          continue
                      except OSError as exc:
                          note_error(f"adopted_child_kill_failed:{type(exc).__name__}")

              def reap_adopted_children(children: set[int]) -> None:
                  for child_pid in sorted(children):
                      try:
                          os.waitpid(child_pid, os.WNOHANG)
                      except ChildProcessError:
                          continue
                      except OSError as exc:
                          note_error(f"adopted_child_reap_failed:{type(exc).__name__}")

              def contain_surviving_process_group() -> None:
                  group_present = process_group_exists()
                  adopted = adopted_provider_children()
                  if not group_present and not adopted:
                      return
                  if group_present:
                      note_error("process_group_survived_provider_exit")
                      kill_process_tree()
                  if adopted:
                      note_error("adopted_descendant_survived_provider_exit")
                      kill_adopted_children(adopted)
                  cleanup_deadline = time.monotonic() + 1.0
                  while time.monotonic() < cleanup_deadline:
                      adopted = adopted_provider_children()
                      if adopted:
                          kill_adopted_children(adopted)
                          reap_adopted_children(adopted)
                      group_present = process_group_exists()
                      adopted = adopted_provider_children()
                      if not group_present and not adopted:
                          return
                      if group_present:
                          kill_process_tree()
                      time.sleep(0.01)
                  adopted = adopted_provider_children()
                  if adopted:
                      kill_adopted_children(adopted)
                      reap_adopted_children(adopted)
                  if process_group_exists() or adopted_provider_children():
                      note_error("process_group_cleanup_failed")

          '''
          runner = runner[:start] + cleanup + runner[end:]

          runner = replace_once(
              runner,
              '        lexer = shlex.shlex(text.strip(), posix=True, punctuation_chars=";&|<>")\n        lexer.whitespace_split = True\n',
              '        lexer = shlex.shlex(text.strip(), posix=True, punctuation_chars=";&|<>")\n        lexer.commenters = ""\n        lexer.whitespace_split = True\n',
              "bash-compatible hash parsing",
          )

          tests = replace_once(
              tests,
              '        self.assertEqual(runner.command_kind("rg \'foo{1,3}\' src"), "grep")\n        self.assertEqual(runner.command_kind("rg --regexp=example src"), "grep")\n',
              '        self.assertEqual(runner.command_kind("rg \'foo{1,3}\' src"), "grep")\n        self.assertEqual(runner.command_kind("rg foo#bar src"), "grep")\n        self.assertEqual(runner.command_kind("rg --regexp=example src"), "grep")\n',
              "mid-word hash positive regression",
          )
          tests = replace_once(
              tests,
              '            \'rg "$HOME" src\',\n        ):\n',
              '            \'rg "$HOME" src\',\n            "rg foo#bar | id",\n            "rg foo#bar ../outside",\n        ):\n',
              "mid-word hash bypass regressions",
          )

          detached_anchor = '    def test_run_bounded_times_out_when_provider_does_not_read_stdin(self) -> None:\n'
          detached_test = '''    def test_run_bounded_reaps_descendant_that_detaches_from_provider_group(self) -> None:
              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  child_state = root / "detached.pid"
                  script = root / "provider.py"
                  script.write_text(
                      "import os, pathlib, time\\n"
                      "child = os.fork()\\n"
                      "if child == 0:\\n"
                      "    os.setsid()\\n"
                      f"    pathlib.Path({str(child_state)!r}).write_text(str(os.getpid()))\\n"
                      "    for fd in (0, 1, 2):\\n"
                      "        try:\\n"
                      "            os.close(fd)\\n"
                      "        except OSError:\\n"
                      "            pass\\n"
                      "    time.sleep(30)\\n"
                      "    os._exit(0)\\n"
                      f"state = pathlib.Path({str(child_state)!r})\\n"
                      "while not state.exists():\\n"
                      "    time.sleep(0.01)\\n"
                      "os._exit(0)\\n",
                      encoding="utf-8",
                  )
                  capture = runner.run_bounded(
                      [sys.executable, str(script)], cwd=root, timeout_seconds=3, stdin_data=b""
                  )
                  self.assertIn("adopted_descendant_survived_provider_exit", str(capture["capture_error"]))
                  self.assertNotIn("process_group_cleanup_failed", str(capture["capture_error"]))
                  child_pid = int(child_state.read_text())
                  with self.assertRaises(ProcessLookupError):
                      os.kill(child_pid, 0)

          '''
          tests = replace_once(tests, detached_anchor, detached_test + detached_anchor, "detached descendant regression")

          runner_path.write_text(runner, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_repobrief_agent_benchmark_codex_runner.py
          git diff --check
          python3 tools/check_no_secrets.py
      - name: Publish code-only fix and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1227-final3-remediation.yml
          rm .github/workflows/pr1227-final4-remediation.yml
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py .github/workflows/pr1227-final3-remediation.yml .github/workflows/pr1227-final4-remediation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rab): close final exact-head review gaps'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
