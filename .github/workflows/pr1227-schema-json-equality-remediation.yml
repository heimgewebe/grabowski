name: PR1227 type-sensitive schema remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-schema-json-equality-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rab-codex-stderr-contract-20260915

      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8c70d612bf685d74c443e52085d54207a3121115"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "ad308e00727f331f358d251a9f28d05767b096bd"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "9287a54472b0305dc963f17e4cd34d490dd22def"

      - name: Add regression and prove old comparison fails
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          text = path.read_text(encoding="utf-8")
          old = '''        drifted_schema = {"tools": treatment_tools()}
                  drifted_schema["tools"][0]["inputSchema"]["additionalProperties"] = True
                  with self.assertRaisesRegex(runner.RunnerError, "inputSchema drifted"):
                      runner._filtered_treatment_tools(drifted_schema)
          '''
          new = old + '''
                  type_confused_schema = {"tools": treatment_tools()}
                  ask_context = next(
                      item for item in type_confused_schema["tools"]
                      if item["name"] == "ask_context"
                  )
                  ask_context["inputSchema"]["properties"]["max_context_tokens"]["minimum"] = True
                  with self.assertRaisesRegex(runner.RunnerError, "inputSchema drifted"):
                      runner._filtered_treatment_tools(type_confused_schema)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"test preimage count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          set +e
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_treatment_tools_require_exact_upstream_input_schemas >/tmp/pr1227-before.log 2>&1
          status=$?
          set -e
          cat /tmp/pr1227-before.log
          if [ "$status" -eq 0 ]; then
            echo "Regression unexpectedly passed before the implementation fix" >&2
            exit 1
          fi

      - name: Apply type-sensitive JSON schema comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          text = path.read_text(encoding="utf-8")
          old = '            if item.get("inputSchema") != expected_schema:\n'
          new = '            if canonical(item.get("inputSchema")) != canonical(expected_schema):\n'
          if text.count(old) != 1:
              raise SystemExit(f"runner preimage count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_treatment_tools_require_exact_upstream_input_schemas
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner
          git diff --check
          python3 tools/check_no_secrets.py

      - name: Publish code-only fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py
          git commit -m "fix(rab): compare treatment schemas type-sensitively"
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
          rm .github/workflows/pr1227-schema-json-equality-remediation.yml
          git add -u .github/workflows/pr1227-schema-json-equality-remediation.yml
          git commit -m "ci(pr1227): remove temporary remediation workflow"
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
