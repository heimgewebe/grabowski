name: PR 1186 review remediation writer

on:
  push:
    branches:
      - fix/terminal-lane-retention-archive-20260913
    paths:
      - tools/pr1186_review_remediation.py
      - .github/workflows/pr1186-review-remediation-writer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1186-review-remediation-writer
  cancel-in-progress: false

jobs:
  writer:
    if: github.repository == 'heimgewebe/grabowski'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/terminal-lane-retention-archive-20260913
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Assert expected parent
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/terminal-lane-retention-archive-20260913"
          test -f tools/pr1186_review_remediation.py
          python -m py_compile tools/pr1186_review_remediation.py

      - name: Scope patch anchors
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/pr1186_review_remediation.py')
          text = path.read_text(encoding='utf-8')
          fixes = {
              'replace_once(CHECKOUTS, archive_sig_old, archive_sig_new)': '''archive_source = Path(CHECKOUTS).read_text(encoding="utf-8")
          archive_start_at = archive_source.index('@mcp.tool(name="grabowski_checkout_archive", annotations=MUTATING)')
          archive_end_at = archive_source.index('@mcp.tool(name="grabowski_checkout_cleanup", annotations=MUTATING)', archive_start_at)
          archive_block = archive_source[archive_start_at:archive_end_at]
          if archive_block.count(archive_sig_old) != 1:
              raise SystemExit("archive signature marker is not unique inside archive function")
          archive_block = archive_block.replace(archive_sig_old, archive_sig_new, 1)
          Path(CHECKOUTS).write_text(
              archive_source[:archive_start_at] + archive_block + archive_source[archive_end_at:],
              encoding="utf-8",
          )''',
              'replace_once(CHECKOUTS, archive_fence_init_old, archive_fence_init_new)': '''archive_source = Path(CHECKOUTS).read_text(encoding="utf-8")
          archive_start_at = archive_source.index('@mcp.tool(name="grabowski_checkout_archive", annotations=MUTATING)')
          archive_end_at = archive_source.index('@mcp.tool(name="grabowski_checkout_cleanup", annotations=MUTATING)', archive_start_at)
          archive_block = archive_source[archive_start_at:archive_end_at]
          if archive_block.count(archive_fence_init_old) != 1:
              raise SystemExit("archive fence-init marker is not unique inside archive function")
          archive_block = archive_block.replace(archive_fence_init_old, archive_fence_init_new, 1)
          Path(CHECKOUTS).write_text(
              archive_source[:archive_start_at] + archive_block + archive_source[archive_end_at:],
              encoding="utf-8",
          )''',
          }
          for old, new in fixes.items():
              if text.count(old) != 1:
                  raise SystemExit(f'archive script hotfix marker count={text.count(old)} for {old}')
              text = text.replace(old, new, 1)

          cleanup_marker = 'replace_once(CHECKOUTS, cleanup_release_before_audit,'
          if text.count(cleanup_marker) != 1:
              raise SystemExit(f'cleanup release hotfix marker count={text.count(cleanup_marker)}')
          cleanup_start = text.index(cleanup_marker)
          cleanup_end = text.index('\n\ncleanup_return_old =', cleanup_start)
          cleanup_replacement = '''cleanup_source = Path(CHECKOUTS).read_text(encoding="utf-8")
          cleanup_start_at = cleanup_source.index('@mcp.tool(name="grabowski_checkout_cleanup", annotations=MUTATING)')
          cleanup_block = cleanup_source[cleanup_start_at:]
          if cleanup_block.count(cleanup_release_before_audit) != 1:
              raise SystemExit("cleanup release marker is not unique inside cleanup function")
          cleanup_block = cleanup_block.replace(cleanup_release_before_audit, "    audit = {\\n", 1)
          Path(CHECKOUTS).write_text(
              cleanup_source[:cleanup_start_at] + cleanup_block,
              encoding="utf-8",
          )'''
          text = text[:cleanup_start] + cleanup_replacement + text[cleanup_end:]
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/pr1186_review_remediation.py

      - name: Apply bounded remediation
        run: |
          set -euo pipefail
          python tools/pr1186_review_remediation.py
          git diff --check

      - name: Refresh generated operator context
        run: |
          set -euo pipefail
          make context-refresh
          make profiles-refresh
          git diff --check

      - name: Focused regression tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_checkouts.py' -v
          python -m unittest discover -s tests -p 'test_agent_workspace.py' -v

      - name: Full repository validation
        run: make validate

      - name: Commit exact validated result
        run: |
          set -euo pipefail
          git config user.name 'grabowski-review-remediation'
          git config user.email 'grabowski-review-remediation@users.noreply.github.com'
          git add src/grabowski_checkouts.py src/grabowski_agent_workspace.py tests/test_checkouts.py generated tools/pr1186_review_remediation.py .github/workflows/pr1186-review-remediation-writer.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No remediation diff produced' >&2
            exit 1
          fi
          git commit -m 'fix(lifecycle): durably fence ambiguous checkout effects'
          git push origin HEAD:fix/terminal-lane-retention-archive-20260913
