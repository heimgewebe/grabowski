name: PR 1186 review remediation writer

on:
  push:
    branches:
      - fix/terminal-lane-retention-archive-20260913
    paths:
      - tools/pr1186_review_remediation_driver.py
      - .github/workflows/pr1186-review-remediation-writer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1186-review-remediation-writer
  cancel-in-progress: false

jobs:
  writer:
    if: github.repository == 'heimgewebe/grabowski'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/terminal-lane-retention-archive-20260913
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply deterministic remediation
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/terminal-lane-retention-archive-20260913"
          python -m py_compile tools/pr1186_review_remediation.py tools/pr1186_review_remediation_driver.py
          python tools/pr1186_review_remediation_driver.py
          git diff --check

      - name: Refresh generated contracts
        run: |
          set -euo pipefail
          make context-refresh
          make profiles-refresh
          git diff --check

      - name: Remove temporary remediation machinery
        run: |
          set -euo pipefail
          rm -f tools/pr1186_review_remediation.py
          rm -f tools/pr1186_review_remediation_driver.py
          rm -f .github/workflows/pr1186-review-remediation-writer.yml
          git diff --check

      - name: Focused regression tests
        run: |
          set -euo pipefail
          python -m py_compile src/grabowski_checkouts.py src/grabowski_agent_workspace.py tests/test_checkouts.py src/grabowski_capabilities.py
          install -d -m 700 "$(pwd)/build"
          test_home="$(mktemp -d "$(pwd)/build/pr1186-test-home.XXXXXX")"
          trap 'rm -rf "$test_home"' EXIT
          install -d -m 700 "$test_home/.config/grabowski"
          install -m 600 config/access.home-wide-operator.example.json "$test_home/.config/grabowski/access.json"
          HOME="$test_home" python -m unittest discover -s tests -p 'test_checkouts.py' -v
          HOME="$test_home" python -m unittest discover -s tests -p 'test_agent_workspace.py' -v

      - name: Full repository validation
        run: make validate

      - name: Commit exact validated result
        run: |
          set -euo pipefail
          git config user.name 'grabowski-review-remediation'
          git config user.email 'grabowski-review-remediation@users.noreply.github.com'
          git status --short
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No remediation diff produced' >&2
            exit 1
          fi
          git commit -m 'fix(lifecycle): durably fence ambiguous checkout effects'
          git push origin HEAD:fix/terminal-lane-retention-archive-20260913

# trigger: exact remediation run
