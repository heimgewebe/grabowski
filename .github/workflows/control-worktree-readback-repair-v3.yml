name: Control checkout and readback repair v3

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/control-worktree-recreate-git-show-readback-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/control-worktree-recreate-git-show-readback-v1
          fetch-depth: 0

      - name: Apply repair with targeted orphan cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/control-worktree-readback-repair.yml')
          text = source.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          body = text.split(marker, 1)[1]
          script = dedent(body.split(end_marker, 1)[0])

          missing_helper = '''def _control_checkout_missing() -> bool:
              if not os.path.lexists(BUREAU_CONTROL_ROOT):
                  return True
              metadata = BUREAU_CONTROL_ROOT.lstat()
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise BureauLeaseContractError("control-checkout-path-occupied")
              return False
          '''
          registered_helper = missing_helper + '''
          
          def _control_worktree_registered(repository_root: Path) -> bool:
              listing = _run_control_git(
                  repository_root, ["worktree", "list", "--porcelain"]
              )
              expected = f"worktree {BUREAU_CONTROL_ROOT}"
              return any(line == expected for line in listing.splitlines())
          '''
          if script.count(missing_helper) != 1:
              raise SystemExit('missing-check helper marker mismatch')
          script = script.replace(missing_helper, registered_helper, 1)

          recreate_marker = '''    _prepare_bureau_worktree_root()
              _run_control_git(
                  repository_root,
                  [
                      "worktree",
                      "add",
          '''
          recreate_replacement = '''    _prepare_bureau_worktree_root()
              if _control_worktree_registered(repository_root):
                  _run_control_git(
                      repository_root,
                      [
                          "worktree",
                          "remove",
                          "--force",
                          "--force",
                          str(BUREAU_CONTROL_ROOT),
                      ],
                      timeout_seconds=60,
                  )
              _run_control_git(
                  repository_root,
                  [
                      "worktree",
                      "add",
          '''
          if script.count(recreate_marker) != 1:
              raise SystemExit('recreate marker mismatch')
          script = script.replace(recreate_marker, recreate_replacement, 1)
          exec(compile(script, str(source), 'exec'), {'__name__': '__main__'})
          PY

      - name: Refresh generated contracts
        run: make context-refresh

      - name: Run focused tests with source path
        run: PYTHONPATH=src python3 -m unittest tests.test_bureau_control_checkout tests.test_read_surface -v

      - name: Commit repair without bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/control-worktree-readback-repair-v2.yml \
            .github/workflows/control-worktree-readback-repair-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: recover Bureau control checkout and bind Git ref reads"
          git push origin HEAD:fix/control-worktree-recreate-git-show-readback-v1
