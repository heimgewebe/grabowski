name: PR 1227 final runner remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-final-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a8544b2f2517ffded6c67b1108e1bb9e25bce5c6"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "b20137c91ef729e4e124c0f07e6ad52c41b5e1ec"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "3d4282865c0d92694b4af4d7cb383587a6382a4c"
      - name: Apply reviewed fixes and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          tests_path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one preimage, found {count}")
              return text.replace(old, new, 1)

          runner = replace_once(
              runner,
              '''def _split_shell_words(text: str) -> list[str]:
              if "$(" in text or "`" in text:
                  raise RunnerError("command substitution is not allowed")
              try:
                  lexer = shlex.shlex(text, posix=True, punctuation_chars=";&|<>")
          ''',
              '''def _split_shell_words(text: str) -> list[str]:
              if "\\n" in text or "\\r" in text:
                  raise RunnerError("command line breaks are not allowed")
              if "$(" in text or "`" in text:
                  raise RunnerError("command substitution is not allowed")
              try:
                  lexer = shlex.shlex(text.strip(), posix=True, punctuation_chars=";&|<>")
          ''',
              "line-break command precheck",
          )
          runner = replace_once(
              runner,
              '    parts = _split_shell_words(command.strip())\n',
              '    parts = _split_shell_words(command)\n',
              "raw command handoff",
          )
          runner = replace_once(
              runner,
              '''                if remaining <= 0 and capture_error is None:
                              note_error("timeout")
                              kill_process_tree()
                              break
          ''',
              '''                if remaining <= 0:
                              note_error("timeout")
                              kill_process_tree()
                              break
          ''',
              "selector deadline",
          )
          runner = replace_once(
              runner,
              '''    if capture_error is not None:
                  kill_process_tree()
              try:
                  returncode = process.wait(timeout=5)
              except BaseException as exc:
                  note_error(f"process_wait_failed:{type(exc).__name__}")
                  kill_process_tree()
                  try:
                      process.wait(timeout=5)
                  except BaseException as followup:
                      note_error(f"process_reap_failed:{type(followup).__name__}")
                  returncode = process.returncode if isinstance(process.returncode, int) else -1
          ''',
              '''    if capture_error is not None:
                  kill_process_tree()

              if capture_error is None and process.poll() is None:
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      note_error("timeout")
                      kill_process_tree()
                  else:
                      try:
                          process.wait(timeout=remaining)
                      except subprocess.TimeoutExpired:
                          note_error("timeout")
                          kill_process_tree()
                      except BaseException as exc:
                          note_error(f"process_wait_failed:{type(exc).__name__}")
                          kill_process_tree()

              if process.poll() is None:
                  try:
                      process.wait(timeout=5)
                  except BaseException as followup:
                      note_error(f"process_reap_failed:{type(followup).__name__}")
              returncode = process.returncode if isinstance(process.returncode, int) else -1
          ''',
              "remaining wall deadline wait",
          )

          tests = replace_once(
              tests,
              'import tempfile\nimport unittest\n',
              'import tempfile\nimport time\nimport unittest\n',
              "time import",
          )
          tests = replace_once(
              tests,
              '''            "sh -lc 'cat src/example.py'",
              "bash -lc 'cat src/example.py'",
          ''',
              '''            "sh -lc 'cat src/example.py'",
              "bash -lc 'cat src/example.py'",
              "rg needle src\\ncat secret",
              "cat src/example.py\\r\\nrg needle src",
          ''',
              "line-break rejection cases",
          )
          anchor = '''    def test_run_bounded_returns_capture_error_instead_of_discarding_partial_streams(self) -> None:
          '''
          new_test = '''    def test_run_bounded_applies_wall_deadline_after_stdio_closes(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      script = root / "provider.py"
                      script.write_text(
                          "import os, time\\n"
                          "for fd in (0, 1, 2):\\n"
                          "    try:\\n"
                          "        os.close(fd)\\n"
                          "    except OSError:\\n"
                          "        pass\\n"
                          "time.sleep(5)\\n",
                          encoding="utf-8",
                      )
                      started = time.monotonic()
                      capture = runner.run_bounded(
                          [sys.executable, str(script)],
                          cwd=root,
                          timeout_seconds=1,
                          stdin_data=b"",
                      )
                      elapsed = time.monotonic() - started
                      self.assertEqual(capture["capture_error"], "timeout")
                      self.assertLess(elapsed, 3.0)

          '''
          tests = replace_once(tests, anchor, new_test + anchor, "closed-stdio deadline regression")

          runner_path.write_text(runner, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_repobrief_agent_benchmark_codex_runner.py
          git diff --check
          python3 tools/check_no_secrets.py
      - name: Publish code-only fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1227-final-remediation.yml
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py .github/workflows/pr1227-final-remediation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rab): close final Codex runner review gaps'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
