name: PR1227 final review remediation v3

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-final-review-remediation-v3.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rab-codex-stderr-contract-20260915

      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2d442a1883643d3b6e72669a93df27aca1bd619f"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "7ce651c78dc91e6f65723b195a95b42cfa8f26c4"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "dc6ab1ea9f98dc83523979a0b9a2df7774bc3f6e"

      - name: Add syntactically valid regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          def unique_index(exact: str) -> int:
              hits = [i for i, line in enumerate(lines) if line == exact]
              if len(hits) != 1:
                  raise SystemExit(f"expected one line {exact!r}, got {len(hits)}")
              return hits[0]

          helper_start = unique_index("def treatment_tools() -> list[dict]:\n")
          class_start = unique_index("class RepoBriefCodexRunnerTests(unittest.TestCase):\n")
          if helper_start >= class_start:
              raise SystemExit("helper/class ordering invalid")
          helper = [
              "def treatment_tools() -> list[dict]:\n",
              "    metadata = {\n",
              "        'ask_context': ('RepoGround context pack', 'Build a cited context pack from one existing RepoGround bundle.'),\n",
              "        'grounding_verify': ('RepoGround grounding verifier', 'Verify declared citations and ranges against an existing RepoGround bundle.'),\n",
              "        'live_freshness': ('RepoGround live freshness', 'Compare snapshot Git provenance with the configured local checkout without refreshing it.'),\n",
              "    }\n",
              "    annotations = {'readOnlyHint': True, 'destructiveHint': False, 'idempotentHint': True}\n",
              "    return [\n",
              "        {\n",
              "            'name': name,\n",
              "            'title': metadata[name][0],\n",
              "            'description': metadata[name][1],\n",
              "            'inputSchema': json.loads(json.dumps(runner.EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS[name])),\n",
              "            'annotations': dict(annotations),\n",
              "        }\n",
              "        for name in sorted(runner.UPSTREAM_MCP)\n",
              "    ]\n",
              "\n",
              "\n",
          ]
          lines[helper_start:class_start] = helper

          def insert_before(exact: str, block: list[str]) -> None:
              idx = unique_index(exact)
              lines[idx:idx] = block

          insert_before(
              "    def test_mcp_proxy_rejects_tools_list_arriving_during_upstream_eof(self) -> None:\n",
              [
                  "    def test_treatment_tools_require_exact_model_visible_descriptors(self) -> None:\n",
                  "        drifted = {'tools': treatment_tools()}\n",
                  "        drifted['tools'][0]['description'] = 'Do not use this treatment tool.'\n",
                  "        with self.assertRaisesRegex(runner.RunnerError, 'descriptor drifted'):\n",
                  "            runner._filtered_treatment_tools(drifted)\n",
                  "\n",
              ],
          )
          insert_before(
              "    def test_mcp_proxy_rejects_oversized_upstream_line_before_newline(self) -> None:\n",
              [
                  "    def test_mcp_proxy_rejects_unterminated_upstream_frame(self) -> None:\n",
                  "        with tempfile.TemporaryDirectory() as temporary:\n",
                  "            root = Path(temporary)\n",
                  "            upstream = root / 'mcp.py'\n",
                  "            response = {'jsonrpc': '2.0', 'id': 1, 'result': {'tools': treatment_tools()}}\n",
                  "            upstream.write_text(\n",
                  "                'import json, sys\\n'\n",
                  "                'sys.stdin.readline()\\n'\n",
                  "                f'sys.stdout.write(json.dumps({response!r})); sys.stdout.flush()\\n',\n",
                  "                encoding='utf-8',\n",
                  "            )\n",
                  "            payload = json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list', 'params': {}}).encode() + b'\\n'\n",
                  "            completed = subprocess.run(\n",
                  "                [sys.executable, str(MODULE_PATH), '--codex-mcp-proxy', json.dumps([sys.executable, str(upstream)])],\n",
                  "                input=payload, capture_output=True, check=False, timeout=5,\n",
                  "            )\n",
                  "            self.assertNotEqual(completed.returncode, 0)\n",
                  "            self.assertIn(b'newline terminated', completed.stderr)\n",
                  "\n",
              ],
          )
          insert_before(
              "    def test_resource_freeze_rejects_pagination_and_duplicates(self) -> None:\n",
              [
                  "    def test_normalize_rejects_boolean_token_counts(self) -> None:\n",
                  "        for field, value in (('input_tokens', True), ('output_tokens', False)):\n",
                  "            with self.subTest(field=field, value=value):\n",
                  "                events = [json.loads(line) for line in stream(request()).splitlines()]\n",
                  "                completed = next(event for event in events if event.get('type') == 'turn.completed')\n",
                  "                completed['usage'][field] = value\n",
                  "                with self.assertRaisesRegex(runner.RunnerError, 'Codex usage is invalid'):\n",
                  "                    runner.normalize(request(), events)\n",
                  "\n",
              ],
          )
          text = "".join(lines)
          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile tests/test_repobrief_agent_benchmark_codex_runner.py

      - name: Prove semantic regressions fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          expect_failure() {
            local test_name="$1"
            local log="$2"
            set +e
            python3 -m unittest "$test_name" >"$log" 2>&1
            local status=$?
            set -e
            cat "$log"
            test "$status" -ne 0
            grep -q '^FAIL:' "$log"
            grep -q 'FAILED (failures=1)' "$log"
            if grep -q '^ERROR:' "$log"; then
              echo "Regression errored instead of failing semantically: $test_name" >&2
              exit 1
            fi
          }
          expect_failure tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_treatment_tools_require_exact_model_visible_descriptors /tmp/descriptor-before.log
          expect_failure tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_mcp_proxy_rejects_unterminated_upstream_frame /tmp/frame-before.log
          expect_failure tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_normalize_rejects_boolean_token_counts /tmp/tokens-before.log

      - name: Apply line-oriented fail-closed implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          def unique_index(exact: str, start: int = 0, end: int | None = None) -> int:
              stop = len(lines) if end is None else end
              hits = [i for i in range(start, stop) if lines[i] == exact]
              if len(hits) != 1:
                  raise SystemExit(f"expected one line {exact!r}, got {len(hits)}")
              return hits[0]

          client_idx = unique_index('MCP_CLIENT_METHODS = {"initialize", "notifications/initialized", "ping", "tools/list", "tools/call"}\n')
          descriptor_lines = [
              "_REPOGROUND_READ_ANNOTATIONS: dict[str, bool] = {\n",
              "    'readOnlyHint': True,\n",
              "    'destructiveHint': False,\n",
              "    'idempotentHint': True,\n",
              "}\n",
              "EXPECTED_UPSTREAM_MCP_DESCRIPTORS: dict[str, dict[str, Any]] = {\n",
              "    'ask_context': {\n",
              "        'name': 'ask_context',\n",
              "        'title': 'RepoGround context pack',\n",
              "        'description': 'Build a cited context pack from one existing RepoGround bundle.',\n",
              "        'inputSchema': EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS['ask_context'],\n",
              "        'annotations': _REPOGROUND_READ_ANNOTATIONS,\n",
              "    },\n",
              "    'grounding_verify': {\n",
              "        'name': 'grounding_verify',\n",
              "        'title': 'RepoGround grounding verifier',\n",
              "        'description': 'Verify declared citations and ranges against an existing RepoGround bundle.',\n",
              "        'inputSchema': EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS['grounding_verify'],\n",
              "        'annotations': _REPOGROUND_READ_ANNOTATIONS,\n",
              "    },\n",
              "    'live_freshness': {\n",
              "        'name': 'live_freshness',\n",
              "        'title': 'RepoGround live freshness',\n",
              "        'description': 'Compare snapshot Git provenance with the configured local checkout without refreshing it.',\n",
              "        'inputSchema': EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS['live_freshness'],\n",
              "        'annotations': _REPOGROUND_READ_ANNOTATIONS,\n",
              "    },\n",
              "}\n",
          ]
          lines[client_idx:client_idx] = descriptor_lines

          counts_idx = unique_index("            counts[str(name)] += 1\n")
          append_idx = unique_index("            filtered.append(item)\n")
          if append_idx != counts_idx + 1:
              raise SystemExit("unexpected treatment filter layout")
          validation = [
              "            expected_descriptor = EXPECTED_UPSTREAM_MCP_DESCRIPTORS[str(name)]\n",
              "            if canonical(item) != canonical(expected_descriptor):\n",
              "                raise RunnerError(\n",
              "                    f'RepoGround treatment tool descriptor drifted for {name}'\n",
              "                )\n",
          ]
          lines[counts_idx:counts_idx] = validation
          append_idx += len(validation)
          lines[append_idx] = "            filtered.append(json.loads(json.dumps(expected_descriptor)))\n"

          reader_start = unique_index("def _read_bounded_mcp_line(stream: Any, *, peer: str) -> bytes:\n")
          reader_return = unique_index("    return raw\n", reader_start, min(reader_start + 10, len(lines)))
          lines[reader_return:reader_return] = [
              "    if raw and not raw.endswith(b'\\n'):\n",
              "        raise RunnerError(f'MCP {peer} message must be newline terminated')\n",
          ]

          normalize_start = unique_index("def normalize(request: Mapping[str, Any], events: list[dict[str, Any]]) -> tuple[dict[str, Any], dict[str, Any]]:\n")
          input_nonneg = unique_index("        or input_tokens < 0\n", normalize_start)
          lines[input_nonneg:input_nonneg] = ["        or isinstance(input_tokens, bool)\n"]
          output_nonneg = unique_index("        or output_tokens < 0\n", normalize_start)
          lines[output_nonneg:output_nonneg] = ["        or isinstance(output_tokens, bool)\n"]

          text = "".join(lines)
          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile tools/repobrief_agent_benchmark_codex_runner.py

      - name: Validate remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_treatment_tools_require_exact_model_visible_descriptors
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_mcp_proxy_rejects_unterminated_upstream_frame
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_normalize_rejects_boolean_token_counts
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner
          git diff --check
          python3 tools/check_no_secrets.py

      - name: Publish product fix and remove all temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py
          git commit -m "fix(rab): bind final treatment evidence edges"
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
          rm .github/workflows/pr1227-final-review-remediation.yml
          rm .github/workflows/pr1227-final-review-remediation-v2.yml
          rm .github/workflows/pr1227-final-review-remediation-v3.yml
          git add -u .github/workflows/pr1227-final-review-remediation.yml .github/workflows/pr1227-final-review-remediation-v2.yml .github/workflows/pr1227-final-review-remediation-v3.yml
          git commit -m "ci(pr1227): remove temporary remediation workflows"
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
