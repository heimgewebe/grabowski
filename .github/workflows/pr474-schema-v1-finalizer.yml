name: PR 474 schema-v1 compatibility finalizer

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/codex-review-settled-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Select one-shot invocation
        id: gate
        env:
          EXPECTED_PARENT: 7879bd094a94defc8e4952136277537294e91f87
        run: |
          if [ "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact compatibility patch
        if: steps.gate.outputs.run == 'true'
        env:
          EXPECTED_PATCH_SHA256: d53070e0c7ab21f0b9e1aca64ad4212e15a8aeb7f9e114a2f905c246cd93066d
          PATCH_GZIP_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_B64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/pr474-schema-v1.patch"
          test "$(sha256sum "$RUNNER_TEMP/pr474-schema-v1.patch" | cut -d' ' -f1)" = "$EXPECTED_PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/pr474-schema-v1.patch"
          git apply --index "$RUNNER_TEMP/pr474-schema-v1.patch"
          make context-refresh
          git diff --check

      - name: Validate complete repository
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          make validate
          make deploy-check

      - name: Commit and push validated compatibility fix
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git add docs src tests
          test -n "$(git status --short -- docs src tests)"
          git commit -m "fix(captain): preserve schema-v1 non-merge intents"
          git push origin HEAD:fix/codex-review-settled-v1
