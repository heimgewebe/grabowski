name: PR 1227 client EOF race remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-client-eof-race.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "056eabdee045d36ef15ffd7c999815034df3c44e"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "2f4472e027fc4d4aeaca28ab8486482bfbeeea09"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "fdb29c7b66c407b0620078328da7563499e8463e"
      - name: Apply client EOF synchronization and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          tests_path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one preimage, found {count}")
              return text.replace(old, new, 1)

          runner = replace_once(
              runner,
              "        with state_lock:\n            pending_tools_list = bool(tools_list_ids)\n        if pending_tools_list or not tools_inventory_validated:\n",
              "        client_thread.join(timeout=1)\n        if client_thread.is_alive():\n            raise RunnerError(\"MCP client intake remained active at upstream EOF\")\n        with state_lock:\n            pending_tools_list = bool(tools_list_ids)\n        if pending_tools_list or not tools_inventory_validated:\n",
              "client EOF synchronization",
          )

          anchor = '    def test_mcp_proxy_rejects_eof_with_unanswered_tools_list(self) -> None:\n'
          regression = "\n".join([
              "    def test_mcp_proxy_rejects_tools_list_arriving_during_upstream_eof(self) -> None:",
              "        with tempfile.TemporaryDirectory() as temporary:",
              "            root = Path(temporary)",
              "            upstream = root / \"mcp.py\"",
              "            valid_response = {",
              "                \"jsonrpc\": \"2.0\",",
              "                \"id\": 1,",
              "                \"result\": {\"tools\": [{\"name\": name} for name in sorted(runner.UPSTREAM_MCP)]},",
              "            }",
              "            upstream.write_text(",
              "                \"import json, os, sys, time\\n\"",
              "                \"sys.stdin.readline()\\n\"",
              "                f\"print(json.dumps({valid_response!r}), flush=True)\\n\"",
              "                \"os.close(1)\\n\"",
              "                \"time.sleep(2)\\n\",",
              "                encoding=\"utf-8\",",
              "            )",
              "            process = subprocess.Popen(",
              "                [sys.executable, str(MODULE_PATH), \"--codex-mcp-proxy\", json.dumps([sys.executable, str(upstream)])],",
              "                stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,",
              "            )",
              "            self.assertIsNotNone(process.stdin)",
              "            self.assertIsNotNone(process.stdout)",
              "            self.assertIsNotNone(process.stderr)",
              "            first = json.dumps({\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/list\", \"params\": {}}).encode() + b\"\\n\"",
              "            second = json.dumps({\"jsonrpc\": \"2.0\", \"id\": 2, \"method\": \"tools/list\", \"params\": {}}).encode() + b\"\\n\"",
              "            process.stdin.write(first)",
              "            process.stdin.flush()",
              "            self.assertTrue(process.stdout.readline())",
              "            process.stdin.write(second)",
              "            process.stdin.flush()",
              "            process.stdin.close()",
              "            stderr = process.stderr.read()",
              "            returncode = process.wait(timeout=5)",
              "            self.assertNotEqual(returncode, 0)",
              "            self.assertTrue(",
              "                b\"inventory was not validated\" in stderr",
              "                or b\"client intake remained active\" in stderr",
              "            )",
              "",
              "",
          ])
          tests = replace_once(tests, anchor, regression + anchor, "race regression")

          runner_path.write_text(runner, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          compile(runner, str(runner_path), "exec")
          compile(tests, str(tests_path), "exec")
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_repobrief_agent_benchmark_codex_runner.py
          git diff --check
          python3 tools/check_no_secrets.py
      - name: Publish code-only fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1227-client-eof-race.yml
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py .github/workflows/pr1227-client-eof-race.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rab): synchronize client intake before upstream EOF'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
