name: t055 runtime outbox refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: t055-runtime-outbox-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'fix/t055-alert-outbox-runtime-v1-gh'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply bounded deterministic patch
        run: python3 .github/scripts/t055_apply.py

      - name: Regenerate contracts
        run: make context-refresh

      - name: Verify exact diff scope
        shell: bash
        run: |
          diff -u \
            <(printf '%s\n' \
              config/runtime-entrypoint.json \
              contracts/capability-catalog.v1.json \
              contracts/publication-profiles.v1.json \
              docs/generated/operator-context.v1.json \
              docs/ntfy-alert-outbox-v1.md \
              tests/test_repository_contract.py | sort) \
            <(git status --porcelain=v1 | cut -c4- | sort)
          git diff --check
          git diff --binary | sha256sum | tee /tmp/t055-diff.sha256

      - name: Focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$PWD/build"
          test_home="$(mktemp -d "$PWD/build/test-home.XXXXXX")"
          trap 'rm -rf "$test_home"' EXIT
          install -d -m 700 "$test_home/.config/grabowski"
          install -m 600 \
            config/access.home-wide-operator.example.json \
            "$test_home/.config/grabowski/access.json"
          HOME="$test_home" python3 -m unittest \
            tests.test_repository_contract \
            tests.test_alert_outbox \
            tests.test_ntfy_dispatch \
            tests.test_operator_obligation \
            tests.test_recovery \
            tests.test_task_attention

      - name: Full validation
        run: make validate

      - name: Commit product patch and remove helpers
        shell: bash
        run: |
          rm .github/scripts/t055_apply.py
          rm .github/workflows/t055-runtime-outbox-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): package general ntfy alert outbox"
          git push origin HEAD:${{ github.head_ref }}
