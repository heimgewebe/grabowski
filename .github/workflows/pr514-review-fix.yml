name: Apply PR 514 review hardening

on:
  push:
    branches:
      - fix/pr514-review-followup-v1

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact follow-up branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pr514-review-followup-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Apply bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          source_path = Path("src/grabowski_text_artifact_reconcile.py")
          source = source_path.read_text(encoding="utf-8")
          old_constants = dedent('''\
          _MAX_UNMANAGED_ENTRIES = 256
          _MAX_UNMANAGED_TOTAL_BYTES = 64 * 1024 * 1024
          _COPY_CHUNK_BYTES = 1024 * 1024
          ''')
          new_constants = dedent('''\
          _MAX_UNMANAGED_ENTRIES = 256
          _MAX_UNMANAGED_TOTAL_BYTES = 64 * 1024 * 1024
          _MAX_QUARANTINE_DIRECTORIES = 4096
          _MAX_QUARANTINE_TOTAL_BYTES = 512 * 1024 * 1024
          _COPY_CHUNK_BYTES = 1024 * 1024
          _RENAME_NOREPLACE = 1
          _RENAME_EXCHANGE = 2
          ''')
          if source.count(old_constants) != 1:
              raise SystemExit("constant insertion anchor drifted")
          source = source.replace(old_constants, new_constants)

          helper_start = source.index("def _rename_directory_noreplace(")
          helper_end = source.index("def _create_quarantine_locked(", helper_start)
          helper_block = dedent('''\
          def _build_quarantine_receipt(
              inventory: dict[str, Any],
              *,
              created_at_unix: int,
          ) -> dict[str, Any]:
              return {
                  "schema_version": SCHEMA_VERSION,
                  "kind": RECEIPT_KIND,
                  "inventory_sha256": inventory["inventory_sha256"],
                  "artifact_id": inventory["artifact_id"],
                  "managed": inventory["managed"],
                  "quarantined_entries": inventory["unmanaged_entries"],
                  "created_at_unix": created_at_unix,
                  "does_not_establish": [
                      "safe deletion beyond the reviewed inventory",
                      "transport-file authorship",
                      "review correctness",
                      "merge authority",
                  ],
              }


          def _quarantine_directory_usage_locked(
              quarantine_root_descriptor: int,
              name: str,
          ) -> int:
              descriptor, identity = artifacts._open_private_directory_at(
                  quarantine_root_descriptor,
                  name,
              )
              try:
                  entries = sorted(os.listdir(descriptor))
                  if len(entries) > _MAX_UNMANAGED_ENTRIES + 1:
                      raise TextArtifactReconciliationError(
                          "Text artifact quarantine directory exceeds the bounded entry count"
                      )
                  total_bytes = 0
                  for entry_name in entries:
                      file_descriptor, before = _open_legacy_regular_file_at(
                          descriptor,
                          entry_name,
                      )
                      try:
                          after = os.fstat(file_descriptor)
                          linked = os.stat(
                              entry_name,
                              dir_fd=descriptor,
                              follow_symlinks=False,
                          )
                          if (
                              _entry_identity(before) != _entry_identity(after)
                              or _entry_identity(before) != _entry_identity(linked)
                              or stat.S_IMODE(before.st_mode) != 0o600
                          ):
                              raise TextArtifactReconciliationError(
                                  "Text artifact quarantine usage changed while reading"
                              )
                          total_bytes += before.st_size
                      finally:
                          os.close(file_descriptor)
                  artifacts._verify_private_directory_at(
                      quarantine_root_descriptor,
                      name,
                      descriptor,
                      identity,
                  )
                  return total_bytes
              finally:
                  os.close(descriptor)


          def _quarantine_usage_locked(
              quarantine_root_descriptor: int,
          ) -> dict[str, Any]:
              names = sorted(os.listdir(quarantine_root_descriptor))
              if len(names) > _MAX_QUARANTINE_DIRECTORIES:
                  raise TextArtifactReconciliationError(
                      "Text artifact quarantine directory count exceeds the retention limit"
                  )
              total_bytes = 0
              for name in names:
                  if artifacts.SHA256_RE.fullmatch(name) is None:
                      raise TextArtifactReconciliationError(
                          "Text artifact quarantine root contains an unmanaged entry"
                      )
                  total_bytes += _quarantine_directory_usage_locked(
                      quarantine_root_descriptor,
                      name,
                  )
                  if total_bytes > _MAX_QUARANTINE_TOTAL_BYTES:
                      raise TextArtifactReconciliationError(
                          "Text artifact quarantine bytes exceed the retention limit"
                      )
              return {
                  "names": names,
                  "directory_count": len(names),
                  "byte_size": total_bytes,
              }


          def _require_quarantine_capacity(
              usage: dict[str, Any],
              *,
              additional_bytes: int,
          ) -> None:
              if usage["directory_count"] + 1 > _MAX_QUARANTINE_DIRECTORIES:
                  raise TextArtifactReconciliationError(
                      "Text artifact quarantine directory capacity is exhausted"
                  )
              if usage["byte_size"] + additional_bytes > _MAX_QUARANTINE_TOTAL_BYTES:
                  raise TextArtifactReconciliationError(
                      "Text artifact quarantine byte capacity is exhausted"
                  )


          def _entry_matches_bound_source(
              observed: dict[str, Any],
              expected: dict[str, Any],
          ) -> bool:
              fields = {
                  "path",
                  "file_type",
                  "name",
                  "device",
                  "inode",
                  "mode",
                  "link_count",
                  "uid",
                  "gid",
                  "byte_size",
                  "mtime_ns",
                  "sha256",
              }
              return all(observed.get(field) == expected.get(field) for field in fields)


          def _renameat2(
              source_descriptor: int,
              source_name: str,
              destination_descriptor: int,
              destination_name: str,
              *,
              flags: int,
              operation: str,
          ) -> None:
              try:
                  renameat2 = ctypes.CDLL(None, use_errno=True).renameat2
              except AttributeError as exc:
                  raise TextArtifactReconciliationError(
                      f"Text artifact {operation} rename is unavailable"
                  ) from exc
              renameat2.argtypes = [
                  ctypes.c_int,
                  ctypes.c_char_p,
                  ctypes.c_int,
                  ctypes.c_char_p,
                  ctypes.c_uint,
              ]
              renameat2.restype = ctypes.c_int
              result = renameat2(
                  source_descriptor,
                  os.fsencode(_safe_entry_name(source_name)),
                  destination_descriptor,
                  os.fsencode(_safe_entry_name(destination_name)),
                  flags,
              )
              if result == 0:
                  return
              error = ctypes.get_errno()
              if flags == _RENAME_NOREPLACE and error == errno.EEXIST:
                  raise TextArtifactReconciliationError(
                      f"Text artifact {operation} destination already exists"
                  )
              if error in {errno.ENOSYS, errno.EINVAL, errno.ENOTSUP}:
                  raise TextArtifactReconciliationError(
                      f"Text artifact {operation} rename is unavailable"
                  )
              raise TextArtifactReconciliationError(
                  f"Text artifact {operation} rename failed"
              ) from OSError(error, os.strerror(error))


          def _rename_directory_noreplace(
              parent_descriptor: int,
              source_name: str,
              destination_name: str,
          ) -> None:
              _renameat2(
                  parent_descriptor,
                  source_name,
                  parent_descriptor,
                  destination_name,
                  flags=_RENAME_NOREPLACE,
                  operation="quarantine",
              )


          def _rename_entry_noreplace(
              source_descriptor: int,
              source_name: str,
              destination_descriptor: int,
              destination_name: str,
          ) -> None:
              _renameat2(
                  source_descriptor,
                  source_name,
                  destination_descriptor,
                  destination_name,
                  flags=_RENAME_NOREPLACE,
                  operation="source isolation",
              )


          def _rename_entry_exchange(
              source_descriptor: int,
              source_name: str,
              destination_descriptor: int,
              destination_name: str,
          ) -> None:
              _renameat2(
                  source_descriptor,
                  source_name,
                  destination_descriptor,
                  destination_name,
                  flags=_RENAME_EXCHANGE,
                  operation="verified source exchange",
              )


          ''')
          source = source[:helper_start] + helper_block + source[helper_end:]

          create_start = source.index("def _create_quarantine_locked(")
          create_end = source.index("def _clean_source_locked(", create_start)
          create_block = dedent('''\
          def _create_quarantine_locked(
              quarantine_root_descriptor: int,
              *,
              inventory: dict[str, Any],
              receipt: dict[str, Any],
              source_descriptor: int,
          ) -> tuple[dict[str, Any], str, Path]:
              inventory_sha256 = str(inventory["inventory_sha256"])
              temporary_name = f".{inventory_sha256}.{uuid.uuid4().hex}.tmp"
              temporary_path = TEXT_ARTIFACT_QUARANTINE_ROOT / temporary_name
              final_path = TEXT_ARTIFACT_QUARANTINE_ROOT / inventory_sha256
              os.mkdir(temporary_name, 0o700, dir_fd=quarantine_root_descriptor)
              temporary_descriptor, _ = artifacts._open_private_directory_at(
                  quarantine_root_descriptor,
                  temporary_name,
              )
              try:
                  for entry in inventory["unmanaged_entries"]:
                      _copy_entry(
                          source_descriptor,
                          temporary_descriptor,
                          entry,
                          artifact_id=str(inventory["artifact_id"]),
                      )
                  receipt_path = temporary_path / "receipt.json"
                  artifacts._atomic_write(receipt_path, _canonical_bytes(receipt))
                  quarantine_receipt_sha256 = hashlib.sha256(
                      receipt_path.read_bytes()
                  ).hexdigest()
                  os.fsync(temporary_descriptor)
                  _verify_current_private_directory_at(
                      quarantine_root_descriptor,
                      temporary_name,
                      temporary_descriptor,
                  )
              except Exception:
                  os.close(temporary_descriptor)
                  shutil.rmtree(temporary_path, ignore_errors=True)
                  raise
              os.close(temporary_descriptor)
              try:
                  _rename_directory_noreplace(
                      quarantine_root_descriptor,
                      temporary_name,
                      inventory_sha256,
                  )
              except Exception:
                  shutil.rmtree(temporary_path, ignore_errors=True)
                  raise
              os.fsync(quarantine_root_descriptor)
              return receipt, quarantine_receipt_sha256, final_path


          ''')
          source = source[:create_start] + create_block + source[create_end:]

          clean_start = source.index("def _clean_source_locked(")
          clean_end = source.index("def reconcile_text_artifact_store(", clean_start)
          clean_block = dedent('''\
          def _clean_source_locked(
              root_descriptor: int,
              quarantine_root_descriptor: int,
              *,
              artifact_id: str,
              inventory_sha256: str,
              quarantine_receipt: dict[str, Any],
          ) -> int:
              artifact_descriptor, _ = artifacts._open_private_directory_at(
                  root_descriptor,
                  artifact_id,
              )
              cleanup_name = f".{inventory_sha256}.{uuid.uuid4().hex}.source-cleanup"
              cleanup_descriptor: int | None = None
              quarantine_descriptor: int | None = None
              preserve_cleanup = False
              try:
                  receipt, receipt_sha256, artifact_sha256, artifact_size = (
                      _validate_managed_artifact(
                          artifact_descriptor,
                          artifact_id=artifact_id,
                      )
                  )
                  managed = _managed_binding(
                      receipt,
                      receipt_sha256,
                      artifact_sha256,
                      artifact_size,
                  )
                  if managed != quarantine_receipt["managed"]:
                      raise TextArtifactReconciliationError(
                          "Text artifact source managed binding changed"
                      )
                  expected_entries = {
                      str(entry["name"]): entry
                      for entry in quarantine_receipt["quarantined_entries"]
                  }
                  managed_names = {"receipt.json", receipt["filename"]}
                  source_names = set(os.listdir(artifact_descriptor))
                  remaining_names = sorted(source_names - managed_names)
                  unknown = sorted(set(remaining_names) - set(expected_entries))
                  if unknown:
                      raise TextArtifactReconciliationError(
                          "Text artifact source contains entries outside the reviewed quarantine"
                      )
                  if not remaining_names:
                      _verify_current_private_directory_at(
                          root_descriptor,
                          artifact_id,
                          artifact_descriptor,
                      )
                      return 0

                  os.mkdir(cleanup_name, 0o700, dir_fd=quarantine_root_descriptor)
                  cleanup_descriptor, _ = artifacts._open_private_directory_at(
                      quarantine_root_descriptor,
                      cleanup_name,
                  )
                  quarantine_descriptor, _ = artifacts._open_private_directory_at(
                      quarantine_root_descriptor,
                      inventory_sha256,
                  )
                  try:
                      for name in remaining_names:
                          expected = expected_entries[name]
                          _verify_source_entry(
                              artifact_descriptor,
                              expected,
                              artifact_id=artifact_id,
                          )
                          _rename_entry_noreplace(
                              artifact_descriptor,
                              name,
                              cleanup_descriptor,
                              name,
                          )
                          isolated = _inventory_entry(
                              artifact_id,
                              _inspect_entry(cleanup_descriptor, name),
                          )
                          if not _entry_matches_bound_source(isolated, expected):
                              preserve_cleanup = True
                              raise TextArtifactReconciliationError(
                                  "Text artifact source entry changed before atomic isolation"
                              )
                          _rename_entry_exchange(
                              cleanup_descriptor,
                              name,
                              quarantine_descriptor,
                              name,
                          )
                          quarantined = _inventory_entry(
                              artifact_id,
                              _inspect_entry(quarantine_descriptor, name),
                          )
                          if not _entry_matches_bound_source(quarantined, expected):
                              preserve_cleanup = True
                              raise TextArtifactReconciliationError(
                                  "Text artifact isolated source entry changed during exchange"
                              )
                          os.chmod(
                              name,
                              0o600,
                              dir_fd=quarantine_descriptor,
                              follow_symlinks=False,
                          )
                          stored = _inspect_entry(quarantine_descriptor, name)
                          if (
                              stored["sha256"] != expected["sha256"]
                              or stored["byte_size"] != expected["byte_size"]
                              or stored["mode"] != 0o600
                          ):
                              preserve_cleanup = True
                              raise TextArtifactReconciliationError(
                                  "Text artifact exchanged quarantine payload failed verification"
                              )
                          os.unlink(name, dir_fd=cleanup_descriptor)
                      os.fsync(artifact_descriptor)
                      os.fsync(quarantine_descriptor)
                      os.fsync(cleanup_descriptor)
                      if set(os.listdir(artifact_descriptor)) != managed_names:
                          raise TextArtifactReconciliationError(
                              "Text artifact source cleanup did not restore the managed entry set"
                          )
                      if os.listdir(cleanup_descriptor):
                          preserve_cleanup = True
                          raise TextArtifactReconciliationError(
                              "Text artifact source cleanup staging is not empty"
                          )
                      _verify_current_private_directory_at(
                          root_descriptor,
                          artifact_id,
                          artifact_descriptor,
                      )
                      _verify_current_private_directory_at(
                          quarantine_root_descriptor,
                          inventory_sha256,
                          quarantine_descriptor,
                      )
                  except Exception:
                      if cleanup_descriptor is not None and os.listdir(cleanup_descriptor):
                          preserve_cleanup = True
                      raise
                  return len(remaining_names)
              finally:
                  if quarantine_descriptor is not None:
                      os.close(quarantine_descriptor)
                  if cleanup_descriptor is not None:
                      os.close(cleanup_descriptor)
                      if not preserve_cleanup:
                          try:
                              os.rmdir(cleanup_name, dir_fd=quarantine_root_descriptor)
                              os.fsync(quarantine_root_descriptor)
                          except FileNotFoundError:
                              pass
                  os.close(artifact_descriptor)


          ''')
          source = source[:clean_start] + clean_block + source[clean_end:]

          old_usage = "            quarantine_names = set(os.listdir(quarantine_root_descriptor))\n            quarantine_reused = inventory_sha256 in quarantine_names\n"
          new_usage = "            quarantine_usage = _quarantine_usage_locked(\n                quarantine_root_descriptor\n            )\n            quarantine_names = set(quarantine_usage[\"names\"])\n            quarantine_reused = inventory_sha256 in quarantine_names\n"
          if source.count(old_usage) != 1:
              raise SystemExit("quarantine usage anchor drifted")
          source = source.replace(old_usage, new_usage)

          old_create = dedent('''\
                          artifact_descriptor, _ = artifacts._open_private_directory_at(
                              root_descriptor,
                              identity,
                          )
                          try:
                              quarantine_receipt, quarantine_receipt_sha256, final_path = (
                                  _create_quarantine_locked(
                                      quarantine_root_descriptor,
                                      inventory=inventory,
                                      source_descriptor=artifact_descriptor,
                                  )
                              )
                          finally:
                              os.close(artifact_descriptor)
          ''')
          new_create = dedent('''\
                          quarantine_receipt = _build_quarantine_receipt(
                              inventory,
                              created_at_unix=int(time.time()),
                          )
                          additional_bytes = sum(
                              int(entry["byte_size"])
                              for entry in inventory["unmanaged_entries"]
                          ) + len(_canonical_bytes(quarantine_receipt))
                          _require_quarantine_capacity(
                              quarantine_usage,
                              additional_bytes=additional_bytes,
                          )
                          artifact_descriptor, _ = artifacts._open_private_directory_at(
                              root_descriptor,
                              identity,
                          )
                          try:
                              quarantine_receipt, quarantine_receipt_sha256, final_path = (
                                  _create_quarantine_locked(
                                      quarantine_root_descriptor,
                                      inventory=inventory,
                                      receipt=quarantine_receipt,
                                      source_descriptor=artifact_descriptor,
                                  )
                              )
                          finally:
                              os.close(artifact_descriptor)
          ''')
          if source.count(old_create) != 1:
              raise SystemExit("quarantine creation anchor drifted")
          source = source.replace(old_create, new_create)

          old_clean_call = dedent('''\
                      cleaned_count = _clean_source_locked(
                          root_descriptor,
                          artifact_id=identity,
                          quarantine_receipt=quarantine_receipt,
                      )
          ''')
          new_clean_call = dedent('''\
                      cleaned_count = _clean_source_locked(
                          root_descriptor,
                          quarantine_root_descriptor,
                          artifact_id=identity,
                          inventory_sha256=inventory_sha256,
                          quarantine_receipt=quarantine_receipt,
                      )
          ''')
          if source.count(old_clean_call) != 1:
              raise SystemExit("source cleanup call anchor drifted")
          source = source.replace(old_clean_call, new_clean_call)
          source_path.write_text(source, encoding="utf-8")

          pyproject = Path("pyproject.toml")
          replace_once(
              pyproject,
              '[project.scripts]\ngrabowski-text-artifact-reconcile = "grabowski_text_artifact_reconcile:main"\n\n',
              '',
          )
          replace_once(
              pyproject,
              ', "grabowski_checkout_binding_reconciler", "grabowski_text_artifact_reconcile"]',
              ', "grabowski_checkout_binding_reconciler"]',
          )

          contract = Path("config/runtime-entrypoint.json")
          replace_once(
              contract,
              '    {\n      "module": "grabowski_artifacts",\n      "source": "src/grabowski_artifacts.py"\n    },\n    {\n      "module": "grabowski_workers",',
              '    {\n      "module": "grabowski_artifacts",\n      "source": "src/grabowski_artifacts.py"\n    },\n    {\n      "module": "grabowski_text_artifact_reconcile",\n      "source": "src/grabowski_text_artifact_reconcile.py"\n    },\n    {\n      "module": "grabowski_workers",',
          )

          tests_path = Path("tests/test_text_artifact_reconcile.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_fixture = dedent('''\
          def _artifact_fixture(root: Path) -> tuple[str, str, str, Path, bytes]:
              root.mkdir(mode=0o700)
              root.chmod(0o700)
              artifact_id = "a" * 32
          ''')
          new_fixture = dedent('''\
          def _artifact_fixture(
              root: Path,
              *,
              artifact_id: str = "a" * 32,
          ) -> tuple[str, str, str, Path, bytes]:
              root.mkdir(mode=0o700, exist_ok=True)
              root.chmod(0o700)
          ''')
          if tests.count(old_fixture) != 1:
              raise SystemExit("test fixture anchor drifted")
          tests = tests.replace(old_fixture, new_fixture)

          sidecar_anchor = '        _write_private(sidecar, b"transport", 0o644)\n\n        with (\n'
          sidecar_replacement = '        _write_private(sidecar, b"transport", 0o644)\n        source_inode = sidecar.stat().st_ino\n\n        with (\n'
          if tests.count(sidecar_anchor) < 1:
              raise SystemExit("sidecar inode anchor drifted")
          tests = tests.replace(sidecar_anchor, sidecar_replacement, 1)

          mode_anchor = dedent('''\
                      self.assertEqual(
                          (quarantined / "artifact.chunk.00").stat().st_mode & 0o777,
                          0o600,
                      )
          ''')
          mode_replacement = mode_anchor + dedent('''\
                      self.assertEqual(
                          (quarantined / "artifact.chunk.00").stat().st_ino,
                          source_inode,
                      )
          ''')
          if tests.count(mode_anchor) != 1:
              raise SystemExit("quarantine inode assertion anchor drifted")
          tests = tests.replace(mode_anchor, mode_replacement)

          insert_anchor = "    def test_reconcile_is_idempotent_but_rejects_new_unreviewed_entries(self) -> None:\n"
          regression_tests = dedent('''\
              def test_source_replacement_before_isolation_is_preserved_not_deleted(self) -> None:
                  store = self.root / "text-artifacts"
                  quarantine = self.root / "quarantine"
                  artifact_id, artifact_sha256, receipt_sha256, directory, _ = (
                      _artifact_fixture(store)
                  )
                  sidecar = directory / "artifact.chunk.00"
                  _write_private(sidecar, b"reviewed", 0o644)
                  displaced_original = self.root / "displaced-original"
                  original_rename = reconcile._rename_entry_noreplace
                  replaced = False

                  def replace_then_isolate(
                      source_descriptor: int,
                      source_name: str,
                      destination_descriptor: int,
                      destination_name: str,
                  ) -> None:
                      nonlocal replaced
                      if not replaced:
                          os.replace(sidecar, displaced_original)
                          _write_private(sidecar, b"unreviewed-replacement", 0o644)
                          replaced = True
                      original_rename(
                          source_descriptor,
                          source_name,
                          destination_descriptor,
                          destination_name,
                      )

                  with (
                      patch.object(artifacts, "TEXT_ARTIFACT_ROOT", store),
                      patch.object(reconcile, "TEXT_ARTIFACT_QUARANTINE_ROOT", quarantine),
                      patch.object(reconcile, "_rename_entry_noreplace", replace_then_isolate),
                      patch.object(artifacts.base, "_append_audit"),
                  ):
                      inventory = reconcile.inspect_text_artifact_store(artifact_id)
                      with self.assertRaisesRegex(
                          reconcile.TextArtifactReconciliationError,
                          "changed before atomic isolation",
                      ):
                          reconcile.reconcile_text_artifact_store(
                              artifact_id,
                              inventory["inventory_sha256"],
                              artifact_sha256,
                              receipt_sha256,
                          )

                  self.assertEqual(displaced_original.read_bytes(), b"reviewed")
                  staging = [
                      path for path in quarantine.iterdir() if path.name.startswith(".")
                  ]
                  self.assertEqual(len(staging), 1)
                  self.assertEqual(
                      (staging[0] / "artifact.chunk.00").read_bytes(),
                      b"unreviewed-replacement",
                  )

              def test_quarantine_count_capacity_blocks_before_source_cleanup(self) -> None:
                  store = self.root / "text-artifacts"
                  quarantine = self.root / "quarantine"
                  first = _artifact_fixture(store, artifact_id="a" * 32)
                  second = _artifact_fixture(store, artifact_id="b" * 32)
                  _write_private(first[3] / "artifact.chunk.00", b"first", 0o644)
                  second_sidecar = second[3] / "artifact.chunk.00"
                  _write_private(second_sidecar, b"second", 0o644)

                  with (
                      patch.object(artifacts, "TEXT_ARTIFACT_ROOT", store),
