name: PR 1227 final independent-review remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-final-review-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1bf418f6311118b174fc69a0ba9c2558f0483efa"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "5e56c730b5bb013cff1cb4bbd97b00fed8a5209a"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "672aad2c497590b7f8fa9f8f1d97d81f38a98ccc"
      - name: Apply reviewed fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          tests_path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one preimage, found {count}")
              return text.replace(old, new, 1)

          runner = replace_once(
              runner,
              '    if any(part in {";", "&", "&&", "|", "||", ">", ">>", "<", "<<"} for part in parts):\n        raise RunnerError("chained, piped, or redirected command is not allowed")\n',
              '    if any(re.fullmatch(r"[;&|<>]+", part) is not None for part in parts):\n        raise RunnerError("chained, piped, or redirected command is not allowed")\n',
              "compound shell punctuation",
          )

          runner = replace_once(
              runner,
              'def run_mcp_proxy(upstream: Sequence[str]) -> int:\n',
              'def _read_bounded_mcp_line(stream: Any, *, peer: str) -> bytes:\n'
              '    raw = stream.readline(base.MAX_MCP_MESSAGE_BYTES + 1)\n'
              '    if len(raw) > base.MAX_MCP_MESSAGE_BYTES:\n'
              '        raise RunnerError(f"MCP {peer} message too large")\n'
              '    return raw\n\n\n'
              'def run_mcp_proxy(upstream: Sequence[str]) -> int:\n',
              "bounded MCP line helper",
          )
          runner = replace_once(
              runner,
              '            for raw in sys.stdin.buffer:\n'
              '                if len(raw) > base.MAX_MCP_MESSAGE_BYTES:\n'
              '                    raise RunnerError("MCP client message too large")\n'
              '                message = json.loads(raw)\n',
              '            while True:\n'
              '                raw = _read_bounded_mcp_line(sys.stdin.buffer, peer="client")\n'
              '                if not raw:\n'
              '                    break\n'
              '                message = json.loads(raw)\n',
              "bounded MCP client input",
          )
          runner = replace_once(
              runner,
              '        for raw in process.stdout:\n            message = json.loads(raw)\n',
              '        while True:\n'
              '            raw = _read_bounded_mcp_line(process.stdout, peer="upstream")\n'
              '            if not raw:\n'
              '                break\n'
              '            message = json.loads(raw)\n',
              "bounded MCP upstream output",
          )

          runner = replace_once(
              runner,
              '    def store(label: str, chunk: bytes) -> None:\n',
              '    def process_group_exists() -> bool:\n'
              '        try:\n'
              '            os.killpg(process.pid, 0)\n'
              '        except ProcessLookupError:\n'
              '            return False\n'
              '        except OSError as exc:\n'
              '            note_error(f"process_group_probe_failed:{type(exc).__name__}")\n'
              '            return True\n'
              '        return True\n\n'
              '    def contain_surviving_process_group() -> None:\n'
              '        if not process_group_exists():\n'
              '            return\n'
              '        note_error("process_group_survived_provider_exit")\n'
              '        kill_process_tree()\n'
              '        cleanup_deadline = time.monotonic() + 1.0\n'
              '        while time.monotonic() < cleanup_deadline:\n'
              '            if not process_group_exists():\n'
              '                return\n'
              '            time.sleep(0.01)\n'
              '        if process_group_exists():\n'
              '            note_error("process_group_cleanup_failed")\n\n'
              '    def store(label: str, chunk: bytes) -> None:\n',
              "post-exit process-group containment",
          )
          runner = replace_once(
              runner,
              '    returncode = process.returncode if isinstance(process.returncode, int) else -1\n\n    # After a capture fault, drain whatever bytes the terminated process left in\n',
              '    returncode = process.returncode if isinstance(process.returncode, int) else -1\n'
              '    if process.poll() is not None:\n'
              '        contain_surviving_process_group()\n\n'
              '    # After a capture fault, drain whatever bytes the terminated process left in\n',
              "invoke post-exit containment",
          )

          tests = replace_once(
              tests,
              '            "cat src/example.py\\r\\nrg needle src",\n        ):\n',
              '            "cat src/example.py\\r\\nrg needle src",\n'
              '            "rg needle src |& id",\n'
              '            "cat src/example.py &> output",\n'
              '            "cat src/example.py >& output",\n'
              '            "cat src/example.py <<< data",\n'
              '            "cat src/example.py >| output",\n'
              '        ):\n',
              "compound shell regressions",
          )

          provider_anchor = '    def test_run_bounded_times_out_when_provider_does_not_read_stdin(self) -> None:\n'
          provider_test = (
              '    def test_run_bounded_kills_process_group_left_after_normal_provider_exit(self) -> None:\n'
              '        with tempfile.TemporaryDirectory() as temporary:\n'
              '            root = Path(temporary)\n'
              '            child_state = root / "child.pid"\n'
              '            script = root / "provider.py"\n'
              '            script.write_text(\n'
              '                "import os, pathlib, time\\n"\n'
              '                "child = os.fork()\\n"\n'
              '                "if child == 0:\\n"\n'
              '                f"    pathlib.Path({str(child_state)!r}).write_text(str(os.getpid()))\\n"\n'
              '                "    for fd in (0, 1, 2):\\n"\n'
              '                "        try:\\n"\n'
              '                "            os.close(fd)\\n"\n'
              '                "        except OSError:\\n"\n'
              '                "            pass\\n"\n'
              '                "    time.sleep(30)\\n"\n'
              '                "    os._exit(0)\\n"\n'
              '                f"state = pathlib.Path({str(child_state)!r})\\n"\n'
              '                "while not state.exists():\\n"\n'
              '                "    time.sleep(0.01)\\n"\n'
              '                "os._exit(0)\\n",\n'
              '                encoding="utf-8",\n'
              '            )\n'
              '            capture = runner.run_bounded(\n'
              '                [sys.executable, str(script)], cwd=root, timeout_seconds=3, stdin_data=b""\n'
              '            )\n'
              '            self.assertIn("process_group_survived_provider_exit", str(capture["capture_error"]))\n'
              '            child_pid = int(child_state.read_text())\n'
              '            deadline = time.monotonic() + 2\n'
              '            while True:\n'
              '                try:\n'
              '                    os.kill(child_pid, 0)\n'
              '                except ProcessLookupError:\n'
              '                    break\n'
              '                if time.monotonic() >= deadline:\n'
              '                    self.fail("provider descendant survived process-group containment")\n'
              '                time.sleep(0.02)\n\n'
          )
          tests = replace_once(tests, provider_anchor, provider_test + provider_anchor, "normal-exit group regression")

          mcp_anchor = '    def test_mcp_proxy_reaps_failed_upstream_without_detaching_from_provider_group(self) -> None:\n'
          mcp_test = (
              '    def test_mcp_proxy_rejects_oversized_upstream_line_before_newline(self) -> None:\n'
              '        with tempfile.TemporaryDirectory() as temporary:\n'
              '            root = Path(temporary)\n'
              '            state_path = root / "upstream.pid"\n'
              '            upstream = root / "mcp.py"\n'
              '            upstream.write_text(\n'
              '                "import os, pathlib, sys, time\\n"\n'
              '                f"pathlib.Path({str(state_path)!r}).write_text(str(os.getpid()))\\n"\n'
              '                f"sys.stdout.buffer.write(b\'x\' * ({runner.base.MAX_MCP_MESSAGE_BYTES} + 1)); sys.stdout.buffer.flush()\\n"\n'
              '                "time.sleep(30)\\n",\n'
              '                encoding="utf-8",\n'
              '            )\n'
              '            started = time.monotonic()\n'
              '            completed = subprocess.run(\n'
              '                [sys.executable, str(MODULE_PATH), "--codex-mcp-proxy", json.dumps([sys.executable, str(upstream)])],\n'
              '                input=b"", capture_output=True, check=False, timeout=8,\n'
              '            )\n'
              '            elapsed = time.monotonic() - started\n'
              '            self.assertNotEqual(completed.returncode, 0)\n'
              '            self.assertLess(elapsed, 5.0)\n'
              '            upstream_pid = int(state_path.read_text())\n'
              '            with self.assertRaises(ProcessLookupError):\n'
              '                os.kill(upstream_pid, 0)\n\n'
          )
          tests = replace_once(tests, mcp_anchor, mcp_test + mcp_anchor, "bounded MCP upstream regression")

          runner_path.write_text(runner, encoding="utf-8")
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_repobrief_agent_benchmark_codex_runner.py
          git diff --check
          python3 tools/check_no_secrets.py
      - name: Publish code-only fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1227-final-review-remediation.yml
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py .github/workflows/pr1227-final-review-remediation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rab): close final independent review gaps'
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
