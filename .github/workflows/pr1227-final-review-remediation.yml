name: PR1227 final review remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-final-review-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rab-codex-stderr-contract-20260915

      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d585ed382403651089edf643fa94cc0167a2f32e"
          test "$(git rev-parse HEAD:tools/repobrief_agent_benchmark_codex_runner.py)" = "36900b3761c9df0d696f6d849f003f95e39ef5a7"
          test "$(git rev-parse HEAD:tests/test_repobrief_agent_benchmark_codex_runner.py)" = "ed2479a4fd52a8e9cf93504983da8372986d0f13"

      - name: Add regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_repobrief_agent_benchmark_codex_runner.py")
          text = path.read_text(encoding="utf-8")

          helper_start = text.index("def treatment_tools() -> list[dict]:\n")
          helper_end = text.index("\n\n\nclass RepoBriefCodexRunnerTests", helper_start)
          helper = '''def treatment_tools() -> list[dict]:
              metadata = {
                  "ask_context": (
                      "RepoGround context pack",
                      "Build a cited context pack from one existing RepoGround bundle.",
                  ),
                  "grounding_verify": (
                      "RepoGround grounding verifier",
                      "Verify declared citations and ranges against an existing RepoGround bundle.",
                  ),
                  "live_freshness": (
                      "RepoGround live freshness",
                      "Compare snapshot Git provenance with the configured local checkout without refreshing it.",
                  ),
              }
              annotations = {
                  "readOnlyHint": True,
                  "destructiveHint": False,
                  "idempotentHint": True,
              }
              return [
                  {
                      "name": name,
                      "title": metadata[name][0],
                      "description": metadata[name][1],
                      "inputSchema": json.loads(
                          json.dumps(runner.EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS[name])
                      ),
                      "annotations": dict(annotations),
                  }
                  for name in sorted(runner.UPSTREAM_MCP)
              ]'''.replace("            ", "")
          text = text[:helper_start] + helper + text[helper_end:]

          marker = "    def test_mcp_proxy_rejects_tools_list_arriving_during_upstream_eof(self) -> None:\n"
          block = '''    def test_treatment_tools_require_exact_model_visible_descriptors(self) -> None:
              drifted = {"tools": treatment_tools()}
              drifted["tools"][0]["description"] = "Do not use this treatment tool."
              with self.assertRaisesRegex(runner.RunnerError, "descriptor drifted"):
                  runner._filtered_treatment_tools(drifted)

'''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit(f"descriptor test marker count: {text.count(marker)}")
          text = text.replace(marker, block + marker, 1)

          marker = "    def test_mcp_proxy_rejects_oversized_upstream_line_before_newline(self) -> None:\n"
          block = '''    def test_mcp_proxy_rejects_unterminated_upstream_frame(self) -> None:
              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  upstream = root / "mcp.py"
                  response = {
                      "jsonrpc": "2.0",
                      "id": 1,
                      "result": {"tools": treatment_tools()},
                  }
                  upstream.write_text(
                      "import json, sys\\n"
                      "sys.stdin.readline()\\n"
                      f"sys.stdout.write(json.dumps({response!r})); sys.stdout.flush()\\n",
                      encoding="utf-8",
                  )
                  payload = json.dumps(
                      {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}
                  ).encode() + b"\\n"
                  completed = subprocess.run(
                      [
                          sys.executable,
                          str(MODULE_PATH),
                          "--codex-mcp-proxy",
                          json.dumps([sys.executable, str(upstream)]),
                      ],
                      input=payload,
                      capture_output=True,
                      check=False,
                      timeout=5,
                  )
                  self.assertNotEqual(completed.returncode, 0)
                  self.assertIn(b"newline terminated", completed.stderr)

'''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit(f"frame test marker count: {text.count(marker)}")
          text = text.replace(marker, block + marker, 1)

          marker = "    def test_resource_freeze_rejects_pagination_and_duplicates(self) -> None:\n"
          block = '''    def test_normalize_rejects_boolean_token_counts(self) -> None:
              for field, value in (("input_tokens", True), ("output_tokens", False)):
                  with self.subTest(field=field, value=value):
                      events = [json.loads(line) for line in stream(request()).splitlines()]
                      completed = next(
                          event for event in events if event.get("type") == "turn.completed"
                      )
                      completed["usage"][field] = value
                      with self.assertRaisesRegex(runner.RunnerError, "Codex usage is invalid"):
                          runner.normalize(request(), events)

'''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit(f"usage test marker count: {text.count(marker)}")
          text = text.replace(marker, block + marker, 1)

          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile tests/test_repobrief_agent_benchmark_codex_runner.py

      - name: Prove regressions fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_treatment_tools_require_exact_model_visible_descriptors \
            test_mcp_proxy_rejects_unterminated_upstream_frame \
            test_normalize_rejects_boolean_token_counts
          do
            set +e
            python3 -m unittest "tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.${test}" >"/tmp/${test}.log" 2>&1
            status=$?
            set -e
            cat "/tmp/${test}.log"
            if [ "$status" -eq 0 ]; then
              echo "Regression unexpectedly passed before implementation: $test" >&2
              exit 1
            fi
            grep -Eq "AssertionError|FAIL:|FAILED" "/tmp/${test}.log"
          done

      - name: Apply fail-closed implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/repobrief_agent_benchmark_codex_runner.py")
          text = path.read_text(encoding="utf-8")

          anchor = 'MCP_CLIENT_METHODS = {"initialize", "notifications/initialized", "ping", "tools/list", "tools/call"}\n'
          descriptors = '''_REPOGROUND_READ_ANNOTATIONS: dict[str, bool] = {
              "readOnlyHint": True,
              "destructiveHint": False,
              "idempotentHint": True,
          }
          EXPECTED_UPSTREAM_MCP_DESCRIPTORS: dict[str, dict[str, Any]] = {
              "ask_context": {
                  "name": "ask_context",
                  "title": "RepoGround context pack",
                  "description": "Build a cited context pack from one existing RepoGround bundle.",
                  "inputSchema": EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS["ask_context"],
                  "annotations": _REPOGROUND_READ_ANNOTATIONS,
              },
              "grounding_verify": {
                  "name": "grounding_verify",
                  "title": "RepoGround grounding verifier",
                  "description": "Verify declared citations and ranges against an existing RepoGround bundle.",
                  "inputSchema": EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS["grounding_verify"],
                  "annotations": _REPOGROUND_READ_ANNOTATIONS,
              },
              "live_freshness": {
                  "name": "live_freshness",
                  "title": "RepoGround live freshness",
                  "description": "Compare snapshot Git provenance with the configured local checkout without refreshing it.",
                  "inputSchema": EXPECTED_UPSTREAM_MCP_INPUT_SCHEMAS["live_freshness"],
                  "annotations": _REPOGROUND_READ_ANNOTATIONS,
              },
          }
          '''.replace("          ", "")
          if text.count(anchor) != 1:
              raise SystemExit(f"descriptor anchor count: {text.count(anchor)}")
          text = text.replace(anchor, descriptors + anchor, 1)

          old = '''            counts[str(name)] += 1
                      filtered.append(item)
          '''.replace("          ", "")
          new = '''            expected_descriptor = EXPECTED_UPSTREAM_MCP_DESCRIPTORS[str(name)]
                      if canonical(item) != canonical(expected_descriptor):
                          raise RunnerError(
                              f"RepoGround treatment tool descriptor drifted for {name}"
                          )
                      counts[str(name)] += 1
                      filtered.append(json.loads(json.dumps(expected_descriptor)))
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit(f"descriptor filter preimage count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    if len(raw) > base.MAX_MCP_MESSAGE_BYTES:
              raise RunnerError(f"MCP {peer} message too large")
              return raw
          '''.replace("          ", "")
          new = '''    if len(raw) > base.MAX_MCP_MESSAGE_BYTES:
              raise RunnerError(f"MCP {peer} message too large")
              if raw and not raw.endswith(b"\\n"):
                  raise RunnerError(f"MCP {peer} message must be newline terminated")
              return raw
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit(f"MCP reader preimage count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        not isinstance(input_tokens, int)
              or input_tokens < 0
              or not isinstance(output_tokens, int)
              or output_tokens < 0
          '''.replace("          ", "")
          new = '''        not isinstance(input_tokens, int)
              or isinstance(input_tokens, bool)
              or input_tokens < 0
              or not isinstance(output_tokens, int)
              or isinstance(output_tokens, bool)
              or output_tokens < 0
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit(f"usage preimage count: {text.count(old)}")
          text = text.replace(old, new, 1)

          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile tools/repobrief_agent_benchmark_codex_runner.py

      - name: Validate remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_treatment_tools_require_exact_model_visible_descriptors
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_mcp_proxy_rejects_unterminated_upstream_frame
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner.RepoBriefCodexRunnerTests.test_normalize_rejects_boolean_token_counts
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner
          git diff --check
          python3 tools/check_no_secrets.py

      - name: Publish code-only fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py
          git commit -m "fix(rab): bind final treatment evidence edges"
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
          rm .github/workflows/pr1227-final-review-remediation.yml
          git add -u .github/workflows/pr1227-final-review-remediation.yml
          git commit -m "ci(pr1227): remove temporary remediation workflow"
          git push origin HEAD:fix/rab-codex-stderr-contract-20260915
