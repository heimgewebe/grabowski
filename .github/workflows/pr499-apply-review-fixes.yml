              self.assertEqual(2, events.count(f"stop:{dual.OPERATOR_SERVICE}"))
              release.assert_not_called()
              self.assertIn('"operator_admission": "failed"', str(raised.exception))

          '''
          replace_once(
              "tests/test_dual_service_deploy.py",
              "    def test_rollback_stops_both_restores_then_starts_operator_before_tunnel(self) -> None:\n",
              rollback_tests
              + "    def test_rollback_stops_both_restores_then_starts_operator_before_tunnel(self) -> None:\n",
          )
          PY

      - name: Validate exact modified tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m pytest -q tests/test_dual_service_deploy.py tests/test_operator_contract.py tests/test_self_deploy.py
          make validate

      - name: Commit fixes and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr499-apply-review-fixes.yml
          git add docs/generated/operator-context.v1.json docs/runtime-deployment-admission-drain-v1.md src/grabowski_operator.py tests/test_dual_service_deploy.py tools/deploy_runtime_dual.py
          git diff --cached --check
          git commit -m 'fix: close deployment admission rollback gaps'
          git push origin HEAD:refs/heads/fix/runtime-deploy-admission-drain-v1
