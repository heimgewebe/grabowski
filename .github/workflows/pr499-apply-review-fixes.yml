name: pr499-apply-review-fixes

on:
  push:
    branches:
      - fix/runtime-deploy-admission-drain-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage PR 499 review fix applicator'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify applicator ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7803616b187cd3c8c9a65bca74884cb53eea5a1a"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr499-apply-review-fixes.yml"

      - name: Apply exact review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          replace_once(
              "tools/deploy_runtime_dual.py",
              '''OPERATOR_ADMISSION_MARKER_MAX_LIFETIME_SECONDS = 600
          OPERATOR_ADMISSION_TIMEOUT_WINDOWS = 8
          OPERATOR_ADMISSION_RECOVERY_MARGIN_SECONDS = 120
          ''',
              '''OPERATOR_ADMISSION_MARKER_MAX_LIFETIME_SECONDS = 1800
          OPERATOR_ADMISSION_MAX_TIMEOUT_SECONDS = 120
          OPERATOR_ADMISSION_DYNAMIC_TIMEOUT_WINDOWS = 6
          OPERATOR_ADMISSION_STOP_OPERATIONS = 6
          OPERATOR_ADMISSION_START_OPERATIONS = 4
          OPERATOR_ADMISSION_SYSTEMD_QUERY_WINDOWS = 12
          OPERATOR_ADMISSION_RECOVERY_MARGIN_SECONDS = 120
          ''',
          )

          replace_once(
              "tools/deploy_runtime_dual.py",
              '''def _operator_admission_marker_lifetime_seconds(timeout_seconds: int) -> int:
              if (
                  not isinstance(timeout_seconds, int)
                  or isinstance(timeout_seconds, bool)
                  or timeout_seconds <= 0
              ):
                  core.fail(
                      "Deployment-Admission-Timeout muss positiv und ganzzahlig sein",
                      phase="operator-admission-marker",
                  )
              required = (
                  timeout_seconds * OPERATOR_ADMISSION_TIMEOUT_WINDOWS
                  + OPERATOR_ADMISSION_RECOVERY_MARGIN_SECONDS
              )
              if required > OPERATOR_ADMISSION_MARKER_MAX_LIFETIME_SECONDS:
                  core.fail(
                      "Deployment-Admission-Marker kann den vollständigen Deployment- und Recovery-Ablauf nicht abdecken",
                      phase="operator-admission-marker",
                      details={
                          "timeout_seconds": timeout_seconds,
                          "timeout_windows": OPERATOR_ADMISSION_TIMEOUT_WINDOWS,
                          "recovery_margin_seconds": OPERATOR_ADMISSION_RECOVERY_MARGIN_SECONDS,
                          "required_lifetime_seconds": required,
                          "maximum_lifetime_seconds": OPERATOR_ADMISSION_MARKER_MAX_LIFETIME_SECONDS,
                      },
                  )
              return required
          ''',
