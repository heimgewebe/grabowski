                          "start_operations": OPERATOR_ADMISSION_START_OPERATIONS,
                          "systemd_query_windows": OPERATOR_ADMISSION_SYSTEMD_QUERY_WINDOWS,
                          "recovery_margin_seconds": OPERATOR_ADMISSION_RECOVERY_MARGIN_SECONDS,
                          "required_lifetime_seconds": required,
                          "maximum_lifetime_seconds": OPERATOR_ADMISSION_MARKER_MAX_LIFETIME_SECONDS,
                      },
                  )
              return required
          ''',
          )

          replace_once(
              "tools/deploy_runtime_dual.py",
              '''        except FileNotFoundError:
                      return
                  opened = os.fstat(descriptor)
          ''',
              '''        except FileNotFoundError:
                      core.fail(
                          "Deployment-Admission-Marker fehlt vor Freigabe",
                          phase="operator-admission-marker-release",
                          details={"reason": "marker-missing"},
                      )
                  opened = os.fstat(descriptor)
          ''',
          )

          replace_once(
              "tools/deploy_runtime_dual.py",
              '''    operator_start_ok, started_operator = step("start-operator", lambda: start_service(OPERATOR_SERVICE))
              identity_ok = False
              identity = None
              if operator_start_ok and started_operator is not None:
                  identity_ok, identity = step("verify-operator", lambda: verify_operator_process(activation.runtime, contract))
              listener_ok = False
              listener = None
              if identity_ok and identity is not None:
                  listener_ok, listener = step("operator-listener", lambda: require_operator_listener(timeout_seconds=timeout_seconds))
              tunnel_start_ok = False
              started_tunnel = None
              if listener_ok and listener is not None:
                  tunnel_start_ok, started_tunnel = step("start-tunnel", lambda: start_service(TUNNEL_SERVICE))
              ready_ok = False
              ready = None
              if tunnel_start_ok and started_tunnel is not None:
                  ready_ok, ready = step("readiness", lambda: wait_until_ready(timeout_seconds))
                  if ready_ok and isinstance(ready, DualReadiness) and not ready.ok:
                      errors.append({"phase": "readiness", "message": "Wiederhergestellte Runtime wurde nicht ready", "result": ready.to_dict()})
                      ready_ok = False
          ''',
              '''    operator_start_ok, started_operator = step("start-operator", lambda: start_service(OPERATOR_SERVICE))
              identity_ok = False
              identity = None
              if operator_start_ok and started_operator is not None:
                  identity_ok, identity = step("verify-operator", lambda: verify_operator_process(activation.runtime, contract))
              listener_ok = False
              listener = None
              if identity_ok and identity is not None:
                  listener_ok, listener = step("operator-listener", lambda: require_operator_listener(timeout_seconds=timeout_seconds))
              admission_ok = admission_marker is None
              admission = None
              if listener_ok and listener is not None and admission_marker is not None:
                  admission_ok, admission = step(
                      "operator-admission-replacement-guard",
                      lambda: verify_operator_deployment_admission(admission_marker),
                  )
                  if not admission_ok:
                      step(
                          "stop-operator-after-admission-failure",
                          lambda: stop_service(OPERATOR_SERVICE),
                      )
              tunnel_start_ok = False
              started_tunnel = None
              if listener_ok and listener is not None and admission_ok:
                  tunnel_start_ok, started_tunnel = step("start-tunnel", lambda: start_service(TUNNEL_SERVICE))
                  if tunnel_start_ok and started_tunnel is not None and admission_marker is not None:
                      admission_ok, admission = step(
                          "operator-admission-post-tunnel-guard",
                          lambda: verify_operator_deployment_admission(admission_marker),
                      )
                      if not admission_ok:
                          step(
                              "stop-tunnel-after-admission-drift",
                              lambda: stop_service(TUNNEL_SERVICE),
                          )
                          step(
                              "stop-operator-after-admission-drift",
                              lambda: stop_service(OPERATOR_SERVICE),
                          )
                          tunnel_start_ok = False
                          started_tunnel = None
              ready_ok = False
              ready = None
              if tunnel_start_ok and started_tunnel is not None:
                  ready_ok, ready = step("readiness", lambda: wait_until_ready(timeout_seconds))
                  if ready_ok and isinstance(ready, DualReadiness) and not ready.ok:
                      errors.append({"phase": "readiness", "message": "Wiederhergestellte Runtime wurde nicht ready", "result": ready.to_dict()})
                      ready_ok = False
          ''',
          )

          replace_once(
              "tools/deploy_runtime_dual.py",
              '''        "operator_identity": "verified" if identity_ok and identity is not None else "failed",
                  "readiness": "verified" if ready_ok and isinstance(ready, DualReadiness) and ready.ok else "failed",
          ''',
              '''        "operator_identity": "verified" if identity_ok and identity is not None else "failed",
                  "operator_admission": "verified" if admission_ok else "failed",
                  "readiness": "verified" if ready_ok and isinstance(ready, DualReadiness) and ready.ok else "failed",
          ''',
          )

          replace_once(
              "tools/deploy_runtime_dual.py",
              '''        phase = "operator-listener"
                  require_operator_listener(timeout_seconds=timeout_seconds)

                  phase = "start-tunnel"
                  start_service(TUNNEL_SERVICE)
                  verify_tunnel_process()

                  phase = "readiness"
          ''',
              '''        phase = "operator-listener"
                  require_operator_listener(timeout_seconds=timeout_seconds)
                  phase = "operator-admission-replacement-guard"
                  verify_operator_deployment_admission(admission_marker)

                  phase = "start-tunnel"
                  start_service(TUNNEL_SERVICE)
                  verify_tunnel_process()
                  phase = "operator-admission-post-tunnel-guard"
                  verify_operator_deployment_admission(admission_marker)

                  phase = "readiness"
          ''',
          )

          replace_once(
              "src/grabowski_operator.py",
              "DEPLOYMENT_ADMISSION_MAX_LIFETIME_SECONDS = 600\n",
              "DEPLOYMENT_ADMISSION_MAX_LIFETIME_SECONDS = 1800\n",
          )

          operator_sha = hashlib.sha256(Path("src/grabowski_operator.py").read_bytes()).hexdigest()
          if operator_sha != "90d90837977a7180b6a5dfc9f7e30849de2bea3384206ac53b3ce53b8d24e5cb":
              raise SystemExit(f"unexpected operator source hash: {operator_sha}")
          replace_once(
              "docs/generated/operator-context.v1.json",
              '"src/grabowski_operator.py": "cc02c3019ce92b6150b55000e017994227f7b506fe95a7867149e96fe970eddb"',
              f'"src/grabowski_operator.py": "{operator_sha}"',
          )

          replace_once(
              "docs/runtime-deployment-admission-drain-v1.md",
              "The deployer creates `~/.local/state/grabowski/deployment-admission-drain.json` with create-only semantics, mode `0600`, no symlink following, one link, owner UID binding, a maximum ten-minute lifetime and exact fields for token, expected repository head, source-identity digest and timestamps. Its lifetime covers eight bounded deployment/recovery timeout windows plus a 120-second recovery margin. A requested timeout that cannot fit inside the ten-minute marker contract is rejected before publication. Existing active, malformed or foreign markers fail closed. Expired valid markers may be removed only through the same token-, identity- and inode-bound release path.",
              "The deployer creates `~/.local/state/grabowski/deployment-admission-drain.json` with create-only semantics, mode `0600`, no symlink following, one link, owner UID binding, a maximum thirty-minute lifetime and exact fields for token, expected repository head, source-identity digest and timestamps. Its lifetime is derived from all six dynamic deployment/recovery waits, six stop operations, four start operations, twelve bounded systemd-query windows and a 120-second recovery margin. Deploy timeouts above 120 seconds or a derived lifetime above thirty minutes are rejected before publication. Existing active, malformed or foreign markers fail closed. Expired valid markers may be removed only through the same token-, identity- and inode-bound release path.",
          )
          replace_once(
              "docs/runtime-deployment-admission-drain-v1.md",
              '''7. Stop tunnel, then operator; activate and verify the new runtime.
          8. Release the marker only after the new runtime is healthy and identity-bound.
          ''',
              '''7. Stop tunnel, then operator; activate and start the replacement operator.
          8. Require the replacement operator to attest the exact active marker before the tunnel starts and again immediately after tunnel startup.
          9. Release the marker only after the new runtime is healthy and identity-bound; marker absence is drift, never success.
          ''',
          )
          replace_once(
              "docs/runtime-deployment-admission-drain-v1.md",
              "Before service stop, failure releases the exact marker and leaves the healthy runtime untouched. After service stop, rollback restores the previous pointer and services, verifies identity and readiness, then releases the marker. If rollback cannot restore a healthy operator, the marker remains until its bounded expiry so new effects stay blocked rather than running in an unclear state.",
              "Before service stop, failure releases the exact marker and leaves the healthy runtime untouched. After service stop, rollback restores the previous pointer and operator, then requires that restored operator to attest the exact active marker before the tunnel may restart. A predecessor runtime without the admission contract therefore remains fail-closed with both the tunnel and restored loopback operator stopped instead of admitting work during an incomplete rollback. Only a marker-aware, identity- and readiness-verified rollback may release the marker. Missing or drifted markers are failures, not successful cleanup.",
          )

          replace_once(
              "tests/test_dual_service_deploy.py",
              '''    def test_marker_lifetime_covers_forward_and_recovery_windows(self) -> None:
                  self.assertEqual(
                      440,
                      dual._operator_admission_marker_lifetime_seconds(40),
                  )
                  self.assertEqual(
                      dual.OPERATOR_ADMISSION_MARKER_MAX_LIFETIME_SECONDS,
                      dual._operator_admission_marker_lifetime_seconds(60),
                  )
                  with self.assertRaises(core.DeployError) as raised:
                      dual._operator_admission_marker_lifetime_seconds(61)
                  self.assertEqual("operator-admission-marker", raised.exception.phase)
                  self.assertEqual(
                      608,
                      raised.exception.details["required_lifetime_seconds"],
                  )
          ''',
              '''    def test_marker_lifetime_covers_forward_and_recovery_windows(self) -> None:
                  self.assertEqual(
                      1080,
                      dual._operator_admission_marker_lifetime_seconds(40),
                  )
                  self.assertEqual(
                      1200,
                      dual._operator_admission_marker_lifetime_seconds(60),
                  )
                  self.assertEqual(
                      1560,
                      dual._operator_admission_marker_lifetime_seconds(120),
                  )
                  with self.assertRaises(core.DeployError) as raised:
                      dual._operator_admission_marker_lifetime_seconds(121)
                  self.assertEqual("operator-admission-marker", raised.exception.phase)
                  self.assertEqual(
                      120,
                      raised.exception.details["maximum_timeout_seconds"],
                  )
          ''',
          )
          replace_once(
              "tests/test_dual_service_deploy.py",
              '''                self.assertEqual("f" * 64, marker["token"])
                          self.assertEqual(540, marker["expires_at_unix"])
                          self.assertEqual(marker, json.loads(marker_path.read_text()))
                          dual.release_operator_deployment_admission(marker)
                          self.assertFalse(marker_path.exists())

              def test_marker_creation_is_create_only_and_rejects_symlink(self) -> None:
          ''',
              '''                self.assertEqual("f" * 64, marker["token"])
                          self.assertEqual(1180, marker["expires_at_unix"])
                          self.assertEqual(marker, json.loads(marker_path.read_text()))
                          dual.release_operator_deployment_admission(marker)
                          self.assertFalse(marker_path.exists())

              def test_marker_release_rejects_absence_after_publication(self) -> None:
                  marker = self.marker()
                  with tempfile.TemporaryDirectory() as directory:
                      marker_path = Path(directory) / "deployment-admission-drain.json"
                      with mock.patch.object(
                          dual, "OPERATOR_ADMISSION_MARKER_PATH", marker_path
                      ):
                          with self.assertRaises(core.DeployError) as raised:
                              dual.release_operator_deployment_admission(marker)
                  self.assertEqual(
                      "operator-admission-marker-release", raised.exception.phase
                  )
                  self.assertEqual("marker-missing", raised.exception.details["reason"])

              def test_marker_creation_is_create_only_and_rejects_symlink(self) -> None:
          ''',
          )
          replace_once(
              "tests/test_dual_service_deploy.py",
              '''        for patcher in self._admission_patchers:
                      patcher.start()
                      self.addCleanup(patcher.stop)


              def snapshot(self):
          ''',
              '''        for patcher in self._admission_patchers:
                      patcher.start()
                      self.addCleanup(patcher.stop)
                  self._verify_admission_patcher = mock.patch.object(
                      dual,
                      "verify_operator_deployment_admission",
