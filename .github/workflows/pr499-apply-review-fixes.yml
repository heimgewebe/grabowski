                      )
              self.assertEqual(
                  [
                      f"stop:{dual.TUNNEL_SERVICE}",
                      f"stop:{dual.OPERATOR_SERVICE}",
                      "restore",
                      "verify:pointer",
                      f"start:{dual.OPERATOR_SERVICE}",
