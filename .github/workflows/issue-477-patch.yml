---
name: Apply issue 477 watchdog patch

on:
  push:
    branches: [fix/watchdog-stale-poll-restart-v1]

permissions:
  contents: write

concurrency:
  group: issue-477-watchdog-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: fix/watchdog-stale-poll-restart-v1
          fetch-depth: 0

      - name: Apply exact production and contract changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          production = Path("tools/component_watchdog.py")
          text = production.read_text(encoding="utf-8")
          old = '''            if poll_failure in {
              "control-plane-metrics-unavailable",
              "control-plane-poll-missing",
              "control-plane-poll-stale",
              "control-plane-poll-timestamp-invalid",
          } and not reasons:
          '''
          new = '''            if poll_failure in {
              "control-plane-metrics-unavailable",
              "control-plane-poll-missing",
              "control-plane-poll-timestamp-invalid",
          } and not reasons:
          '''
          if text.count(old) != 1:
              raise SystemExit("production poll-classification block is not unique")
          production.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_component_watchdog.py")
          text = tests.read_text(encoding="utf-8")
          old_name = "    def test_stale_poll_is_indeterminate_not_restartable(self) -> None:\n"
          new_name = "    def test_stale_poll_is_unhealthy_and_enters_restart_path(self) -> None:\n"
          if text.count(old_name) != 1:
              raise SystemExit("stale-poll contract test name is not unique")
          text = text.replace(old_name, new_name, 1)

          old_assertions = '''        self.assertEqual("indeterminate", result.status)
          self.assertEqual(("control-plane-poll-stale",), result.reasons)
          '''
          new_assertions = '''        self.assertEqual("unhealthy", result.status)
          self.assertEqual(("control-plane-poll-stale",), result.reasons)

          state = watchdog.WatchdogState()
          actions = []
          for now in (1_000, 1_030, 1_060):
              action, state = watchdog.decide(
                  state,
                  now=now,
                  failure_threshold=3,
                  max_restarts=3,
                  restart_window=900,
                  jitter_source=lambda: 0.0,
              )
              actions.append(action)
          self.assertEqual(["observe", "observe", "restart"], actions)
          self.assertEqual(1, state.restart_generation)
          self.assertEqual([1_060], state.restart_timestamps)
          '''
          if text.count(old_assertions) != 1:
              raise SystemExit("stale-poll assertions are not unique")
          text = text.replace(old_assertions, new_assertions, 1)

          marker = new_name
          extra = '''    def test_missing_and_invalid_poll_evidence_remain_indeterminate(self) -> None:
          for failure in (
              "control-plane-poll-missing",
              "control-plane-poll-timestamp-invalid",
          ):
              with self.subTest(failure=failure), (
                  patch.object(
                      watchdog,
                      "service_properties",
                      return_value={
                          "LoadState": "loaded",
                          "ActiveState": "active",
                          "SubState": "running",
                          "MainPID": "321",
                      },
                  ),
                  patch.object(watchdog, "process_start_ticks", return_value=77),
                  patch.object(watchdog, "process_age_seconds", return_value=120.0),
                  patch.object(watchdog, "tunnel_identity_ok", return_value=True),
                  patch.object(watchdog, "get_probe", return_value=True),
                  patch.object(
                      watchdog,
                      "control_plane_poll_probe",
                      return_value=failure,
                  ),
              ):
                  result = watchdog.probe_component(
                      component="tunnel",
                      service="tunnel-client-grabowski.service",
                      runtime_root=Path("/runtime"),
                      module="grabowski_operator",
                      profile="grabowski",
                      host="127.0.0.1",
                      port=18181,
                      health_url=watchdog.DEFAULT_HEALTH_URL,
                      ready_url=watchdog.DEFAULT_READY_URL,
                      startup_grace=20,
                      http_timeout=2,
                  )
              self.assertEqual("indeterminate", result.status)
              self.assertEqual((failure,), result.reasons)

          '''
          if text.count(marker) != 1:
              raise SystemExit("stale-poll insertion marker is not unique")
          text = text.replace(marker, extra + marker, 1)
          tests.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused watchdog contract
        run: |
          set -euo pipefail
          python3 -m py_compile tools/component_watchdog.py tests/test_component_watchdog.py
          python3 -m unittest tests.test_component_watchdog.ControlPlanePollProbeTests -v
          git diff --check

      - name: Commit patch and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/issue-477-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/component_watchdog.py tests/test_component_watchdog.py .github/workflows/issue-477-patch.yml
          git commit -m "fix(watchdog): restart stale control-plane polls"
          git push origin HEAD:fix/watchdog-stale-poll-restart-v1
