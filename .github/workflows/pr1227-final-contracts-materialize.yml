name: PR1227 final contracts native materializer

on:
  push:
    branches:
      - ops/pr1227-final-contracts-20260917

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Materialize and test exact-head candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --single-branch --branch ops/pr1227-final-contracts-20260917 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          cp tools/pr1227_final_contracts_materialize.py /tmp/pr1227-final-contracts-materialize.py
          git checkout --quiet --detach 2869519465e929394f1a1f0e61051fe104b935d8
          test "$(git rev-parse HEAD)" = "2869519465e929394f1a1f0e61051fe104b935d8"
          python3 /tmp/pr1227-final-contracts-materialize.py
          python3 -m py_compile \
            tools/repobrief_agent_benchmark_codex_runner.py \
            tools/repobrief_agent_benchmark_preflight_core.py \
            tests/test_repobrief_agent_benchmark_codex_runner.py \
            tests/test_repobrief_agent_benchmark_preflight.py
          python3 -m unittest \
            tests.test_repobrief_agent_benchmark_codex_runner \
            tests.test_repobrief_agent_benchmark_preflight
          git diff --check
          python3 tools/check_no_secrets.py
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            tests/test_repobrief_agent_benchmark_codex_runner.py \
            tests/test_repobrief_agent_benchmark_preflight.py \
            tools/repobrief_agent_benchmark_codex_runner.py \
            tools/repobrief_agent_benchmark_preflight_core.py | sort)
          test "${actual}" = "${expected}"
          git config user.name "grabowski-materializer"
          git config user.email "grabowski-materializer@users.noreply.github.com"
          git add \
            tools/repobrief_agent_benchmark_codex_runner.py \
            tools/repobrief_agent_benchmark_preflight_core.py \
            tests/test_repobrief_agent_benchmark_codex_runner.py \
            tests/test_repobrief_agent_benchmark_preflight.py
          git commit -m "fix(benchmark): align Codex preflight authorization"
          test "$(git rev-parse HEAD^)" = "2869519465e929394f1a1f0e61051fe104b935d8"
          git push origin HEAD:refs/heads/ops/pr1227-candidate-final-contracts-20260917
