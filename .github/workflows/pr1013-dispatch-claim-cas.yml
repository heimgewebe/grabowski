---
name: PR1013 dispatch claim CAS

on:
  push:
    branches:
      - fix/pr1013-dispatch-claim-cas-20260901-1815

permissions:
  contents: write

concurrency:
  group: pr1013-dispatch-claim-cas
  cancel-in-progress: false

jobs:
  validate-claim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/pr1013-dispatch-claim-cas-20260901-1815

      - name: Apply dispatch claim protocol
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            git merge-base --is-ancestor d9ded24c25054f3b389842f52bc8c4c9cebbb040 HEAD
            test -z "$(git diff --name-only d9ded24c25054f3b389842f52bc8c4c9cebbb040 HEAD -- src/grabowski_tasks.py tests/test_tasks.py)"
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr1013_dispatch_claim_patch.py')
          source = path.read_text()
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected one match, got {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if label == "task row dispatch owner" and count == 2:\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise SystemExit(f"{label}: expected one match, got {count}")\n    return text.replace(old, new, 1)\n'''
          if source.count(old) != 1:
              raise SystemExit('diagnostic replace_once anchor changed')
          path.write_text(source.replace(old, new, 1))
          PY
            python3 .github/pr1013_dispatch_claim_patch.py
            git checkout -- .github/pr1013_dispatch_claim_patch.py
            git diff --check
            changed="$(git diff --name-only -- src/grabowski_tasks.py tests/test_tasks.py)"
            while IFS= read -r path; do
              case "$path" in
                src/grabowski_tasks.py|tests/test_tasks.py) ;;
                "") ;;
                *) echo "unexpected source patch path: $path" >&2; exit 65 ;;
              esac
            done <<< "$changed"
          ) >/tmp/pr1013-apply.out 2>/tmp/pr1013-apply.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "exit_code=$rc"
              echo "--- stdout ---"
              cat /tmp/pr1013-apply.out
              echo "--- stderr ---"
              cat /tmp/pr1013-apply.err
            } > .github/pr1013_patch_error.txt
            cat .github/pr1013_patch_error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/pr1013_patch_error.txt
            git commit -m 'chore: capture PR1013 patch error [skip ci]'
            git push origin HEAD:fix/pr1013-dispatch-claim-cas-20260901-1815
            exit "$rc"
          fi
          cat /tmp/pr1013-apply.out
          cat /tmp/pr1013-apply.err >&2

      - name: Validate repository
        run: make validate

      - name: Commit validated claim protocol
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr1013-dispatch-claim-cas.yml .github/pr1013_dispatch_claim_patch.py .github/pr1013_patch_error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/grabowski_tasks.py tests/test_tasks.py
          git diff --cached --check
          git commit -m 'fix: claim runtime-refresh dispatch before launch'
          git push origin HEAD:fix/pr1013-dispatch-claim-cas-20260901-1815
