name: Apply PR 514 review hardening v2

on:
  push:
    branches:
      - fix/pr514-review-followup-v1

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact follow-up branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pr514-review-followup-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Apply deterministic patch
        run: python tools/pr514_review_fix.py

      - name: Regenerate contracts
        run: make context-refresh PYTHON=python3

      - name: Check patch formatting
        run: git diff --check

      - name: Run reconciliation regressions
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_text_artifact_reconcile

      - name: Commit review fixes and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr514-review-fix.yml
          git rm .github/workflows/pr514-review-fix-v2.yml
          git rm tools/pr514_review_fix.py
          git rm .pr514-review-fix-trigger
          git add config/runtime-entrypoint.json contracts/capability-catalog.v1.json contracts/publication-profiles.v1.json docs/generated/operator-context.v1.json docs/generated/operator-context.md docs/text-artifact-export.md pyproject.toml src/grabowski_text_artifact_reconcile.py tests/test_text_artifact_reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden text artifact reconciliation"
          git push origin HEAD:fix/pr514-review-followup-v1
