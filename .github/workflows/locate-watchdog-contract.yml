name: locate-watchdog-contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Extract bounded unit-test failure
        run: |
          set +e
          make test >"$RUNNER_TEMP/test.log" 2>&1
          rc=$?
          set -e
          python3 - "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/watchdog-diagnosis.txt" "$rc" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          exit_code = int(sys.argv[3])
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          pattern = re.compile(
              r"DurableSystemdContractTests|"
              r"test_watchdog_cadence_matches_probe_cost|"
              r"OnUnitActiveSec|FAIL:|ERROR:|AssertionError"
          )
          selected = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(
                      range(max(0, index - 12), min(len(lines), index + 24))
                  )
          output = [f"TEST_EXIT={exit_code}"]
          for index in sorted(selected):
              output.append(f"{index + 1:05d}: {lines[index]}")
          if not selected:
              output.append("NO_MATCHING_FAILURE_CONTEXT")
              start = max(0, len(lines) - 160)
              output.extend(
                  f"{index + 1:05d}: {lines[index]}"
                  for index in range(start, len(lines))
              )
          target.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
      - name: Upload bounded diagnosis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: watchdog-contract-diagnosis
          path: ${{ runner.temp }}/watchdog-diagnosis.txt
          retention-days: 1
          if-no-files-found: error
