name: locate-watchdog-contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Locate durable systemd contract
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          revision = os.environ["REVISION"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          tree = get(
              f"https://api.github.com/repos/{repository}/git/trees/{revision}?recursive=1"
          )
          needles = (
              "class DurableSystemdContractTests",
              "test_watchdog_cadence_matches_probe_cost",
          )
          matches = 0
          for item in tree.get("tree", []):
              path = item.get("path", "")
              if (
                  item.get("type") != "blob"
                  or not path.startswith("tests/")
                  or not path.endswith(".py")
              ):
                  continue
              blob = get(item["url"])
              if blob.get("encoding") != "base64":
                  continue
              text = base64.b64decode(blob["content"]).decode("utf-8")
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if not any(needle in line for needle in needles):
                      continue
                  matches += 1
                  start = max(0, index - 8)
                  end = min(len(lines), index + 24)
                  print(f"MATCH {path}:{index + 1}")
                  for number in range(start, end):
                      print(f"{number + 1:04d}: {lines[number]}")
          if matches == 0:
              raise SystemExit("contract not found")
          PY
