name: PR 1013 exact-head autopatch

on:
  push:
    branches:
      - operator/pr1013-autopatch-20260901-1428

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact target preimage
        env:
          EXPECTED_HEAD: 86c85125b8ac0230112860cf494a3ac4f8509b7c
          TARGET_BRANCH: fix/runtime-refresh-executor-lease-recovery-v5-20260901
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_HEAD" HEAD
          git diff --quiet "$EXPECTED_HEAD" -- src/grabowski_tasks.py tests/test_tasks.py
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"

      - name: Apply narrow review fix
        run: |
          set -euo pipefail
          python3 .operator/pr1013_patch.py
          git diff --check
          git diff -- src/grabowski_tasks.py tests/test_tasks.py

      - name: Focused runtime-refresh tests
        run: python3 -m pytest -q tests/test_resources.py tests/test_tasks.py -k runtime_refresh

      - name: Full repository validation
        run: make validate

      - name: Commit and CAS-publish to PR branch
        env:
          EXPECTED_HEAD: 86c85125b8ac0230112860cf494a3ac4f8509b7c
          TARGET_BRANCH: fix/runtime-refresh-executor-lease-recovery-v5-20260901
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm .github/workflows/pr1013-exact-head-autopatch.yml .operator/pr1013_patch.py
          git diff --check
          git config user.name "heimgewebe-operator"
          git config user.email "operator@localhost"
          git add -A
          git commit -m "fix: preserve runtime-refresh prelaunch rollback authority"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
