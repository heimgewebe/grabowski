name: PR 474 finalizer v2

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/codex-review-settled-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Select one-shot invocation
        id: gate
        env:
          EXPECTED_PARENT: f6db91b02df18110659a8ad59589693b6e43f030
        run: |
          if [ "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact reviewed non-workflow patch
        if: steps.gate.outputs.run == 'true'
        env:
          EXPECTED_PATCH_SHA256: 14d0c87285515f2e4159cd30dacc0353c1bfc59f1bef101f77cb95fe2053c89e
          PATCH_GZIP_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_B64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/pr474-nonworkflow.patch"
          test "$(sha256sum "$RUNNER_TEMP/pr474-nonworkflow.patch" | cut -d' ' -f1)" = "$EXPECTED_PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/pr474-nonworkflow.patch"
          git apply --index "$RUNNER_TEMP/pr474-nonworkflow.patch"
          make context-refresh
          git diff --check

      - name: Validate complete repository
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          make validate
          make deploy-check

      - name: Commit and push validated non-workflow tree
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git add docs src tests tools
          test -n "$(git status --short -- docs src tests tools)"
          git commit -m "fix(review): bind duplicate reactions in settlement"
          git push origin HEAD:fix/codex-review-settled-v1
