name: PR 474 finalizer v2

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/codex-review-settled-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact reviewed patch
        env:
          EXPECTED_PARENT: da2698a00236e916b1f54eaf868cddeb53e798cd
          EXPECTED_PATCH_SHA256: 891f314a391a50840535fd8a5ff5bb7a2dd112298fb67f6d8cb8b3484906b6d6
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "fix/codex-review-settled-v1"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          source = Path('.github/workflows/validate.yml').read_text(encoding='utf-8')
          for name, destination in (
              ('PATCH_GZIP_B64', Path('/tmp/pr474-code.patch')),
              ('NORMAL_VALIDATE_GZIP_B64', Path('/tmp/validate.yml')),
          ):
              match = re.search(rf'^          {name}: ([A-Za-z0-9+/=]+)$', source, re.MULTILINE)
              if match is None:
                  raise SystemExit(f'missing embedded payload: {name}')
              destination.write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          test "$(sha256sum /tmp/pr474-code.patch | cut -d' ' -f1)" = "$EXPECTED_PATCH_SHA256"
          git apply --check /tmp/pr474-code.patch
          git apply --index /tmp/pr474-code.patch
          cp /tmp/validate.yml .github/workflows/validate.yml
          rm -f .github/workflows/pr474-source-export.yml
          rm -f .github/workflows/pr474-finalizer-v2.yml
          make context-refresh
          git diff --check

      - name: Validate complete repository
        run: |
          set -euo pipefail
          make validate
          make deploy-check

      - name: Commit and push exact validated tree
        run: |
          set -euo pipefail
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git add -A
          test -n "$(git status --short)"
          git commit -m "fix(review): bind duplicate reactions and malformed outputs"
          git push origin HEAD:fix/codex-review-settled-v1
