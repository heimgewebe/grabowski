---
name: Export PR 494 reviewed diff

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: export-pr-494-reviewed-diff
  cancel-in-progress: false

jobs:
  export:
    if: github.head_ref == 'fix/codex-quota-terminal-settlement-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/codex-quota-terminal-settlement-v1
          fetch-depth: 0

      - name: Verify export preimage
        run: |
          set -euo pipefail
          product_head="6c72265a988d69059cecc2718cab169c3371a13d"
          git merge-base --is-ancestor "$product_head" HEAD
          test "$(git diff --name-only "$product_head" HEAD)" = ".github/workflows/export-pr-494-diff.yml"
          expected_paths="$(cat <<'EOF'
          .github/workflows/codex-review-settlement.yml
          docs/external-review-loop.md
          docs/generated/operator-context.v1.json
          src/grabowski_grips.py
          src/grabowski_merge_guard.py
          tests/test_codex_review_quota_terminal_contract.py
          tests/test_codex_review_settlement.py
          tests/test_codex_review_settlement_workflow.py
          tools/codex_review_settlement.py
          EOF
          )"
          actual_paths="$(git diff --name-only 08640a73ad4b8aecd9cf974082bb8efd2c67dbfc "$product_head")"
          test "$actual_paths" = "$expected_paths"

      - name: Create immutable evidence branch
        run: |
          set -euo pipefail
          base="08640a73ad4b8aecd9cf974082bb8efd2c67dbfc"
          product_head="6c72265a988d69059cecc2718cab169c3371a13d"
          evidence_branch="evidence/pr-494-final-diff-6c72265a"
          diff_file="/tmp/grabowski-pr-494-head-6c72265a.diff"
          manifest_file="/tmp/manifest.txt"

          git diff --binary --full-index "$base" "$product_head" > "$diff_file"
          test -s "$diff_file"
          diff_sha256="$(sha256sum "$diff_file" | awk '{print $1}')"
          changed_files="$(git diff --name-only "$base" "$product_head" | wc -l | tr -d ' ')"
          printf '%s\n' \
            'schema_version=1' \
            'repository=heimgewebe/grabowski' \
            'pull_request=494' \
            "base_sha=$base" \
            "head_sha=$product_head" \
            "changed_files=$changed_files" \
            "diff_sha256=$diff_sha256" \
            > "$manifest_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$evidence_branch"
          git rm -rf --ignore-unmatch .
          mkdir -p evidence
          cp "$diff_file" evidence/grabowski-pr-494-head-6c72265a.diff
          cp "$manifest_file" evidence/manifest.txt
          git add evidence
          git commit -m "evidence: publish reviewed PR 494 diff"
          git push origin "HEAD:refs/heads/$evidence_branch"
