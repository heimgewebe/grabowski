name: T139 stateful session hotfix PR once

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: t139-stateful-session-hotfix-pr-once
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'fix/t139-stateful-session-hotfix-20260804' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/t139-stateful-session-hotfix-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Materialize bounded stateful transport patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/grabowski_operator.py",
              "HTTP_STATELESS_MODE = True",
              "HTTP_STATELESS_MODE = False",
          )
          replace_once(
              "src/grabowski_operator.py",
              'raise RuntimeError("FastMCP stateless HTTP mode is unavailable")',
              'raise RuntimeError("FastMCP configured an unexpected HTTP session mode")',
          )
          replace_once(
              "src/grabowski_operator.py",
              'raise RuntimeError("FastMCP stateless HTTP mode retained an idle timeout")',
              'raise RuntimeError("FastMCP operator HTTP transport retained an idle timeout")',
          )
          replace_once(
              "tests/test_operator_contract.py",
              "def test_http_transport_is_stateless_and_liveness_lock_is_bounded(self) -> None:",
              "def test_http_transport_is_stateful_without_cleanup_deadline_and_liveness_lock_is_bounded(self) -> None:",
          )
          replace_once(
              "tests/test_operator_contract.py",
              "        self.assertTrue(operator.HTTP_STATELESS_MODE)\n        self.assertTrue(operator.mcp.settings.stateless_http)",
              "        self.assertFalse(operator.HTTP_STATELESS_MODE)\n        self.assertFalse(operator.mcp.settings.stateless_http)",
          )
          replace_once(
              "tests/test_operator_contract.py",
              "        self.assertTrue(operator.mcp.session_manager.stateless)",
              "        self.assertFalse(operator.mcp.session_manager.stateless)",
          )

          docs_path = Path("docs/restart-watchdog.md")
          docs = docs_path.read_text(encoding="utf-8")
          start_marker = "Der HTTP-Transport läuft im von FastMCP bereitgestellten Stateless-Modus.\n"
          end_marker = "Die vom Tunnel\n"
          start = docs.index(start_marker)
          end = docs.index(end_marker, start)
          replacement = "\n".join([
              "Der HTTP-Transport läuft zustandsbehaftet, damit die von T139 geforderte",
              "Caller-Session-Identität über Challenge, Bestätigung und genau einen gebundenen",
              "Werkzeugeffekt stabil bleibt. Ein Idle-Timeout ist absichtlich nicht gesetzt:",
              "Die frühere feste 1.800-Sekunden-Frist erzeugte gebündelte Cleanup-Wellen, die",
              "Eventloop und Deployment-Admission blockieren konnten. Verwaiste Sitzungen",
              "enden deshalb erst mit einem Operator-Neustart; die Zahl aktiver Sitzungen ist",
              "Betriebsevidenz und muss separat beobachtet werden. Die drei transportinternen",
              "MCP-Logger und der HTTP-Server laufen auf `WARNING`, damit reguläre Request-,",
              "Access- und Cleanup-Meldungen nicht selbst synchrones Journal-Backpressure",
              "erzeugen; Warnungen und Fehler bleiben sichtbar. Weil die Härtung an die",
              "aktuell gepinnte FastMCP-Implementierung gebunden ist, verweigert der Operator",
              "den HTTP-Start, falls `custom_route`, der zustandsbehaftete Sitzungsmodus oder",
              "der Session-Erzeugungslock nicht verfügbar sind. ",
          ]) + "\n"
          docs_path.write_text(docs[:start] + replacement + docs[end:], encoding="utf-8")

          proof_lines = [
              "# T139 stateless runtime regression hotfix",
              "",
              "## Befund",
              "",
              "Der auf `cb5ba94b772d21e113abd7e2bc2ddfc391c5a1c0` deployte Operator lief mit",
              "`stateless_http=true`. FastMCP erzeugt in diesem Modus für jeden HTTP-Request ein",
              "neues `ServerSession`-Objekt. T139 bindet Challenge, Bestätigung und Verbrauch",
              "jedoch an genau dieses Objekt. Ein unmittelbar auf `begin` folgender `ack`",
              "erhielt deshalb einen anderen Scope und meldete die Challenge als fehlend.",
              "",
              "## Entscheidung",
              "",
              "Der Operator nutzt wieder zustandsbehaftete Streamable-HTTP-Sitzungen. Anders",
              "als vor Commit `e98a4adcc6afa4d830c9cd712c81579e3eacc354` wird kein fester",
              "Idle-Timeout gesetzt. Dadurch bleiben Session-Objekt und T139-Scope über die",
              "drei Aufrufe stabil, ohne die damals beobachteten gebündelten Cleanup-Wellen",
              "wieder einzuführen.",
              "",
              "## Sicherheitsgrenze",
              "",
              "Die Reparatur führt weder den globalen `shared_unlabeled`-Pool noch eine",
              "client-deklarierte Ersatzidentität wieder ein. Exakte Tool-/Argumentbindung,",
              "Runtime-Bindung, Ablaufzeit, Einmalverbrauch und Trennung verschiedener",
              "FastMCP-Sitzungen bleiben unverändert.",
              "",
              "## Restrisiko",
              "",
              "Verwaiste Sitzungen bleiben bis zum Operator-Neustart im Session-Manager. Eine",
              "spätere Härtung soll Inventar, Obergrenze und druckfreien Einzelabbau ergänzen,",
              "ohne eine gemeinsame Ablaufwelle einzuführen.",
          ]
          Path("docs/proofs/t139-stateless-runtime-regression-hotfix.md").write_text(
              "\n".join(proof_lines) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Refresh generated contracts
        run: make context-refresh
      - name: Run focused regression suite
        run: |
          python -m unittest discover -s tests -p 'test_operator_contract.py' -v
          python -m unittest discover -s tests -p 'test_transport_roundtrip.py' -v
          python -m unittest discover -s tests -p 'test_transport_gate_integration.py' -v
          git diff --check
      - name: Commit materialized hotfix
        run: |
          set -euo pipefail
          rm .github/workflows/t139-stateful-session-hotfix-once.yml
          rm .github/workflows/t139-stateful-session-hotfix-pr-once.yml
          git config user.name "alex-bot"
          git config user.email "alexdermohr+bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(transport): preserve T139 sessions in HTTP runtime [t139-stateful-applied]"
          git push origin HEAD:fix/t139-stateful-session-hotfix-20260804
