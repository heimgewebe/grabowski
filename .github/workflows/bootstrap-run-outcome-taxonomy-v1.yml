name: Bootstrap run outcome taxonomy v1

on:
  push:
    branches:
      - fix/run-outcome-taxonomy-v1-20260901

permissions:
  contents: write

concurrency:
  group: bootstrap-run-outcome-taxonomy-v1-20260901
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'heimgewebe/grabowski'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/run-outcome-taxonomy-v1-20260901
          fetch-depth: 2

      - name: Verify one-shot bootstrap preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1695b756aae678b83b790c8073601f69df105a47"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/bootstrap-run-outcome-taxonomy-v1.yml"

      - name: Apply exact two-file taxonomy patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/grabowski_chronik.py",
              '''    if state == "completed":
                  return "agent.run.completed", {"result": "completed"}
              if state in TERMINAL:
                  return "agent.run.blocked", {"result": "blocked", "blocker_code": f"task-{state.replace('_', '-')}"}
              return None
          ''',
              '''    if state == "completed":
                  return "agent.run.completed", {"result": "completed"}
              if state in {"failed", "cancelled", "timed_out", "signalled"}:
                  return f"agent.run.{state}", {"result": state}
              if state == "outcome_unknown":
                  return "agent.run.blocked", {"result": "blocked", "blocker_code": "task-outcome-unknown"}
              return None
          ''',
          )
          replace_once(
              "src/grabowski_chronik.py",
              '        "schema_version": "agent-run-event.v0",\n',
              '        "schema_version": "agent-run-event.v1",\n',
          )
          replace_once(
              "src/grabowski_chronik.py",
              '''_EVENT_BLOCKER_CODES = frozenset(
              {"task-failed", "task-cancelled", "task-timed-out", "task-signalled", "task-outcome-unknown"}
          )
          _EVENT_KIND_RESULT = {
              "agent.run.started": "started",
              "agent.run.completed": "completed",
              "agent.run.blocked": "blocked",
          }
          ''',
              '''_V0_EVENT_BLOCKER_CODES = frozenset(
              {"task-failed", "task-cancelled", "task-timed-out", "task-signalled", "task-outcome-unknown"}
          )
          _V1_EVENT_BLOCKER_CODES = frozenset({"task-outcome-unknown"})
          _V0_EVENT_KIND_RESULT = {
              "agent.run.started": "started",
              "agent.run.completed": "completed",
              "agent.run.blocked": "blocked",
          }
          _V1_EVENT_KIND_RESULT = {
              "agent.run.started": "started",
              "agent.run.completed": "completed",
              "agent.run.failed": "failed",
              "agent.run.cancelled": "cancelled",
              "agent.run.timed_out": "timed_out",
              "agent.run.signalled": "signalled",
              "agent.run.blocked": "blocked",
          }
          ''',
          )
          replace_once(
              "src/grabowski_chronik.py",
              '''def _validate_agent_run_event_shape(event: Any, *, label: str) -> None:
              """Reject anything that is not exactly the agent-run-event.v0 shape Grabowski emits."""
              if not isinstance(event, dict) or set(event) != _EVENT_TOP_LEVEL_KEYS:
                  raise ValueError(f"{label} has invalid fields")
              if event.get("schema_version") != "agent-run-event.v0":
                  raise ValueError(f"{label} has invalid schema")
              kind = event.get("kind")
              if kind not in _EVENT_KIND_RESULT:
                  raise ValueError(f"{label} has unsupported kind")
          ''',
              '''def _validate_agent_run_event_shape(event: Any, *, label: str) -> None:
              """Validate current v1 events while retaining exact legacy v0 readability."""
              if not isinstance(event, dict) or set(event) != _EVENT_TOP_LEVEL_KEYS:
                  raise ValueError(f"{label} has invalid fields")
              schema_version = event.get("schema_version")
              if schema_version == "agent-run-event.v0":
                  kind_results = _V0_EVENT_KIND_RESULT
                  blocker_codes = _V0_EVENT_BLOCKER_CODES
              elif schema_version == "agent-run-event.v1":
                  kind_results = _V1_EVENT_KIND_RESULT
                  blocker_codes = _V1_EVENT_BLOCKER_CODES
              else:
                  raise ValueError(f"{label} has invalid schema")
              kind = event.get("kind")
              if kind not in kind_results:
                  raise ValueError(f"{label} has unsupported kind")
          ''',
          )
          replace_once(
              "src/grabowski_chronik.py",
              '    expected_result = _EVENT_KIND_RESULT[kind]\n',
              '    expected_result = kind_results[kind]\n',
          )
          replace_once(
              "src/grabowski_chronik.py",
              '        if blocker_code not in _EVENT_BLOCKER_CODES:\n',
              '        if blocker_code not in blocker_codes:\n',
          )

          replace_once(
              "tests/test_chronik_agent_outbox.py",
              '        self.assertEqual(event["schema_version"], "agent-run-event.v0")\n',
              '        self.assertEqual(event["schema_version"], "agent-run-event.v1")\n',
          )
          replace_once(
              "tests/test_chronik_agent_outbox.py",
              '''    def test_completed_and_blocked_events(self):
              self.enable()
              chronik.record_task_state(record(), "completed")
              event = json.loads(self.lines()[0])
              self.assertEqual(event["kind"], "agent.run.completed")
              self.assertEqual(event["data"], {"result": "completed", "operation": "other", "task_class": "other"})
              self.tmp.cleanup()
              self.tmp = tempfile.TemporaryDirectory()
              self.root = Path(self.tmp.name)
              os.environ[chronik.STATE_ROOT_ENV] = str(self.root)
              chronik.record_task_state(record(), "failed")
              event = json.loads(self.lines()[0])
              self.assertEqual(event["kind"], "agent.run.blocked")
              self.assertEqual(event["data"], {"result": "blocked", "blocker_code": "task-failed", "operation": "other", "task_class": "other"})
          ''',
              '''    def test_terminal_events_distinguish_execution_failure_from_safety_block(self):
              cases = [
                  ("completed", "agent.run.completed", "completed", None),
                  ("failed", "agent.run.failed", "failed", None),
                  ("cancelled", "agent.run.cancelled", "cancelled", None),
                  ("timed_out", "agent.run.timed_out", "timed_out", None),
                  ("signalled", "agent.run.signalled", "signalled", None),
                  ("outcome_unknown", "agent.run.blocked", "blocked", "task-outcome-unknown"),
              ]
              for state, kind, result, blocker_code in cases:
                  with self.subTest(state=state):
                      self.tmp.cleanup()
                      self.tmp = tempfile.TemporaryDirectory()
                      self.root = Path(self.tmp.name)
                      self.enable()
                      chronik.record_task_state(record(), state)
                      event = json.loads(self.lines()[0])
                      self.assertEqual(event["schema_version"], "agent-run-event.v1")
                      self.assertEqual(event["kind"], kind)
                      self.assertEqual(event["data"]["result"], result)
                      if blocker_code is None:
                          self.assertNotIn("blocker_code", event["data"])
                      else:
                          self.assertEqual(event["data"]["blocker_code"], blocker_code)
          ''',
          )
          replace_once(
              "tests/test_chronik_agent_outbox.py",
              '''        self.assertEqual(event["data"]["task_class"], "recovery")

              def test_deduplicates_same_event(self):
          ''',
              '''        self.assertEqual(event["data"]["task_class"], "recovery")

              def test_legacy_v0_execution_failure_event_remains_readable(self):
              event = chronik.build_event(record(), "outcome_unknown")
              event["schema_version"] = "agent-run-event.v0"
              event["kind"] = "agent.run.blocked"
              event["data"]["result"] = "blocked"
              event["data"]["blocker_code"] = "task-failed"
              event["event_id"] = chronik.event_id(event)
              chronik._validate_agent_run_event_shape(event, label="legacy event")

              def test_v1_nonblocked_event_rejects_legacy_blocker_code(self):
              event = chronik.build_event(record(), "failed")
              event["data"]["blocker_code"] = "task-failed"
              event["event_id"] = chronik.event_id(event)
              with self.assertRaisesRegex(ValueError, "unexpected blocker code"):
                  chronik._validate_agent_run_event_shape(event, label="v1 event")

              def test_deduplicates_same_event(self):
          ''',
          )
          PY

      - name: Verify focused compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q tests.test_chronik_agent_outbox tests.test_recall
          git diff --check
          git diff --name-only | sort | diff -u - <(printf '%s\n' 'src/grabowski_chronik.py' 'tests/test_chronik_agent_outbox.py')

      - name: Commit verified fix and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-run-outcome-taxonomy-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/grabowski_chronik.py tests/test_chronik_agent_outbox.py .github/workflows/bootstrap-run-outcome-taxonomy-v1.yml
          git diff --cached --check
          git commit -m "fix: emit v1 run execution outcomes"
          git push origin HEAD:fix/run-outcome-taxonomy-v1-20260901
