name: PR 474 exact main sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.base.ref == 'ops/pr474-main-sync-runner' && github.event.pull_request.head.ref == 'ops/pr474-main-sync-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Merge exact main into exact feature head
        env:
          EXPECTED_MAIN: c7630b8bc97d5ee07d15237b5a4ff84d96af4f70
          EXPECTED_FEATURE: fb5288343230c370f49f15017f790e93f5c52707
        run: |
          set -euo pipefail
          git fetch origin main fix/codex-review-settled-v1
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/fix/codex-review-settled-v1)" = "$EXPECTED_FEATURE"
          git checkout -B fix/codex-review-settled-v1 origin/fix/codex-review-settled-v1
          git config user.name "grabowski-operator"
          git config user.email "grabowski-operator@users.noreply.github.com"
          git merge --no-ff --no-edit "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_FEATURE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN"
          make context-refresh
          git diff --check HEAD^

      - name: Validate combined repository
        run: |
          set -euo pipefail
          make validate
          make deploy-check

      - name: Push exact validated merge commit
        run: |
          set -euo pipefail
          git push origin HEAD:fix/codex-review-settled-v1
