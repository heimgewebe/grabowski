name: diagnose-reposkop-v2

on:
  push:
    branches:
      - feat/reposkop-v2-consumer-binding

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Locate first failing validation target
        shell: bash
        run: |
          set -uo pipefail
          targets=(catalog-data-check syntax test policy tool-surface-budget context-check profiles-check runtime-lock deploy-tooling-check secrets)
          for target in "${targets[@]}"; do
            echo "=== $target ==="
            log="/tmp/${target}.log"
            if make "$target" >"$log" 2>&1; then
              echo "PASS $target"
            else
              rc=$?
              echo "FAIL $target rc=$rc"
              tail -n 160 "$log"
              exit "$rc"
            fi
          done
