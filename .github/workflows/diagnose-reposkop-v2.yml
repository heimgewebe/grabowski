name: finalize-reposkop-v2

on:
  push:
    branches:
      - feat/reposkop-v2-consumer-binding

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Finalize source and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/finalize_reposkop_v2_consumer.py
          git show origin/main:Makefile > Makefile
          make context-refresh
          rm -f \
            .github/workflows/diagnose-reposkop-v2.yml \
            tools/.diagnose-reposkop-v2-trigger \
            tools/finalize_reposkop_v2_consumer.py
      - name: Commit finalized migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(reposkop): finalize v2 consumer contract [generated]'
          git push origin HEAD:feat/reposkop-v2-consumer-binding
