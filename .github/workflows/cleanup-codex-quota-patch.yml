---
name: Clean Codex quota settlement patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: clean-codex-quota-settlement-patch
  cancel-in-progress: false

jobs:
  clean:
    if: github.head_ref == 'fix/codex-quota-terminal-settlement-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/codex-quota-terminal-settlement-v1
          fetch-depth: 0

      - name: Verify isolated product preimage
        run: |
          set -euo pipefail
          base="08640a73ad4b8aecd9cf974082bb8efd2c67dbfc"
          test "$(git merge-base HEAD origin/main)" = "$base"
          unexpected="$(git diff --name-only "$base" HEAD | grep -Ev '^(.github/workflows/(cleanup-codex-quota-patch.yml|codex-review-settlement.yml)|docs/external-review-loop.md|docs/generated/operator-context.v1.json|src/grabowski_grips.py|src/grabowski_merge_guard.py|tests/test_codex_review_quota_terminal_contract.py|tests/test_codex_review_settlement.py|tests/test_codex_review_settlement_workflow.py|tools/codex_review_settlement.py)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected preimage paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Apply exact quality cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          merge_guard = Path("src/grabowski_merge_guard.py")
          lines = merge_guard.read_text(encoding="utf-8").splitlines()
          anchor = '"completion_comment_id": completion.get("comment_id"),'
          indices = [index for index, line in enumerate(lines) if line.strip() == anchor]
          if len(indices) != 2:
              raise SystemExit(
                  f"merge guard: expected two completion-comment anchors, found {len(indices)}"
              )

          def replace_receipt_block(index: int, *, binding: bool) -> None:
              prefix = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              if binding:
                  expected = [
                      anchor,
                      '"review_performed": mode != "unavailable_comment",',
                      '"settlement_reason": completion.get("reason"),',
                      '"thread_ids": thread_ids,',
                      "",
                      '"unresolved_thread_ids": unresolved_thread_ids,',
                  ]
                  replacement = [
                      prefix + anchor,
                      prefix + '"review_performed": mode != "unavailable_comment",',
                      prefix + '"settlement_reason": completion.get("reason"),',
                      prefix + '"thread_ids": thread_ids,',
                      prefix + '"unresolved_thread_ids": unresolved_thread_ids,',
                  ]
              else:
                  expected = [
                      anchor,
                      '"review_performed": mode != "unavailable_comment",',
                      '"settlement_reason": completion.get("reason"),',
                      '"thread_count": len(thread_ids),',
                      "",
                      '"thread_ids_sha256": _sha256_json(thread_ids),',
                  ]
                  replacement = [
                      prefix + anchor,
                      prefix + '"review_performed": mode != "unavailable_comment",',
                      prefix + '"settlement_reason": completion.get("reason"),',
                      prefix + '"thread_count": len(thread_ids),',
                      prefix + '"thread_ids_sha256": _sha256_json(thread_ids),',
                  ]
              actual = [line.strip() for line in lines[index : index + len(expected)]]
              if actual != expected:
                  raise SystemExit(
                      f"merge guard: cleanup precondition mismatch at line {index + 1}: {actual!r}"
                  )
              lines[index : index + len(expected)] = replacement

          replace_receipt_block(indices[1], binding=True)
          replace_receipt_block(indices[0], binding=False)
          merge_guard.write_text("\n".join(lines) + "\n", encoding="utf-8")

          evaluator = Path("tools/codex_review_settlement.py")
          text = evaluator.read_text(encoding="utf-8")
          old = '        "blocking_state": False,\n    }\n\ndef _unavailable_comment_completion(\n'
          new = '        "blocking_state": False,\n    }\n\n\ndef _unavailable_comment_completion(\n'
          if text.count(old) != 1:
              raise SystemExit("evaluator: expected one top-level spacing anchor")
          evaluator.write_text(text.replace(old, new, 1), encoding="utf-8")

          contract_test = Path("tests/test_codex_review_quota_terminal_contract.py")
          text = contract_test.read_text(encoding="utf-8")
          for unused in (
              "from datetime import datetime, timezone\n",
              "import hashlib\n",
              "import json\n",
          ):
              if text.count(unused) != 1:
                  raise SystemExit(f"contract test: expected one unused import {unused!r}")
              text = text.replace(unused, "", 1)
          contract_test.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Refresh generated contracts
        run: |
          set -euo pipefail
          make context-refresh

      - name: Verify focused contracts
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_codex_review_settlement \
            tests.test_codex_review_settlement_workflow \
            tests.test_codex_review_quota_terminal_contract -v

      - name: Verify full repository
        run: |
          set -euo pipefail
          make validate

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/generated/operator-context.v1.json \
            docs/generated/operator-context.md \
            src/grabowski_merge_guard.py \
            tools/codex_review_settlement.py \
            tests/test_codex_review_quota_terminal_contract.py
          git diff --cached --check
          git commit -m "style(review): clean quota settlement contracts"
          git push origin HEAD:fix/codex-quota-terminal-settlement-v1
