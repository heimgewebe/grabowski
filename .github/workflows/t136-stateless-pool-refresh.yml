name: t136 stateless transport pool refresh

on:
  push:
    branches:
      - fix/transport-session-scope-ci-v1
    paths:
      - .github/t136-stateless-pool.patch
      - .github/workflows/t136-stateless-pool-refresh.yml

permissions:
  contents: write

concurrency:
  group: t136-stateless-pool-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/transport-session-scope-ci-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Normalize and apply reviewed stateless-pool patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/t136-stateless-pool.patch
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/t136-stateless-pool.patch")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          header = re.compile(
              r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*?)(\n)?$"
          )
          output: list[str] = []
          index = 0
          repaired = 0
          while index < len(lines):
              line = lines[index]
              match = header.match(line)
              if match is None:
                  output.append(line)
                  index += 1
                  continue
              cursor = index + 1
              old_count = 0
              new_count = 0
              while cursor < len(lines):
                  candidate = lines[cursor]
                  if candidate.startswith("@@ ") or candidate.startswith("diff --git "):
                      break
                  prefix = candidate[:1]
                  if prefix in {" ", "-"}:
                      old_count += 1
                  if prefix in {" ", "+"}:
                      new_count += 1
                  cursor += 1
              old_start = int(match.group(1))
              new_start = int(match.group(3))
              old_spec = str(old_start) if old_count == 1 else f"{old_start},{old_count}"
              new_spec = str(new_start) if new_count == 1 else f"{new_start},{new_count}"
              newline = match.group(6) or ""
              normalized = f"@@ -{old_spec} +{new_spec} @@{match.group(5)}{newline}"
              if normalized != line:
                  repaired += 1
              output.append(normalized)
              index += 1
          if repaired == 0:
              raise SystemExit("expected at least one malformed hunk count")
          path.write_text("".join(output), encoding="utf-8")
          print(f"normalized_hunks={repaired}")
          PY
          git apply --3way --exclude=tests/test_transport_roundtrip.py --check .github/t136-stateless-pool.patch
          git apply --3way --exclude=tests/test_transport_roundtrip.py .github/t136-stateless-pool.patch
          rm tests/test_transport_session_scope_runtime.py

      - name: Update stateless shared-pool documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/transport-roundtrip-gate-v1.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "When `_meta.client_id` is absent, calls use the explicit `shared_unlabeled` scope. This remains functional for connector clients that do not emit the optional metadata, but it proves only possession of the challenge response within the shared transport boundary. It does not distinguish concurrent unauthenticated clients.":
              "When `_meta.client_id` is absent, calls use the explicit `shared_unlabeled` scope. Because the production HTTP transport is stateless, that scope uses a bounded shared token pool rather than a server-session identity. Exact challenges and verifications coexist under one lock, so concurrent callers do not overwrite one another; each admitted mutation still consumes exactly one verification. The pool proves only possession within the shared transport boundary and neither attributes a token to one caller nor distinguishes concurrent unauthenticated clients.",
              "2. A still-current, unconsumed verification may be returned.\n3. Otherwise acknowledge the returned `challenge_receipt_sha256` with `action=ack`.":
              "2. A named client scope may reuse its still-current, unconsumed verification. The shared unlabeled scope always allocates a new exact challenge, subject to its bounded pool limit.\n3. Acknowledge the returned `challenge_receipt_sha256` with `action=ack`; only that pending entry becomes a verification.",
              "Challenges expire after five minutes. Completed verification expires after fifteen minutes but is single-use. Consumption is serialized under the same private state lock, preventing two admitted mutations from using one verification.":
              "Challenges expire after five minutes. Completed verification expires after fifteen minutes but is single-use. Consumption is serialized under the same private state lock, preventing two admitted mutations from using one verification. Named scopes retain one pending and one verified slot. The shared unlabeled scope is capped at 32 pending challenges and 32 verified receipts; stale or runtime-mismatched entries are pruned on the next mutation, and a full live pool blocks fail-closed.",
              "State lives below `~/.local/state/grabowski/transport-roundtrip/` with a private directory, private regular files, bounded JSON, serialized writers, atomic replacement, and file plus directory synchronization. Status reads do not create state.":
              "State lives below `~/.local/state/grabowski/transport-roundtrip/` with a private directory, private regular files, bounded JSON, serialized writers, atomic replacement, and file plus directory synchronization. Legacy single-slot state is validated and migrated on the next mutation. Status reads do not create or rewrite state.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one documentation match, got {count}: {old[:80]}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Restore canonical workflow and regenerate projections
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          make context-refresh

      - name: Run focused and full validation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH=src
          python -m unittest -v \
            tests.test_transport_roundtrip \
            tests.test_transport_gate_integration \
            tests.test_operator_contract \
            tests.test_client_snapshot \
            tests.test_repository_contract
          git diff --check
          make validate

      - name: Enforce exact changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              ".github/t136-stateless-pool.patch",
              ".github/workflows/t136-stateless-pool-refresh.yml",
              ".github/workflows/validate.yml",
              "docs/transport-roundtrip-gate-v1.md",
              "src/grabowski_transport_roundtrip.py",
              "tests/test_transport_gate_integration.py",
              "tests/test_transport_roundtrip.py",
              "tests/test_transport_session_scope_runtime.py",
          }
          lines = subprocess.check_output(
              ["git", "status", "--short"], text=True
          ).splitlines()
          paths = {line[3:] for line in lines if len(line) >= 4}
          unexpected = sorted(
              path for path in paths
              if path not in allowed and not path.startswith("docs/generated/")
          )
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          required = {
              ".github/workflows/validate.yml",
              "docs/transport-roundtrip-gate-v1.md",
              "src/grabowski_transport_roundtrip.py",
              "tests/test_transport_gate_integration.py",
              "tests/test_transport_roundtrip.py",
              "tests/test_transport_session_scope_runtime.py",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"expected changed paths missing: {missing}")
          PY

      - name: Commit product diff and remove temporary generator
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/t136-stateless-pool.patch
          git rm .github/workflows/t136-stateless-pool-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            .github/workflows/validate.yml \
            docs/transport-roundtrip-gate-v1.md \
            docs/generated \
            src/grabowski_transport_roundtrip.py \
            tests/test_transport_gate_integration.py \
            tests/test_transport_roundtrip.py \
            tests/test_transport_session_scope_runtime.py
          git diff --cached --check
          git commit -m "fix(transport): preserve stateless concurrent handshakes"
          git push origin HEAD:fix/transport-session-scope-ci-v1
