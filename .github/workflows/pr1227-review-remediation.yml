name: PR1227 review remediation

on:
  push:
    branches:
      - fix/rab-codex-stderr-contract-20260915
    paths:
      - .github/workflows/pr1227-review-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rab-codex-stderr-contract-20260915
          fetch-depth: 0

      - name: Verify exact bootstrap preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "452ae94ecd62212a9b0a0fccd707ee29470a794d"
          test "$(git rev-parse HEAD^^)" = "b8d21e6970739a289dcd5e649944d3241a91ae20"
          test "$(git rev-parse --abbrev-ref HEAD)" = "fix/rab-codex-stderr-contract-20260915"

      - name: Reuse reviewed patch with corrected test indentation
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/pr1227-review-remediation.yml > /tmp/pr1227-bootstrap-v1.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/pr1227-bootstrap-v1.yml').read_text(encoding='utf-8')
          start = "          python3 <<'PY'\n"
          end = "          PY\n\n      - name: Focused validation"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('could not recover exact prior remediation script')
          body = source.split(start, 1)[1].split(end, 1)[0]
          script = textwrap.dedent(body)
          lines = script.splitlines()
          fixed: list[str] = []
          in_test = False
          for line in lines:
              if line.startswith("insertion = r'''    def test_run_bounded_times_out_when_provider_does_not_read_stdin") or line.startswith("insertion = r'''    def test_mcp_proxy_reaps_failed_upstream_without_detaching_from_provider_group"):
                  in_test = True
                  fixed.append(line)
                  continue
              if in_test and line == "'''":
                  in_test = False
                  fixed.append(line)
                  continue
              if in_test and line:
                  fixed.append('    ' + line)
              else:
                  fixed.append(line)
          if in_test:
              raise SystemExit('unterminated regression-test insertion')
          Path('/tmp/apply-pr1227.py').write_text('\n'.join(fixed) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply-pr1227.py

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_repobrief_agent_benchmark_codex_runner
          git diff --check
          python3 tools/check_no_secrets.py

      - name: Publish remediation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1227-review-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/repobrief_agent_benchmark_codex_runner.py tests/test_repobrief_agent_benchmark_codex_runner.py .github/workflows/pr1227-review-remediation.yml
          git diff --cached --check
          git commit -m "Fix Codex runner lifecycle review findings"
          git push origin HEAD:refs/heads/fix/rab-codex-stderr-contract-20260915
