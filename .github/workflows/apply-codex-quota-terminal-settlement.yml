          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "08640a73ad4b8aecd9cf974082bb8efd2c67dbfc"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-codex-quota-terminal-settlement.yml"

