name: Apply Codex quota terminal settlement

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-codex-quota-terminal-settlement-v1
  cancel-in-progress: false

