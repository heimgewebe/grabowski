name: Bootstrap history v1 matcher

on:
  push:
    branches:
      - fix/run-outcome-taxonomy-v1-20260901

permissions:
  contents: write

concurrency:
  group: bootstrap-history-v1-matcher-20260901
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'heimgewebe/grabowski'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/run-outcome-taxonomy-v1-20260901
          fetch-depth: 5

      - name: Verify exact lineage and isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE=3c9b275e3563d9aa39bafd62ca06d401d18c17ef
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = ".github/workflows/bootstrap-history-v1-matcher.yml"

      - name: Patch history matcher and regression test by AST boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          tasks_path = Path("src/grabowski_tasks.py")
          tasks_text = tasks_path.read_text(encoding="utf-8")
          tasks_tree = ast.parse(tasks_text)
          matcher = next(
              (
                  node
                  for node in ast.walk(tasks_tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == "_chronik_history_event_matches_query"
              ),
              None,
          )
          if matcher is None:
              raise SystemExit("history matcher function not found")

          schema_if = None
          kind_if = None
          for node in matcher.body:
              if not isinstance(node, ast.If):
                  continue
              test_source = ast.get_source_segment(tasks_text, node.test) or ""
              if "schema_version" in test_source and "agent-run-event.v0" in test_source:
                  schema_if = node
              if "event.get" in test_source and "kind" in test_source and "agent.run.started" in test_source:
                  kind_if = node
          if schema_if is None or kind_if is None:
              raise SystemExit("expected schema/kind gates not found in history matcher")

          lines = tasks_text.splitlines(keepends=True)
          replacements = [
              (
                  kind_if.lineno - 1,
                  kind_if.end_lineno,
                  [
                      '    allowed_kinds = {\n',
                      '        "agent.run.started",\n',
                      '        "agent.run.completed",\n',
                      '        "agent.run.blocked",\n',
                      '    }\n',
                      '    if schema_version == "agent-run-event.v1":\n',
                      '        allowed_kinds.update(\n',
                      '            {\n',
                      '                "agent.run.failed",\n',
                      '                "agent.run.cancelled",\n',
                      '                "agent.run.timed_out",\n',
                      '                "agent.run.signalled",\n',
                      '            }\n',
                      '        )\n',
                      '    if event.get("kind") not in allowed_kinds:\n',
                      '        return False\n',
                  ],
              ),
              (
                  schema_if.lineno - 1,
                  schema_if.end_lineno,
                  [
                      '    schema_version = event.get("schema_version")\n',
                      '    if schema_version not in {"agent-run-event.v0", "agent-run-event.v1"}:\n',
                      '        return False\n',
                  ],
              ),
          ]
          for start, end, replacement in sorted(replacements, reverse=True):
              lines[start:end] = replacement
          tasks_path.write_text("".join(lines), encoding="utf-8")

          test_path = Path("tests/test_tasks.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_tree = ast.parse(test_text)
          test_class = next(
              (
                  node
                  for node in test_tree.body
                  if isinstance(node, ast.ClassDef)
                  and node.name == "ChronikCodingMemoryToolTests"
              ),
              None,
          )
          if test_class is None:
              raise SystemExit("ChronikCodingMemoryToolTests not found")
          insertion = next(
              (
                  node
                  for node in test_class.body
                  if isinstance(node, ast.FunctionDef)
                  and node.name == "test_history_component_filter_uses_chronik_source_component"
              ),
              None,
          )
          if insertion is None:
              raise SystemExit("history component matcher test anchor not found")
          if any(
              isinstance(node, ast.FunctionDef)
              and node.name == "test_history_matcher_supports_v1_execution_outcomes"
              for node in test_class.body
          ):
              raise SystemExit("v1 history matcher regression test already exists")

          new_test = '''    def test_history_matcher_supports_v1_execution_outcomes(self) -> None:
              event = json.loads(self.source.read_text(encoding="utf-8"))
              normalized = {
                  "repo": "heimgewebe/grabowski",
                  "host": "",
                  "component": "",
                  "subject_component": "",
                  "operation": "",
                  "task_class": "",
                  "outcome": "",
              }
              for kind in {
                  "agent.run.started",
                  "agent.run.completed",
                  "agent.run.failed",
                  "agent.run.cancelled",
                  "agent.run.timed_out",
                  "agent.run.signalled",
                  "agent.run.blocked",
              }:
                  with self.subTest(kind=kind):
                      candidate = json.loads(json.dumps(event))
                      candidate["schema_version"] = "agent-run-event.v1"
                      candidate["kind"] = kind
                      candidate["data"]["result"] = kind.removeprefix("agent.run.")
                      if kind == "agent.run.blocked":
                          candidate["data"]["blocker_code"] = "task-outcome-unknown"
                      else:
                          candidate["data"].pop("blocker_code", None)
                      candidate["event_id"] = tasks.chronik.event_id(candidate)
                      self.assertTrue(
                          tasks._chronik_history_event_matches_query(
                              candidate, normalized, since_timestamp=None
                          )
                      )

              legacy = json.loads(json.dumps(event))
              legacy["schema_version"] = "agent-run-event.v0"
              legacy["kind"] = "agent.run.completed"
              legacy["data"]["result"] = "completed"
              legacy["data"].pop("blocker_code", None)
              legacy["event_id"] = tasks.chronik.event_id(legacy)
              self.assertTrue(
                  tasks._chronik_history_event_matches_query(
                      legacy, normalized, since_timestamp=None
                  )
              )
              legacy["kind"] = "agent.run.failed"
              legacy["data"]["result"] = "failed"
              legacy["event_id"] = tasks.chronik.event_id(legacy)
              self.assertFalse(
                  tasks._chronik_history_event_matches_query(
                      legacy, normalized, since_timestamp=None
                  )
              )

          '''
          test_lines = test_text.splitlines(keepends=True)
          test_lines[insertion.lineno - 1:insertion.lineno - 1] = new_test.splitlines(keepends=True)
          test_path.write_text("".join(test_lines), encoding="utf-8")
          PY

      - name: Verify history gate and outcome stack
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/grabowski_tasks.py tests/test_tasks.py
          python -m unittest -q tests.test_tasks.ChronikCodingMemoryToolTests.test_history_matcher_supports_v1_execution_outcomes
          python -m unittest -q tests.test_chronik_agent_outbox tests.test_recall tests.test_run_outcome_taxonomy_contract
          git diff --check
          git diff --name-only | sort | diff -u - <(printf '%s\n' 'src/grabowski_tasks.py' 'tests/test_tasks.py')

      - name: Commit verified matcher fix and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-history-v1-matcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/grabowski_tasks.py tests/test_tasks.py .github/workflows/bootstrap-history-v1-matcher.yml
          git diff --cached --check
          git commit -m "fix: admit v1 outcomes to Chronik history"
          git push origin HEAD:fix/run-outcome-taxonomy-v1-20260901
