name: Bootstrap history v1 matcher

on:
  push:
    branches:
      - fix/run-outcome-taxonomy-v1-20260901

permissions:
  contents: write

concurrency:
  group: bootstrap-history-v1-matcher-20260901
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'heimgewebe/grabowski'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/run-outcome-taxonomy-v1-20260901
          fetch-depth: 2

      - name: Verify exact preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3c9b275e3563d9aa39bafd62ca06d401d18c17ef"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/bootstrap-history-v1-matcher.yml"

      - name: Patch history matcher and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/grabowski_tasks.py",
              '''    if event.get("schema_version") != "agent-run-event.v0":
              return False
          if event.get("kind") not in {
              "agent.run.started",
              "agent.run.completed",
              "agent.run.blocked",
          }:
              return False
          ''',
              '''    schema_version = event.get("schema_version")
          if schema_version == "agent-run-event.v0":
              allowed_kinds = {
                  "agent.run.started",
                  "agent.run.completed",
                  "agent.run.blocked",
              }
          elif schema_version == "agent-run-event.v1":
              allowed_kinds = {
                  "agent.run.started",
                  "agent.run.completed",
                  "agent.run.failed",
                  "agent.run.cancelled",
                  "agent.run.timed_out",
                  "agent.run.signalled",
                  "agent.run.blocked",
              }
          else:
              return False
          if event.get("kind") not in allowed_kinds:
              return False
          ''',
          )

          marker = "    def test_history_component_filter_uses_chronik_source_component(self) -> None:\n"
          test = '''    def test_history_matcher_supports_v1_execution_outcomes(self) -> None:
              event = json.loads(self.source.read_text(encoding="utf-8"))
              normalized = {
                  "repo": "heimgewebe/grabowski",
                  "host": "",
                  "component": "",
                  "subject_component": "",
                  "operation": "",
                  "task_class": "",
                  "outcome": "",
              }
              for kind in {
                  "agent.run.started",
                  "agent.run.completed",
                  "agent.run.failed",
                  "agent.run.cancelled",
                  "agent.run.timed_out",
                  "agent.run.signalled",
                  "agent.run.blocked",
              }:
                  with self.subTest(kind=kind):
                      candidate = json.loads(json.dumps(event))
                      candidate["schema_version"] = "agent-run-event.v1"
                      candidate["kind"] = kind
                      candidate["data"]["result"] = kind.removeprefix("agent.run.")
                      if kind == "agent.run.blocked":
                          candidate["data"]["blocker_code"] = "task-outcome-unknown"
                      else:
                          candidate["data"].pop("blocker_code", None)
                      self.assertTrue(
                          tasks._chronik_history_event_matches_query(
                              candidate, normalized, since_timestamp=None
                          )
                      )

              legacy = json.loads(json.dumps(event))
              legacy["schema_version"] = "agent-run-event.v0"
              legacy["kind"] = "agent.run.completed"
              legacy["data"]["result"] = "completed"
              legacy["data"].pop("blocker_code", None)
              self.assertTrue(
                  tasks._chronik_history_event_matches_query(
                      legacy, normalized, since_timestamp=None
                  )
              )
              legacy["kind"] = "agent.run.failed"
              legacy["data"]["result"] = "failed"
              self.assertFalse(
                  tasks._chronik_history_event_matches_query(
                      legacy, normalized, since_timestamp=None
                  )
              )

          '''
          replace_once("tests/test_tasks.py", marker, test + marker)
          PY

      - name: Verify history gate and outcome stack
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/grabowski_tasks.py tests/test_tasks.py
          python -m unittest -q tests.test_tasks.ChronikCodingMemoryToolTests.test_history_matcher_supports_v1_execution_outcomes
          python -m unittest -q tests.test_chronik_agent_outbox tests.test_recall tests.test_run_outcome_taxonomy_contract
          git diff --check
          git diff --name-only | sort | diff -u - <(printf '%s\n' 'src/grabowski_tasks.py' 'tests/test_tasks.py')

      - name: Commit verified matcher fix and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-history-v1-matcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/grabowski_tasks.py tests/test_tasks.py .github/workflows/bootstrap-history-v1-matcher.yml
          git diff --cached --check
          git commit -m "fix: admit v1 outcomes to Chronik history"
          git push origin HEAD:fix/run-outcome-taxonomy-v1-20260901
